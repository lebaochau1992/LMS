<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp học · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edot.css">
<style>
.k-row{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.k-row .k-val{font-size:22px}
.dot-n{display:inline-flex;min-width:18px;height:18px;border-radius:99px;background:var(--ems-danger);color:#fff;font:700 11px var(--font);align-items:center;justify-content:center;padding:0 5px;margin-left:4px}
.chip{border:1px solid var(--ems-border);border-radius:99px;padding:1px 9px;font-size:12px;color:var(--ems-text-2)}
.chip.bad{border-color:var(--ems-danger-line);color:var(--ems-danger);background:var(--ems-danger-bg)}
details.grp-hd{border:1px solid var(--ems-border);border-radius:var(--r-ctl);margin-bottom:8px}
details.grp-hd summary{display:flex;gap:8px;align-items:center;padding:10px 12px;cursor:pointer;background:var(--ems-surface-2);border-radius:var(--r-ctl)}
.grp-body{padding:0 12px}
.mt .cell{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--ems-surface-2);border:1px solid var(--ems-border)}
.cell{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--ems-surface-2);border:1px solid var(--ems-border);vertical-align:middle}
.cell.ok{background:var(--ems-success);border-color:var(--ems-success)} .cell.q{background:var(--ems-warning);border-color:var(--ems-warning)} .cell.cur{background:var(--ems-navy-soft);border-color:var(--ems-navy)}
.mt th,.mt td{padding:5px 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap}
.tb-list{display:flex;flex-direction:column;gap:10px}
.tb-card{border:1px solid var(--ems-border);border-radius:var(--r-card);padding:12px 14px;background:var(--ems-surface)}
.tb-card.pin{border-color:var(--ems-navy-line);box-shadow:inset 3px 0 0 var(--ems-navy)}
.tb-n{white-space:pre-wrap;margin:6px 0;font-size:13px;color:var(--ems-text-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center}
details.pv-tb{margin-top:12px}
details.pv-tb summary{cursor:pointer;font-weight:600;font-size:13px}
.ksq{border:1px solid var(--ems-border);border-radius:var(--r-ctl);padding:10px;margin-bottom:8px}
.ksq .q-n{width:22px;height:22px;border-radius:50%;background:var(--ems-navy);color:#fff;font:700 11px var(--font);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ksopt{padding:6px 0 0 30px;display:flex;flex-direction:column;gap:6px}
.res-q{border-top:1px solid var(--ems-border);padding:12px 0}
.ks-tl{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-top:6px}
.cmt{background:var(--ems-surface-2);border-radius:var(--r-ctl);padding:8px 10px;font-size:13px}
.cover{display:flex;gap:12px;align-items:center}
.cover .img{width:160px;height:90px;border-radius:var(--r-ctl);background:var(--ems-navy-soft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--ems-muted);font-size:12px;border:1px solid var(--ems-border)}

.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ems-muted)}
.steps span i{width:20px;height:20px;border-radius:50%;border:1px solid var(--ems-border-strong);display:inline-grid;place-items:center;font-style:normal;font-size:11px}
.steps span.on{color:var(--ems-navy)} .steps span.on i{background:var(--ems-navy);border-color:var(--ems-navy);color:#fff}
.steps span.done i{background:var(--ems-success);border-color:var(--ems-success);color:#fff}
.steps b{color:var(--ems-border-strong);font-weight:400}
.pick-tree{border:1px solid var(--ems-border);border-radius:8px;max-height:340px;overflow:auto}
.pick-tree .tree-row{cursor:pointer}
.pick-tree .tree-row.leaf.sel{background:var(--ems-navy-soft)}
.pick-tree .tree-row.node{font-weight:600;color:var(--ems-text-2)}
.gv-list{border:1px solid var(--ems-border);border-radius:8px;max-height:170px;overflow:auto;padding:6px 10px;display:flex;flex-direction:column;gap:4px}
.head-card{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.head-card .meta{color:var(--ems-muted);font-size:13px;margin-top:4px}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-top:1px solid var(--ems-border)}
.stat-strip div{padding:12px 16px;border-right:1px solid var(--ems-border)}
.stat-strip div:last-child{border-right:0}
.stat-strip b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat-strip span{font-size:12px;color:var(--ems-muted)}
@media (max-width:900px){.stat-strip{grid-template-columns:repeat(3,minmax(0,1fr))}.stat-strip div:nth-child(3){border-right:0}}
@media (max-width:520px){.stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.help{border:1px solid var(--ems-warning-line);background:var(--ems-warning-bg);border-radius:8px;padding:12px 14px;font-size:13px}
.help ul{margin:6px 0 0;padding-left:18px}
.help-btn{width:28px;height:28px;border-radius:50%;border:1px solid var(--ems-border-strong);background:var(--ems-surface);cursor:pointer;font-weight:700;color:var(--ems-muted)}
.help-btn.has{border-color:var(--ems-warning);color:var(--ems-warning)}
.help-btn.on{background:var(--ems-warning);color:#fff;border-color:var(--ems-warning)}
.ccm th,.ccm td{text-align:center;padding:7px 6px}.ccm th.l,.ccm td.l{text-align:left}.ccm th.nc{font-style:italic;color:var(--ems-warning)}
.ccm .c-co{color:var(--ems-success);font-weight:700}.ccm .c-vang{color:var(--ems-danger);font-weight:700;background:var(--ems-danger-bg)}.ccm .c-phep{color:var(--ems-warning);font-weight:700}
.ccm .c-dc{text-decoration:underline dotted}.ccm tr.muted td{color:var(--ems-muted)}
.nw{white-space:nowrap}.txt-bad{color:var(--ems-danger)}
.score-inp{width:64px;text-align:right;padding:4px 6px}
.lock{font-size:12px;color:var(--ems-warning)}
</style>
</head><body>
<div class="page" id="app"></div>
<script src="lms-core.js"></script>
<script src="lms-buoi.js"></script>
<script src="lms-hoidap.js"></script>
<script>
(function(){ 'use strict';
var U = LMS.ui, esc = U.esc;
var HT = { 'truc-tuyen-gv':'Trực tuyến có giảng viên', 'tu-hoc':'Tự học trực tuyến', 'xem-lai':'Xem lại học liệu' };
var TC = { 'chi-hoc':'Chỉ học', 'chung-nhan':'Có cấp chứng nhận', 'chung-chi':'Có cấp chứng chỉ' };
var HT_GHI = { 'truc-tuyen-gv':'Có lịch buổi học trực tuyến với giảng viên, điểm danh và cột điểm chuyên cần.', 'tu-hoc':'Học viên tự học theo bài giảng; không có lịch buổi học, không điểm danh, không tính chuyên cần.', 'xem-lai':'Mở học liệu cho học viên đã học xem lại; không lịch học, không điểm danh, không tính điểm.' };
/* cột Chuyên cần chỉ có ở lớp trực tuyến có giảng viên; bỏ cột thì cộng trọng số vào cột cuối, thêm cột thì lấy 10% từ cột cuối */
function dongBoCotCC(l){
  var i=l.cotDiem.findIndex(function(c){ return c.nguon==='diem-danh'; });
  if(!LMS.coDiemDanh(l) && i>=0){ var ts=l.cotDiem[i].ts; l.cotDiem.splice(i,1); db().kyThi.forEach(function(k){ if(k.lop===l.id && k.cot>i) k.cot--; }); db().baiTap && db().baiTap.forEach(function(b){ if(b.lop===l.id && b.chuyenDiem && b.chuyenDiem.cot>i) b.chuyenDiem.cot--; }); if(l.cotDiem.length) l.cotDiem[l.cotDiem.length-1].ts+=ts; return 'bỏ cột Chuyên cần ('+ts+'%)'; }
  if(LMS.coDiemDanh(l) && i<0){ var last=l.cotDiem[l.cotDiem.length-1]; if(last && last.ts>=20){ last.ts-=10; l.cotDiem.unshift({ten:'Chuyên cần',ts:10,nguon:'diem-danh'}); db().kyThi.forEach(function(k){ if(k.lop===l.id) k.cot++; }); db().baiTap && db().baiTap.forEach(function(b){ if(b.lop===l.id && b.chuyenDiem) b.chuyenDiem.cot++; }); return 'thêm cột Chuyên cần 10%'; } }
  return '';
}
var GD = { 'dang-hoc':['Đang học','ok'], 'hoan-thanh':['Hoàn thành','navy'], 'thoi-hoc':['Thôi học','bad'], 'bao-luu':['Bảo lưu','warn'], 'cho-khai-giang':['Chờ khai giảng','info'] };
var st = { view:'list', lop:null, tab:'info', q:'', khoa:'', tt:'', ct:'', help:false, tdView:'bai', td:'hv', tbF:'lop', tbQ:'' };

var p = LMS.param('lop-hoc.html');
if(p && p.lop){ st.view='detail'; st.lop=p.lop; if(p.tab) st.tab=p.tab; if(p.ks) st.ksMo=p.ks; }
if(p && p.chuongTrinh) st.ct = p.chuongTrinh;

function db(){ return LMS.db; }
function gvNames(ids){ return (ids||[]).map(function(id){ var g=LMS.byId('giangVien',id); return g?g.hoTen:'—'; }); }
function ctDesc(ctId){ var ids=[ctId], grow=true; while(grow){ grow=false; db().chuongTrinh.forEach(function(c){ if(c.cha&&ids.indexOf(c.cha)>=0&&ids.indexOf(c.id)<0){ ids.push(c.id); grow=true; } }); } return ids; }
function nextMa(){ var n=0; db().lop.forEach(function(l){ var m=+String(l.ma).replace(/\D/g,''); if(m>n) n=m; }); return 'L'+String(n+1).padStart(4,'0'); }

/* =================== DANH SÁCH =================== */
var tbl;
function renderList(){
  var d=db();
  var cnt = { 'dang-hoc':0,'tuyen-sinh':0,'ke-hoach':0,'ket-thuc':0 };
  d.lop.forEach(function(l){ if(cnt[l.trangThai]!=null) cnt[l.trangThai]++; });
  var ctName = st.ct ? LMS.name('chuongTrinh',st.ct) : '';
  var h = '<div class="page-head"><div><h1>Lớp học</h1><div class="sub">'+d.lop.length+' lớp · '+cnt['dang-hoc']+' đang học · '+cnt['tuyen-sinh']+' đang tuyển sinh</div></div><div class="actions"><button class="btn primary" id="btnNew">+ Mở lớp</button></div></div>';
  h += '<div class="kpis">'+[['dang-hoc','Đang học'],['tuyen-sinh','Đang tuyển sinh'],['ke-hoach','Lên kế hoạch'],['ket-thuc','Kết thúc']].map(function(k){ return '<div class="kpi clickable '+(st.tt===k[0]?'active':'')+'" data-tt="'+k[0]+'" tabindex="0"><div class="k-label">'+k[1]+'</div><div class="k-val">'+cnt[k[0]]+'</div></div>'; }).join('')+'</div>';
  h += '<div class="panel"><div class="panel-head filters"><input class="inp" id="q" placeholder="Tìm theo mã lớp, tên lớp, học phần…" value="'+esc(st.q)+'" aria-label="Tìm lớp">'+
       '<select class="sel" id="fKhoa" aria-label="Khoa">'+U.opts(d.donVi.filter(function(x){return x.laKhoa;}),'id','ten',st.khoa,'Tất cả khoa')+'</select>'+
       '<select class="sel" id="fTT" aria-label="Trạng thái">'+U.opts(Object.keys(LMS.TT_LOP).map(function(k){ return {id:k,ten:LMS.TT_LOP[k][0]}; }),'id','ten',st.tt,'Tất cả trạng thái')+'</select>'+
       (st.ct?'<span class="badge navy">Chương trình: '+esc(ctName)+' <button class="icon-btn" id="clrCt" aria-label="Bỏ lọc chương trình" style="padding:0 2px;font-size:12px">✕</button></span>':'')+
       '</div><div id="tbl"></div></div>';
  document.getElementById('app').innerHTML = h;
  tbl = U.table(document.getElementById('tbl'), { pageSize: 12, sort:'batDau', dir:-1,
    rows: function(){ var nq=U.norm(st.q), ids = st.ct?ctDesc(st.ct):null; return db().lop.filter(function(l){ var hp=LMS.hocPhanOfLop(l);
      if(nq && U.norm(l.ma+' '+l.ten+' '+(hp?hp.ten:'')).indexOf(nq)<0) return false;
      if(st.khoa && l.khoa!==st.khoa) return false; if(st.tt && l.trangThai!==st.tt) return false; if(ids && ids.indexOf(l.chuongTrinh)<0) return false; return true; }); },
    onRowClick: function(l){ openDetail(l.id); },
    columns: [
      { key:'ma', label:'Mã lớp', render:function(l){ return '<span class="mono">'+esc(l.ma)+'</span>'; } },
      { key:'ten', label:'Tên lớp', render:function(l){ var hp=LMS.hocPhanOfLop(l); return '<div class="t-main">'+U.hl(l.ten,st.q)+'</div><div class="t-sub">'+esc(hp?hp.ten:'')+' · '+esc(LMS.name('chuongTrinh',l.chuongTrinh))+'</div>'; } },
      { key:'khoa', label:'Khoa', render:function(l){ return esc(LMS.donViTen(l.khoa)); }, sortVal:function(l){ return LMS.donViTen(l.khoa); } },
      { key:'batDau', label:'Thời gian', render:function(l){ var t=LMS.trangThaiThoiGian(l); return '<div class="num">'+LMS.fmtDate(l.batDau)+' – '+LMS.fmtDate(l.ketThuc)+'</div><div>'+U.badge(t.label,t.tone)+'</div>'; } },
      { key:'gv', label:'Giảng viên', render:function(l){ var n=gvNames(l.giangVien); return n.length?esc(n[0])+(n.length>1?' <span class="muted">+'+(n.length-1)+'</span>':''):'<span class="badge bad">Chưa phân công</span>'; }, sortable:false },
      { key:'hv', label:'Học viên', cls:'num', render:function(l){ var n=LMS.soHV(l.id); return '<b>'+n+'</b>'+(l.sucChua?'<span class="muted">/'+l.sucChua+'</span>':''); }, sortVal:function(l){ return LMS.soHV(l.id); } },
      { key:'td', label:'Tiến độ / kế hoạch', w:'200px', render:function(l){ if(l.trangThai!=='dang-hoc') return '<span class="muted">—</span>'; var s=LMS.lopStats(l.id); if(s.tienDo==null) return '<span class="muted">Chưa có dữ liệu</span>'; return U.prog(s.tienDo, s.tienDo < s.keHoach-15?'bad':s.tienDo<s.keHoach-5?'warn':'', s.tienDo+'% · KH '+s.keHoach+'%'); }, sortVal:function(l){ var s=l.trangThai==='dang-hoc'?LMS.lopStats(l.id):null; return s&&s.tienDo!=null?s.tienDo-s.keHoach:null; } },
      { key:'trangThai', label:'Trạng thái', render:function(l){ var t=LMS.TT_LOP[l.trangThai]; return U.badge(t[0],t[1]); } },
      { key:'x', label:'', sortable:false, render:function(l){ return '<button class="icon-btn" data-m="'+l.id+'" aria-label="Thao tác">⋯</button>'; } }
    ],
    after: function(host){ host.querySelectorAll('[data-m]').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); rowMenu(b, LMS.byId('lop',b.dataset.m)); }; }); }
  });
  document.getElementById('q').oninput=function(){ st.q=this.value; tbl.render(true); };
  document.getElementById('fKhoa').onchange=function(){ st.khoa=this.value; tbl.render(true); };
  document.getElementById('fTT').onchange=function(){ st.tt=this.value; renderList(); };
  document.querySelectorAll('[data-tt]').forEach(function(k){ k.onclick=function(){ st.tt = st.tt===k.dataset.tt?'':k.dataset.tt; renderList(); }; });
  var c=document.getElementById('clrCt'); if(c) c.onclick=function(){ st.ct=''; renderList(); };
  document.getElementById('btnNew').onclick=function(){ wizard(); };
}
function rowMenu(btn, l){
  U.menu(btn, [
    { label:'Xem chi tiết', onClick:function(){ openDetail(l.id); } },
    { label:'Nhân bản lớp', onClick:function(){ cloneLop(l); } },
    { label:'Chuyển trạng thái', onClick:function(){ changeStatus(btn,l); } },
    '-',
    { label:'Hủy lớp', danger:true, disabled: l.trangThai==='huy'||l.trangThai==='ket-thuc', onClick:function(){ cancelLop(l); } },
    { label:'Xóa lớp', danger:true, onClick:function(){ deleteLop(l); } }
  ]);
}

/* =================== MỞ LỚP (3 bước) =================== */
function wizard(){
  var w = { step:1, hp:null, ct:null, q:'', f:{ ma:nextMa(), ten:'', khoa:'', hinhThuc:'truc-tuyen-gv', gv:[], batDau:'', ketThuc:'', sucChua:40, khoanThu:'', tuDangKy:true, diemDat:5 } };
  var api = U.modal({ title:'Mở lớp', size:'lg', body:'<div></div>', noFocus:true, foot:[
    { label:'Hủy' },
    { label:'Quay lại', id:'wBack', close:false, onClick:function(){ if(w.step>1){ collect(); w.step--; paint(); } return false; } },
    { label:'Tiếp tục', id:'wNext', cls:'primary', close:false, onClick:function(){ next(); return false; } }
  ]});
  function steps(){ return '<div class="steps">'+['Chọn học phần','Thông tin lớp','Xác nhận'].map(function(t,i){ var n=i+1; return (i?'<b>—</b>':'')+'<span class="'+(n===w.step?'on':n<w.step?'done':'')+'"><i>'+(n<w.step?'✓':n)+'</i>'+t+'</span>'; }).join('')+'</div>'; }
  function tree(){
    var d=db(), nq=U.norm(w.q), h='';
    function hpMatch(hp){ return !nq || U.norm(hp.ma+' '+hp.ten).indexOf(nq)>=0; }
    function nodeMatch(c){ if(!nq) return true; if(U.norm(c.ma+' '+c.ten).indexOf(nq)>=0) return true; if(c.hocPhan.some(function(id){ return hpMatch(LMS.byId('hocPhan',id)); })) return true; return d.chuongTrinh.some(function(x){ return x.cha===c.id && nodeMatch(x); }); }
    function walk(pid, lv){ d.chuongTrinh.filter(function(c){ return c.cha===pid && c.trangThai!=='ngung'; }).forEach(function(c){ if(!nodeMatch(c)) return;
      h += '<div class="tree-row node" style="padding-left:'+(10+lv*18)+'px">▾ '+U.hl(c.ten,w.q)+' <span class="muted small">'+esc(c.ma)+'</span></div>';
      c.hocPhan.forEach(function(id){ var hp=LMS.byId('hocPhan',id); if(!hp||hp.trangThai!=='hoat-dong'||(!hpMatch(hp)&&!(nq&&U.norm(c.ten).indexOf(nq)>=0))) return; var mins=hp.bai.reduce(function(a,b){return a+b.phut;},0);
        h += '<div class="tree-row leaf '+(w.hp===hp.id&&w.ct===c.id?'sel':'')+'" data-hp="'+hp.id+'" data-ct="'+c.id+'" style="padding-left:'+(28+lv*18)+'px" tabindex="0"><input type="radio" name="hpPick" '+(w.hp===hp.id&&w.ct===c.id?'checked':'')+' aria-label="Chọn '+esc(hp.ten)+'"> <span class="t-main">'+U.hl(hp.ten,w.q)+'</span> <span class="mono muted">'+esc(hp.ma)+'</span><span class="right muted small">'+hp.bai.length+' bài · '+Math.round(mins/60*10)/10+' giờ · '+hp.soTC+' TC</span></div>'; });
      walk(c.id, lv+1); }); }
    walk(null,0);
    return h || '<div class="empty">Không tìm thấy chương trình hoặc học phần phù hợp</div>';
  }
  function paint(){
    var b=api.body, d=db(), f=w.f, h=steps();
    if(w.step===1){
      h += '<div class="field"><label for="wq">Tìm chương trình hoặc học phần</label><input class="inp" id="wq" placeholder="Gõ tên hoặc mã, không cần dấu" value="'+esc(w.q)+'"></div><div class="pick-tree" id="wTree">'+tree()+'</div>';
      if(w.hp){ var hp=LMS.byId('hocPhan',w.hp); h += '<div class="note info">Đã chọn: <b>'+esc(hp.ten)+'</b> trong '+esc(LMS.name('chuongTrinh',w.ct))+' · '+hp.bai.length+' bài giảng</div>'; }
    }
    if(w.step===2){
      var hp2=LMS.byId('hocPhan',w.hp); if(!f.khoa) f.khoa=hp2.khoa;
      var gvs = d.giangVien.filter(function(g){ return g.trangThai!=='ngung'; }).sort(function(a,b){ return (a.donVi===f.khoa?0:1)-(b.donVi===f.khoa?0:1); });
      h += '<div class="form-grid">'+
        '<div class="field"><label>Mã lớp</label><input class="inp mono" name="ma" value="'+esc(f.ma)+'" readonly></div>'+
        '<div class="field"><label for="w_ten">Tên lớp <span class="req">*</span></label><input class="inp" id="w_ten" name="ten" value="'+esc(f.ten)+'" placeholder="VD: Lớp '+esc(hp2.ten)+' - K28"></div>'+
        '<div class="field"><label for="w_khoa">Khoa quản lý <span class="req">*</span></label><select class="sel" id="w_khoa" name="khoa">'+U.opts(d.donVi.filter(function(x){return x.laKhoa;}),'id','ten',f.khoa,'Chọn khoa')+'</select></div>'+
        '<div class="field"><label for="w_ht">Hình thức học</label><select class="sel" id="w_ht" name="hinhThuc">'+U.opts(Object.keys(HT).map(function(k){return {id:k,ten:HT[k]};}),'id','ten',f.hinhThuc)+'</select><div class="hint">'+esc(HT_GHI[f.hinhThuc]||'')+'</div></div>'+

    }

    back.disabled = w.step===1; nextBtn.textContent = w.step===3?'Tạo lớp':'Tiếp tục';
    if(w.step===1){
      var qi=b.querySelector('#wq'); qi.oninput=function(){ w.q=this.value; b.querySelector('#wTree').innerHTML=tree(); bindTree(); }; setTimeout(function(){ qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length); },20);

/* =================== CHI TIẾT =================== */
function openDetail(id){ st.view='detail'; st.lop=id; st.tab = st.tab||'info'; render(); window.scrollTo(0,0); }
function constraints(l){
  var n=LMS.soHV(l.id), s=LMS.lopStats(l.id), r=[];
  var coDD = db().buoiHoc.some(function(b){ return b.lop===l.id && b.diemDanh; });
  var coDiem = db().baiLam.some(function(b){ var k=LMS.byId('kyThi',b.ky); return k && k.lop===l.id; });
  var coTien = db().thanhToan.some(function(t){ return t.lop===l.id && t.trangThai==='da-thanh-toan'; });
  var dk = db().dangKy.some(function(d){ return d.lop===l.id && d.trangThai==='cho-duyet'; });
  var lockHP = n>0 || l.trangThai==='dang-hoc' || dk;
  if(n>0) r.push('Lớp đã có '+n+' học viên ghi danh: không đổi học phần, sức chứa không nhỏ hơn '+n+'.');
  if(dk) r.push('Còn đơn đăng ký chờ duyệt: không đổi học phần.');
  if(l.trangThai==='dang-hoc') r.push('Lớp đang học: không đổi học phần, ngày bắt đầu.');
  if(coDD) r.push('Đã điểm danh buổi học: không đổi hình thức học.');
  if(coDiem) r.push('Đã có bài thi: không đổi cấu hình cột điểm gắn kỳ thi.');
  if(coTien) r.push('Đã có học viên nộp học phí: không bỏ khoản thu.');
  if(l.trangThai==='ket-thuc'||l.trangThai==='huy') r.push('Lớp '+LMS.TT_LOP[l.trangThai][0].toLowerCase()+': toàn bộ thông tin chỉ xem.');
  return { list:r, lockHP:lockHP, lockHT:coDD, lockBD:l.trangThai==='dang-hoc', lockAll:l.trangThai==='ket-thuc'||l.trangThai==='huy', lockKT:coTien, minSC:n, coDiem:coDiem };
}

    U.toast('Đã lưu thông tin lớp','ok'); renderDetail();
  };
}

function reasonBox(title,ok,cb,danger){ U.modal({title:title,size:'sm',body:'<div class="field"><label for="rs">Lý do <span class="req">*</span></label><textarea id="rs" name="r"></textarea></div>',foot:[{label:'Hủy'},{label:ok,cls:danger?'danger solid':'primary',onClick:function(api){ var v=U.formVals(api.body).r; if(!v){ U.fieldErr(api.body,'r','Nhập lý do'); return false; } cb(v); }}]}); }
function addHV(l){
  var d=db(), inLop={}; d.ghiDanh.forEach(function(g){ if(g.lop===l.id && g.trangThai!=='thoi-hoc') inLop[g.hv]=1; });
  var sel={}, q='';
  var api=U.modal({title:'Thêm học viên vào '+l.ma, size:'lg', body:'<div class="filters"><input class="inp" id="aq" placeholder="Tìm theo họ tên, mã, CCCD, SĐT…"></div><div id="aList" style="max-height:380px;overflow:auto;border:1px solid var(--ems-border);border-radius:8px"></div><div class="muted small" id="aInfo"></div>',
    foot:[{label:'Hủy'},{label:'Thêm vào lớp',cls:'primary',onClick:function(){ var ids=Object.keys(sel); if(!ids.length){ U.toast('Chưa chọn học viên','bad'); return false; } var cur=LMS.soHV(l.id); if(l.sucChua && cur+ids.length>l.sucChua){ U.toast('Vượt sức chứa: còn '+(l.sucChua-cur)+' chỗ','bad'); return false; }
      var tt = l.trangThai==='dang-hoc'?'dang-hoc':'cho-khai-giang';
      ids.forEach(function(id){ d.ghiDanh.push({id:LMS.nextId('gd'),lop:l.id,hv:id,ngay:LMS.iso(LMS.TODAY),trangThai:tt,hinhThuc:'moi'}); });
      LMS.commit('Ghi danh','Lớp học',l.ma+' · thêm '+ids.length+' học viên'); U.toast('Đã thêm '+ids.length+' học viên vào lớp','ok'); renderDetail(); }}]});
  function paint(){ var nq=U.norm(q); var list=d.hocVien.filter(function(h){ return h.trangThai!=='vo-hieu' && (!nq||U.norm(h.hoTen+' '+h.ma+' '+h.cccd+' '+h.sdt).indexOf(nq)>=0); }).slice(0,80);
    api.body.querySelector('#aList').innerHTML = '<table class="tbl"><tbody>'+list.map(function(h){ var dis=inLop[h.id]; return '<tr><td style="width:32px"><input type="checkbox" data-a="'+h.id+'"'+(sel[h.id]?' checked':'')+(dis?' disabled':'')+' aria-label="Chọn"></td><td>'+U.person(h.hoTen,esc(h.ma)+' · '+esc(h.sdt))+'</td><td>'+(dis?U.badge('Đã trong lớp',''):'')+(h.taiKhoan?'':U.badge('Chưa có tài khoản','warn'))+'</td></tr>'; }).join('')+'</tbody></table>';
    api.body.querySelector('#aInfo').textContent='Đã chọn '+Object.keys(sel).length+' học viên'+(l.sucChua?' · lớp còn '+Math.max(0,l.sucChua-LMS.soHV(l.id))+' chỗ':'');
    api.body.querySelectorAll('[data-a]').forEach(function(c){ c.onchange=function(){ if(c.checked) sel[c.dataset.a]=1; else delete sel[c.dataset.a]; api.body.querySelector('#aInfo').textContent='Đã chọn '+Object.keys(sel).length+' học viên'; }; }); }
  api.body.querySelector('#aq').oninput=function(){ q=this.value; paint(); }; paint();
}
function pasteHV(l){
  U.modal({title:'Nhập học viên theo mã',body:'<div class="field"><label for="pm">Mã học viên, mỗi dòng một mã hoặc cách nhau bằng dấu phẩy</label><textarea id="pm" name="m" placeholder="HV0012&#10;HV0045"></textarea></div><div id="pmRes"></div>',foot:[{label:'Đóng'},{label:'Kiểm tra',close:false,onClick:function(api){ var codes=U.formVals(api.body).m.split(/[\s,;]+/).filter(Boolean).map(function(x){return x.toUpperCase();}); var d=db(), ok=[], dup=[], miss=[];
    codes.forEach(function(c){ var h=d.hocVien.find(function(x){return x.ma===c;}); if(!h) miss.push(c); else if(d.ghiDanh.some(function(g){return g.lop===l.id&&g.hv===h.id&&g.trangThai!=='thoi-hoc';})) dup.push(c); else ok.push(h); });

    return false; }}]});

function moveHV(l,g){

function bangChuyenCan(host,l,ctx){
  var BU=LMS.buoiUI, bs=LMS.buoiCuaLop(l.id).filter(function(b){ return !b.huy && b.diemDanh; });
  var gds=db().ghiDanh.filter(function(g){ return g.lop===l.id && g.trangThai!=='cho-khai-giang'; });
  st.ccLoc=st.ccLoc||false;
  var rows=gds.map(function(g){ var hv=LMS.byId('hocVien',g.hv); return {g:g,hv:hv,cc:LMS.chuyenCanHV(l.id,g.hv)}; }).filter(function(r){ return r.hv && (!st.ccLoc || (r.cc && r.cc.pct<LMS.CC_CANH_BAO)); });
  rows.sort(function(a,b){ return a.hv.ma<b.hv.ma?-1:1; });
  if(!bs.length){ host.innerHTML='<div class="empty">Chưa có buổi học nào có kết quả điểm danh</div>'; return; }
  var SY={co:['✓','c-co'],vang:['V','c-vang'],phep:['P','c-phep']};
  var h='<div class="row" style="margin-bottom:8px"><label class="check"><input type="checkbox" id="ccLoc"'+(st.ccLoc?' checked':'')+'> Chỉ học viên chuyên cần dưới '+LMS.CC_CANH_BAO+'%</label><span class="muted small">✓ có mặt · M có mặt, đi muộn · V vắng · P có phép · chấm dưới: điều chỉnh sau rà soát · cột in nghiêng: chưa chốt</span><button class="btn sm right" id="ccCsv">Xuất CSV</button></div>';
  h+='<div class="tbl-wrap"><table class="tbl ccm"><thead><tr><th class="l">Mã HV</th><th class="l">Họ và tên</th>'+bs.map(function(b){ return '<th class="'+(b.chot?'':'nc')+'" title="'+esc(b.ten+' · '+LMS.fmtDate(b.ngay)+(b.chot?'':' · chưa chốt'))+'"><button class="lnk" data-cb="'+b.id+'">'+esc(b.ten.replace('Buổi ','B'))+'</button><div class="t-sub">'+LMS.fmtDate(b.ngay).slice(0,5)+'</div></th>'; }).join('')+'<th>Có mặt</th><th>Có phép</th><th>Vắng</th><th>Chuyên cần</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr'+(r.g.trangThai==='thoi-hoc'?' class="muted"':'')+'><td class="l"><span class="mono">'+esc(r.hv.ma)+'</span></td><td class="l nw">'+esc(r.hv.hoTen)+(r.g.trangThai==='thoi-hoc'?' <span class="tag">thôi học</span>':'')+'</td>';
    bs.forEach(function(b){ var v=b.diemDanh[r.hv.id]; if(!v){ h+='<td class="muted">·</td>'; return; } var a=b.thamGia?LMS.ddTuDong(b,r.hv.id):null, sy=SY[v], t=sy[0]; if(v==='co'&&a&&a.muon) t='M'; var dc=(b.dieuChinh||{})[r.hv.id]; h+='<td class="'+sy[1]+(dc?' c-dc':'')+'" title="'+esc(BU.TT[v][0]+(a&&a.vao?' · '+a.phut+' phút ('+a.pct+'%)':'')+(dc?' · điều chỉnh: '+dc.ghiChu:''))+'">'+t+'</td>'; });
    var c=r.cc; h+='<td class="num">'+(c?c.co:'—')+'</td><td class="num">'+(c?c.phep:'—')+'</td><td class="num">'+(c?c.vang:'—')+'</td><td class="num"><b style="color:'+(c&&c.pct<LMS.CC_NGUY_CO?'var(--ems-danger)':c&&c.pct<LMS.CC_CANH_BAO?'var(--ems-warning)':'inherit')+'">'+(c?c.pct+'%':'—')+'</b></td></tr>';
  });
  if(!rows.length) h+='<tr><td colspan="'+(bs.length+6)+'" class="muted" style="text-align:center;padding:16px">Không có học viên dưới ngưỡng</td></tr>';
  h+='</tbody></table></div>';
  host.innerHTML=h;

  document.getElementById('ccCsv').onclick=function(){ var out=[['Mã HV','Họ và tên'].concat(bs.map(function(b){ return b.ten+' '+LMS.fmtDate(b.ngay); })).concat(['Có mặt','Có phép','Vắng','Chuyên cần (%)'])]; rows.forEach(function(r){ out.push([r.hv.ma,r.hv.hoTen].concat(bs.map(function(b){ var v=b.diemDanh[r.hv.id]; return v?BU.TT[v][0]:''; })).concat(r.cc?[r.cc.co,r.cc.phep,r.cc.vang,r.cc.pct]:['','','',''])); }); csv('chuyen-can-'+l.ma+'.csv',out); };
}

    h+='<div class="res-q"><div class="row" style="gap:6px"><span class="muted">'+(i+1)+'.</span><b>'+esc(q.noiDung)+'</b><span class="badge">'+KS_LOAI[q.loai]+'</span><span class="right muted small">'+vals.length+' trả lời</span></div>';
    if(q.loai==='thang'){ var c=[0,0,0,0,0]; vals.forEach(function(v){ c[v-1]++; }); var avg=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:0; h+='<div class="row small" style="margin:4px 0"><span>Điểm TB <b>'+avg.toFixed(2).replace('.',',')+'</b>/5</span><span class="muted">· đồng ý (4–5): '+(vals.length?Math.round((c[3]+c[4])/vals.length*100):0)+'%</span>'+(avg&&avg<3.5?' '+U.badge('Cần cải thiện','warn'):'')+'</div><div data-hb="'+i+'"></div>'; q._c=[5,4,3,2,1].map(function(x){ return {label:x+' điểm',value:c[x-1],text:c[x-1]+' ('+(vals.length?Math.round(c[x-1]/vals.length*100):0)+'%)',tone:x>=4?'ok':x===3?'':'warn'}; }); }
    else if(q.loai==='lua-chon'||q.loai==='nhieu'){ var cc=q.luaChon.map(function(){ return 0; }); vals.forEach(function(v){ (Array.isArray(v)?v:[v]).forEach(function(j){ if(cc[j]!=null) cc[j]++; }); }); q._c=q.luaChon.map(function(o,j){ return {label:o,value:cc[j],text:cc[j]+' ('+(vals.length?Math.round(cc[j]/vals.length*100):0)+'%)'}; }); h+='<div data-hb="'+i+'"></div>'; }
    else { h+=vals.length?'<div class="ks-tl">'+vals.map(function(v,j){ var p=k.phieu.filter(function(x){ return x.tl[q.id]===v; })[0]; return '<div class="cmt">'+esc(v)+(k.anDanh?'':'<div class="t-sub">'+esc(LMS.name('hocVien',p.hv,'hoTen'))+'</div>')+'</div>'; }).join('')+'</div>':'<div class="muted small">Chưa có ý kiến</div>'; }
    h+='</div>';
  });
  if(chua.length) h+='<details style="margin-top:12px"><summary><b>'+chua.length+' học viên chưa phản hồi</b></summary><div class="row" style="gap:4px;margin-top:6px">'+chua.map(function(x){ var hv=LMS.byId('hocVien',x); return '<span class="tag">'+esc(hv.hoTen)+'</span>'; }).join('')+'</div></details>';
  var api=U.modal({title:k.ten,size:'lg',body:h,foot:[{label:'Đóng'}].concat(n?[{label:'Xuất CSV',onClick:function(){ ksCsv(k); return false; }}]:[]).concat(s.key==='mo'&&chua.length?[{label:'Nhắc '+chua.length+' học viên',cls:'primary',onClick:function(){ ksNhac(l,k); }}]:[])});
  k.cauHoi.forEach(function(q,i){ var el=api.body.querySelector('[data-hb="'+i+'"]'); if(el && q._c) U.hbars(el,q._c,{max:Math.max(1,n)}); delete q._c; });
}
function ksCsv(k){ var head=['Thời điểm'].concat(k.anDanh?[]:['Mã HV','Họ tên']).concat(k.cauHoi.map(function(q,i){ return (i+1)+'. '+q.noiDung; })); csv('khao-sat-'+k.id+'.csv',[head].concat(k.phieu.map(function(p){ var hv=LMS.byId('hocVien',p.hv)||{}; return [LMS.fmtDT(p.luc)].concat(k.anDanh?[]:[hv.ma,hv.hoTen]).concat(k.cauHoi.map(function(q){ var v=p.tl[q.id]; if(v==null) return ''; if(q.loai==='lua-chon') return q.luaChon[v]; if(q.loai==='nhieu') return v.map(function(j){ return q.luaChon[j]; }).join('; '); return v; })); }))); }

/* =================== thao tác trạng thái =================== */
function changeStatus(btn,l){
  var n=LMS.soHV(l.id), hp=LMS.hocPhanOfLop(l);
  function missing(){ var m=[]; if(!l.giangVien.length) m.push('chưa phân công giảng viên'); if(!hp||!hp.bai.length) m.push('học phần chưa có bài giảng'); if(!l.khoa) m.push('chưa chọn khoa'); return m; }
  function go(tt,label,extra){ var b=l.trangThai; if(extra) extra(); l.trangThai=tt; if(tt==='tuyen-sinh') l.tuDangKy=true; LMS.commit(label,'Lớp học',l.ma,{trangThai:LMS.TT_LOP[b][0]},{trangThai:LMS.TT_LOP[tt][0]}); U.toast(l.ma+': '+LMS.TT_LOP[tt][0],'ok'); render(); }
  var items=[];
  if(l.trangThai==='ke-hoach') items.push({label:'Mở tuyển sinh',onClick:function(){ var m=missing(); if(m.length){ U.blocked('Chưa thể mở tuyển sinh',m.map(function(x){return 'Lớp '+x;}),'Bổ sung ở tab Thông tin lớp.'); return; } go('tuyen-sinh','Mở tuyển sinh'); }});
  if(l.trangThai==='ke-hoach'||l.trangThai==='tuyen-sinh') items.push({label:'Bắt đầu học',onClick:function(){ var m=missing(); if(!n) m.push('chưa có học viên ghi danh'); if(m.length){ U.blocked('Chưa thể bắt đầu học',m.map(function(x){return 'Lớp '+x;})); return; }
    U.confirm({title:'Bắt đầu học '+l.ma,message:n+' học viên chờ khai giảng sẽ chuyển sang Đang học. Học phần, ngày bắt đầu sẽ bị khóa.',ok:'Bắt đầu học'}).then(function(ok){ if(ok) go('dang-hoc','Bắt đầu học',function(){ db().ghiDanh.forEach(function(g){ if(g.lop===l.id&&g.trangThai==='cho-khai-giang') g.trangThai='dang-hoc'; }); }); }); }});
  if(l.trangThai==='dang-hoc') items.push({label:'Kết thúc lớp',onClick:function(){ var s=LMS.lopStats(l.id); var chua=LMS.buoiCuaLop(l.id).filter(function(b){return !b.huy && LMS.parse(b.ngay)>=LMS.TODAY;}).length; var warn=[]; if(chua) warn.push(chua+' buổi học chưa diễn ra sẽ bị hủy'); if(s.buoiChuaDD) warn.push(s.buoiChuaDD+' buổi chưa có điểm danh'); if(s.buoiChoXN) warn.push(s.buoiChoXN+' buổi chờ giảng viên xác nhận điểm danh'); if(s.coDiem<s.dangHoc) warn.push((s.dangHoc-s.coDiem)+' học viên chưa đủ điểm tổng kết');
    U.confirm({title:'Kết thúc lớp '+l.ma,html:'Học viên đang học chuyển sang Hoàn thành; lớp chuyển sang chỉ xem.'+(warn.length?'<ul>'+warn.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':''),ok:'Kết thúc lớp',danger:!!warn.length}).then(function(ok){ if(ok) go('ket-thuc','Kết thúc lớp',function(){ db().ghiDanh.forEach(function(g){ if(g.lop===l.id&&g.trangThai==='dang-hoc') g.trangThai='hoan-thanh'; }); db().buoiHoc.forEach(function(b){ if(b.lop===l.id&&LMS.parse(b.ngay)>=LMS.TODAY) b.huy=true; }); }); }); }});
  if(l.trangThai==='tuyen-sinh') items.push({label:'Tạm dừng tuyển sinh (về Lên kế hoạch)',onClick:function(){ go('ke-hoach','Tạm dừng tuyển sinh',function(){ l.tuDangKy=false; }); }});
  if(!items.length){ U.toast('Lớp '+LMS.TT_LOP[l.trangThai][0].toLowerCase()+', không còn trạng thái để chuyển'); return; }
  U.menu(btn,items);
}
function cancelLop(l){
  var paid=db().thanhToan.filter(function(t){ return t.lop===l.id && t.trangThai==='da-thanh-toan'; }).length;
  if(l.trangThai==='dang-hoc'){ U.blocked('Không hủy được lớp đang học',['Lớp '+l.ma+' đang học với '+LMS.soHV(l.id)+' học viên'],'Dùng Kết thúc lớp hoặc chuyển học viên sang lớp khác trước.'); return; }
  reasonBox('Hủy lớp '+l.ma+(paid?' · '+paid+' học viên đã nộp phí sẽ cần hoàn tiền':''),'Hủy lớp',function(r){ var b=l.trangThai; l.trangThai='huy'; l.lyDoHuy=r; l.tuDangKy=false; db().ghiDanh.forEach(function(g){ if(g.lop===l.id&&g.trangThai!=='hoan-thanh') g.trangThai='thoi-hoc'; }); db().dangKy.forEach(function(x){ if(x.lop===l.id&&x.trangThai!=='da-duyet') x.trangThai='tu-choi'; }); LMS.commit('Hủy lớp','Lớp học',l.ma+' · '+r,{trangThai:LMS.TT_LOP[b][0]},{trangThai:'Đã hủy'}); U.toast('Đã hủy lớp '+l.ma+(paid?'. Xử lý hoàn tiền ở Thu học phí':''),'ok'); render(); },true);
}
function deleteLop(l){
  var refs=LMS.refsOf('lop',l.id).concat(db().thanhToan.filter(function(t){return t.lop===l.id;}).length?[db().thanhToan.filter(function(t){return t.lop===l.id;}).length+' đơn thu học phí']:[]);
  if(refs.length){ U.blocked('Không thể xóa lớp '+l.ma,refs,'Lớp đã phát sinh dữ liệu học tập. Dùng Hủy lớp hoặc Kết thúc lớp để giữ lịch sử.'); return; }
  U.confirm({title:'Xóa lớp '+l.ma,message:'Lớp chưa có dữ liệu học tập. Xóa lớp và các buổi học đã lên lịch?',ok:'Xóa lớp',danger:true}).then(function(ok){ if(!ok) return; var d=db(); d.lop=d.lop.filter(function(x){return x.id!==l.id;}); d.buoiHoc=d.buoiHoc.filter(function(b){return b.lop!==l.id;}); delete d.tienDo[l.id]; LMS.commit('Xóa','Lớp học',l.ma+' · '+l.ten); U.toast('Đã xóa lớp '+l.ma,'ok'); st.view='list'; render(); });
}
function cloneLop(l){
  var len=LMS.daysBetween(l.batDau,l.ketThuc), bd=LMS.addDays(LMS.TODAY,30);
  var nl=JSON.parse(JSON.stringify(l)); nl.id=LMS.nextId('lop'); nl.ma=nextMa(); nl.ten=l.ten.replace(/K(\d+)/,function(m,k){ return 'K'+(+k+1); }); if(nl.ten===l.ten) nl.ten=l.ten+' (bản sao)'; nl.batDau=LMS.iso(bd); nl.ketThuc=LMS.iso(LMS.addDays(bd,len)); nl.trangThai='ke-hoach'; nl.tuDangKy=false; nl.cotDiem.forEach(function(c){ c.kyThi=null; }); delete nl.siSoSeed;
  db().lop.push(nl); db().tienDo[nl.id]={}; LMS.commit('Nhân bản','Lớp học',l.ma+' → '+nl.ma); U.toast('Đã tạo '+nl.ma+' từ '+l.ma+'. Kiểm tra lại ngày và giảng viên.','ok'); openDetail(nl.id);
}
function csv(name,rows){ var txt='﻿'+rows.map(function(r){ return r.map(function(c){ c=String(c==null?'':c); return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(','); }).join('\n');
  try{ var u=URL.createObjectURL(new Blob([txt],{type:'text/csv'})); var a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1500); U.toast('Đã xuất '+name,'ok'); }
  catch(e){ U.modal({title:name,size:'lg',body:'<textarea style="min-height:320px;font-family:var(--mono);font-size:12px" readonly>'+esc(txt)+'</textarea>'}); } }

function render(){ if(st.view==='detail') renderDetail(); else renderList(); }
render();
LMS.onChange(render);
})();
</script>
