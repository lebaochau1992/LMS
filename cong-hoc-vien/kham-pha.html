<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng học viên · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../edot.css">
<link rel="stylesheet" href="hv.css">
<link rel="stylesheet" href="kham-pha.css">
</head><body>
<script src="../lms-core.js"></script>
<script src="hv-core.js"></script>
<script>
(function () {
  'use strict';
  /* Trang Khám phá khóa học: trang mặc định của Cổng học viên.
     Khách chưa có tài khoản: tìm hiểu, chọn học phần, gửi đơn đăng ký.
     Học viên đã đăng nhập: quay lại việc học trong một thao tác, xem học phần tiếp theo trong lộ trình. */
  var U = LMS.ui, esc = U.esc, KMODE = 'egoLmsDemo.kp';
  var TODAY = LMS.TODAY, DAY = 86400000;
  var f = { q: '', khoa: '', tt: '', ht: '', phi: '', sx: 'uu-tien' };
  var VAI = (function () { var v = HV.qp('vai'); if (v === 'khach' || v === 'hv') { luuVai(v); return v; } try { v = localStorage.getItem(KMODE); } catch (e) { v = null; } return v === 'hv' ? 'hv' : 'khach'; })();
  function luuVai(v) { try { localStorage.setItem(KMODE, v); } catch (e) { } }
  function D() { return LMS.db; }
  function laHV() { return VAI === 'hv'; }

  /* ---------- dữ liệu ---------- */
  function phiL(l) { var k = l.khoanThu ? LMS.byId('khoanThu', l.khoanThu) : null; return k ? k.donGia : 0; }
  function baiHP(hp) { return hp.bai.filter(function (b) { return b.xuatBan !== false && b.hien !== false; }); }
  function phutHP(hp) { return baiHP(hp).reduce(function (s, b) { return s + (b.phut || 0); }, 0); }
  function hanDK(l) { return LMS.addDays(LMS.parse(l.batDau), -1); }
  function conNgay(d) { return Math.ceil((d - TODAY) / DAY); }
  function conCho(l) { return l.sucChua ? Math.max(0, l.sucChua - LMS.soHV(l.id) - D().dangKy.filter(function (d) { return d.lop === l.id && (d.trangThai === 'cho-duyet' || d.trangThai === 'cho-thanh-toan'); }).length) : null; }
  function moDK(l) { return l.trangThai === 'tuyen-sinh' && l.tuDangKy !== false && hanDK(l) >= TODAY && conCho(l) !== 0; }
  function lopHP(hp) { return D().lop.filter(function (l) { return l.hocPhan === hp.id && ['tuyen-sinh', 'dang-hoc', 'ket-thuc'].indexOf(l.trangThai) >= 0; }); }
  function hps() { return D().hocPhan.filter(function (h) { return h.trangThai === 'hoat-dong' && baiHP(h).length && lopHP(h).length; }); }
  function moLop() { return D().lop.filter(moDK).sort(function (a, b) { return a.batDau < b.batDau ? -1 : 1; }); }
  function ttHP(hp) {
    var ls = lopHP(hp), mo = ls.filter(moDK).sort(function (a, b) { return a.batDau < b.batDau ? -1 : 1; });
    if (mo.length) return { k: 'ts', ls: mo };
    var dang = ls.filter(function (l) { return l.trangThai === 'dang-hoc'; });
    if (dang.length) return { k: 'dang', ls: dang };
    return { k: 'chua', ls: [] };
  }
  var TT = { ts: ['Đang tuyển sinh', 'ok'], dang: ['Đang diễn ra', 'navy'], chua: ['Chưa mở đợt mới', ''] };
  function lopThamChieu(hp) { var st = ttHP(hp); if (st.ls.length) return st.ls[0]; return lopHP(hp).sort(function (a, b) { return a.batDau < b.batDau ? 1 : -1; })[0]; }
  function gvHP(hp) { var o = []; lopHP(hp).sort(function (a, b) { return moDK(a) === moDK(b) ? (a.batDau < b.batDau ? 1 : -1) : moDK(a) ? -1 : 1; }).forEach(function (l) { l.giangVien.forEach(function (g) { if (o.indexOf(g) < 0) o.push(g); }); }); return o; }
  function ctHP(hp) { return D().chuongTrinh.filter(function (c) { return (c.hocPhan || []).indexOf(hp.id) >= 0; })[0]; }
  function kyHieu(hp) { var c = ctHP(hp); return c ? c.ma : hp.ma.slice(0, 4); }
  function khoaNgan(id) { return LMS.donViTen(id).replace(/^Khoa /, ''); }
  function lichTomTat(l) {
    var bs = LMS.buoiCuaLop(l.id).filter(function (b) { return !b.huy; });
    if (!bs.length) return l.hinhThuc === 'tu-hoc' ? 'Tự học theo lộ trình, không có buổi học cố định' : 'Công bố trước ngày khai giảng';
    var m = {}; bs.forEach(function (b) { var k = LMS.THU[LMS.parse(b.ngay).getDay()] + ' ' + b.gio + '–' + b.den; m[k] = (m[k] || 0) + 1; });
    return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).slice(0, 2).join(', ') + ' · ' + bs.length + ' buổi trực tuyến';
  }
  function giaHP(hp) { var l = lopThamChieu(hp); return l ? phiL(l) : 0; }
  function nhanTin() { D().nhanTin = D().nhanTin || []; return D().nhanTin; }
  function daNhanTin(hp) { return laHV() && nhanTin().some(function (x) { return x.hp === hp.id && x.hv === HV.id(); }); }

  /* trạng thái của học viên đang đăng nhập với một học phần */
  function meHP(hp) {
    if (!laHV()) return null;
    var ids = lopHP(hp).map(function (l) { return l.id; }), pr = ['dang-hoc', 'cho-khai-giang', 'bao-luu', 'hoan-thanh'];
    var g = HV.gds().filter(function (x) { return ids.indexOf(x.lop) >= 0 && pr.indexOf(x.trangThai) >= 0; }).sort(function (a, b) { return pr.indexOf(a.trangThai) - pr.indexOf(b.trangThai); })[0];
    if (g) return { k: g.trangThai, l: LMS.byId('lop', g.lop) };
    var d = D().dangKy.filter(function (x) { return x.hv === HV.id() && ids.indexOf(x.lop) >= 0 && (x.trangThai === 'cho-duyet' || x.trangThai === 'cho-thanh-toan'); })[0];
    return d ? { k: 'don', l: LMS.byId('lop', d.lop), d: d } : null;
  }
  function tienDo(l) { return HV.tienDoLop(l); }

  /* ---------- lọc ---------- */
  function locDS() {
    var n = U.norm(f.q);
    var list = hps().filter(function (hp) {
      var st = ttHP(hp), ls = lopHP(hp);
      if (n && U.norm([hp.ten, hp.ma, hp.moTa, LMS.donViTen(hp.khoa)].concat(gvHP(hp).map(HV.gvTen)).concat(ls.map(function (l) { return l.ma + ' ' + l.ten; })).concat(baiHP(hp).map(function (b) { return b.ten; })).join(' ')).indexOf(n) < 0) return false;
      if (f.khoa && hp.khoa !== f.khoa) return false;
      if (f.tt && st.k !== f.tt) return false;
      if (f.ht && !(st.ls.length ? st.ls : ls).some(function (l) { return l.hinhThuc === f.ht; })) return false;
      if (f.phi && (f.phi === 'mien' ? giaHP(hp) > 0 : !giaHP(hp))) return false;
      return true;
    });
    var ord = { ts: 0, dang: 1, chua: 2 };
    list.sort(function (a, b) {
      var sa = ttHP(a), sb = ttHP(b);
      if (f.sx === 'ten') return a.ten.localeCompare(b.ten, 'vi');
      if (f.sx === 'tc') return b.soTC - a.soTC || a.ten.localeCompare(b.ten, 'vi');
      if (f.sx === 'khai-giang') { var x = sa.k === 'ts' ? sa.ls[0].batDau : '9', y = sb.k === 'ts' ? sb.ls[0].batDau : '9'; return x < y ? -1 : x > y ? 1 : a.ten.localeCompare(b.ten, 'vi'); }
      return ord[sa.k] - ord[sb.k] || (sa.k === 'ts' && sa.ls[0].batDau !== sb.ls[0].batDau ? (sa.ls[0].batDau < sb.ls[0].batDau ? -1 : 1) : a.ten.localeCompare(b.ten, 'vi'));
    });
    return list;
  }

  /* ---------- phần tử giao diện ---------- */
  function ic(k, w) { return HV.svg(k, w); }
  function ngayThang(d) { d = LMS.parse(d); return '<span class="kp-date"><b>' + String(d.getDate()).padStart(2, '0') + '</b><small>TH ' + (d.getMonth() + 1) + '</small></span>'; }
  function header() {
    var nav = '<nav class="kp-nav" id="kpNav"><a href="#khoa-hoc" class="on">Khóa học</a><a href="#lo-trinh">Lộ trình đào tạo</a>' + (laHV() ? '<a href="#giang-vien">Giảng viên</a>' : '<a href="#cach-dang-ky">Hướng dẫn đăng ký</a>') + '<a href="#tra-cuu">Tra cứu</a><a href="#hoi-dap">Hỏi đáp</a></nav>';
    var act;
    if (laHV()) {
      var h = HV.me(), nb = HV.tbChuaDoc().length;
      act = '<div class="kp-act"><a class="icon-btn kp-bell hide-m" href="thong-bao.html" aria-label="Thông báo" title="Thông báo">' + ic('bell', 18) + (nb ? '<span class="dot">' + nb + '</span>' : '') + '</a><a class="btn primary" href="index.html"><span class="hide-m">Vào Cổng học viên</span><span class="show-m">Vào học</span></a><button class="kp-user" id="kpUser" aria-haspopup="true"><span class="avatar">' + esc(U.initials(h.hoTen)) + '</span><span class="hide-m">' + esc(h.hoTen.split(' ').slice(-1)[0]) + '</span></button><button class="icon-btn kp-ham" id="kpHam" aria-label="Mở menu">' + ic('menu', 18) + '</button></div>';
    } else {
      act = '<div class="kp-act"><button class="btn" id="kpLogin">Đăng nhập</button><a class="btn primary hide-m" href="#khoa-hoc" data-go-ts>Đăng ký học</a><button class="icon-btn kp-ham" id="kpHam" aria-label="Mở menu">' + ic('menu', 18) + '</button></div>';
    }
    return '<header class="kp-top" id="kpTop"><div class="kp-wrap"><a class="kp-brand" href="kham-pha.html"><span class="seal">VUTM</span><span><b>Cổng đào tạo trực tuyến</b><small>Học viện Y Dược học cổ truyền Việt Nam</small></span></a>' + nav + act + '</div></header>';
  }
  function heroKhach() {
    var mo = moLop(), ds = hps();
    var nHV = {}; D().ghiDanh.forEach(function (g) { nHV[g.hv] = 1; });
    var nCN = D().ghiDanh.filter(function (g) { return g.trangThai === 'hoan-thanh'; }).length;
    var nGV = D().giangVien.filter(function (g) { return g.trangThai !== 'ngung'; }).length;
    var khoa = D().donVi.filter(function (d) { return d.laKhoa && ds.some(function (h) { return h.khoa === d.id; }); });
    var s = '<section class="kp-hero"><div class="kp-wrap"><div><span class="eb"><span class="kp-dot"></span>Đợt tuyển sinh tháng ' + (mo.length ? LMS.parse(mo[0].batDau).getMonth() + 1 : TODAY.getMonth() + 1) + '/' + TODAY.getFullYear() + '</span>';
    s += '<h1>Học phần Y học cổ truyền trực tuyến, có giảng viên đồng hành</h1><p class="lead">Bài giảng video theo lộ trình, buổi học trực tuyến với giảng viên, kiểm tra có giám sát và chứng nhận hoàn thành có mã tra cứu. Tài khoản học tập do Học viện cấp sau khi đơn đăng ký được duyệt.</p>';
    s += '<form class="kp-srch" id="kpSrch" role="search"><input id="kpQ" placeholder="Tìm học phần, bài giảng, giảng viên…" value="' + esc(f.q) + '" aria-label="Tìm khóa học"><button class="btn primary" type="submit">Tìm khóa học</button></form>';
    s += '<div class="kp-chips"><button data-chip="tt:ts">Đang tuyển sinh (' + ds.filter(function (h) { return ttHP(h).k === 'ts'; }).length + ')</button><button data-chip="phi:mien">Miễn phí</button>' + khoa.map(function (k) { return '<button data-chip="khoa:' + k.id + '">' + esc(khoaNgan(k.id)) + '</button>'; }).join('') + '</div>';
    s += '<div class="kp-stats"><div><b>' + ds.length + '</b><span>học phần trực tuyến</span></div><div><b>' + nGV + '</b><span>giảng viên phụ trách</span></div><div><b>' + Object.keys(nHV).length + '</b><span>học viên đã theo học</span></div><div><b>' + nCN + '</b><span>chứng nhận đã cấp</span></div></div></div>';
    s += '<aside class="kp-intake"><h3>Lớp đang nhận đăng ký</h3><div class="small muted" style="margin-bottom:6px">Đăng ký trực tuyến đến hết hạn của từng lớp</div>';
    s += mo.length ? mo.slice(0, 3).map(function (l) { var hp = LMS.hocPhanOfLop(l), c = conNgay(hanDK(l)), p = phiL(l); return '<div class="it" data-hp="' + hp.id + '" tabindex="0">' + ngayThang(l.batDau) + '<span class="tx"><b>' + esc(l.ten) + '</b><small>Khai giảng ' + LMS.fmtDate(l.batDau) + ' · ' + esc(HV.HT[l.hinhThuc] || '') + '</small><small>Hạn đăng ký ' + LMS.fmtDate(hanDK(l)) + ' · <span class="kp-count">còn ' + c + ' ngày</span> · ' + (p ? U.money(p) : 'miễn phí') + '</small></span></div>'; }).join('') + '<a class="btn primary" style="width:100%;justify-content:center;margin-top:8px" href="#khoa-hoc" data-go-ts>Xem lớp đang tuyển sinh</a>'
      : '<div class="note info">Hiện chưa có lớp nhận đăng ký. Chọn "Nhận thông báo" ở học phần quan tâm để được báo khi mở đợt mới.</div>';
    return s + '</aside></div></section>';
  }
  function tiepTuc() {
    var tiep = null; HV.dangHoc().forEach(function (x) { var t = HV.td(x.l.id), bs = HV.baiCua(x.l); if (t.done < bs.length && (!tiep || (t.lastAt || '') > (tiep.t.lastAt || ''))) tiep = { l: x.l, b: bs[t.done], t: t }; });
    return tiep;
  }
  function heroHV() {
    var h = HV.me(), dh = HV.dangHoc(), vc = HV.viecCanLam(), live = vc.filter(function (v) { return v.ic === 'video' && v.uu === 0; })[0], tiep = tiepTuc();
    var ten = h.hoTen.split(' ').slice(-1)[0];
    var s = '<section class="kp-me"><div class="kp-wrap"><h1>Chào ' + esc(ten) + '</h1><div class="sub">' + LMS.THU[TODAY.getDay()] + ', ' + LMS.fmtDate(TODAY) + ' · ' + dh.length + ' lớp đang học · ' + vc.length + ' việc cần làm</div><div class="kp-me-grid">';
    s += '<div class="kp-card">' + (live ? '<div class="kp-live"><span class="ic">' + ic('video') + '</span><span style="flex:1;min-width:0"><b style="display:block;font-size:13.5px">' + esc(live.t) + '</b><span class="small muted">' + esc(live.s) + '</span></span><a class="btn primary sm" href="' + live.go + '">' + esc(live.cta) + '</a></div>' : '');
    if (tiep) { var dk = HV.dieuKienBai(tiep.l, tiep.b), p = tienDo(tiep.l); s += '<div class="eyebrow">Tiếp tục học</div><b style="font-size:16px;display:block">' + esc(tiep.b.ten) + '</b><div class="small muted" style="margin:2px 0 8px">' + esc(tiep.l.ten) + ' · ' + tiep.b.phut + ' phút · tiến độ lớp ' + p.done + '/' + p.tong + ' bài</div><div class="pbar"><span style="width:' + p.pct + '%"></span></div><div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap"><a class="btn primary" href="' + HV.url('hoc.html', { lop: tiep.l.id, bai: tiep.b.id }) + '">' + ic('play', 14) + ' Học tiếp</a><a class="btn" href="lop-cua-toi.html">Lớp của tôi</a><a class="btn" href="lich-hoc.html">Lịch học</a></div>' + (dk.xem ? '' : ''); }
    else s += '<div class="eyebrow">Lớp của tôi</div><div class="muted">Bạn chưa có lớp đang học. Chọn học phần đang tuyển sinh bên dưới để đăng ký.</div>';
    s += '</div><div class="kp-card"><div class="row" style="align-items:center"><div class="eyebrow" style="margin:0">Việc cần làm</div><a class="small" style="margin-left:auto;color:var(--ems-navy);font-weight:600" href="index.html">Tất cả ở Tổng quan ›</a></div><div class="kp-todo" style="margin-top:6px">';
    var ds = vc.filter(function (v) { return v !== live; }).slice(0, 4);
    s += ds.length ? ds.map(function (v) { return '<a href="' + v.go + '"><span class="ic">' + ic(v.ic) + '</span><span class="tx"><b>' + esc(v.t) + '</b><small>' + esc(v.s) + '</small></span><span class="go">' + esc(v.cta) + ' ›</span></a>'; }).join('') : '<div class="muted small" style="padding:10px 0">Không có việc cần xử lý.</div>';
    return s + '</div></div></div></div></section>';
  }
  function card(hp) {
    var st = ttHP(hp), me = meHP(hp), bs = baiHP(hp), gv = gvHP(hp), o = st.ls[0], gia = giaHP(hp);
    var s = '<article class="kc" data-hp="' + hp.id + '" tabindex="0" aria-label="' + esc(hp.ten) + '"><div class="kc-cv ' + HV.coverCls({ hocPhan: hp.id }) + '"><span class="k">' + esc(khoaNgan(hp.khoa)) + '</span><span class="m">' + esc(hp.ma) + ' · ' + hp.soTC + ' tín chỉ</span><span class="st">' + (me ? U.badge({ 'dang-hoc': 'Bạn đang học', 'hoan-thanh': 'Đã hoàn thành', 'cho-khai-giang': 'Đã ghi danh', 'bao-luu': 'Đang bảo lưu', don: 'Đơn chờ xử lý' }[me.k], me.k === 'hoan-thanh' ? 'ok' : 'navy') : U.badge(TT[st.k][0], TT[st.k][1])) + '</span><span class="glyph">' + esc(kyHieu(hp)) + '</span></div>';
    s += '<div class="kc-bd"><h3>' + esc(hp.ten) + '</h3><div class="meta">' + bs.length + ' bài giảng · ' + Math.round(phutHP(hp) / 60) + ' giờ học liệu · ' + esc(HV.HT[(me ? me.l : (o || lopThamChieu(hp))).hinhThuc] || '') + '</div><div class="meta">Giảng viên: ' + (gv.length ? esc(gv.slice(0, 2).map(HV.gvTen).join(', ')) + (gv.length > 2 ? ' và ' + (gv.length - 2) + ' giảng viên khác' : '') : 'Tự học có hướng dẫn') + '</div>';
    if (me) {
      var l = me.l;
      if (me.k === 'dang-hoc') { var p = tienDo(l); s += '<div class="kc-in me">Bạn đang học lớp <b>' + esc(l.ma) + '</b> · ' + p.done + '/' + p.tong + ' bài<div class="pbar" style="margin-top:6px"><span style="width:' + p.pct + '%"></span></div></div>'; }
      else if (me.k === 'hoan-thanh') s += '<div class="kc-in ok">Bạn đã hoàn thành học phần tại lớp <b>' + esc(l.ma) + '</b></div>';
      else if (me.k === 'cho-khai-giang') s += '<div class="kc-in me">Đã ghi danh lớp <b>' + esc(l.ma) + '</b> · khai giảng ' + LMS.fmtDate(l.batDau) + '</div>';
      else if (me.k === 'bao-luu') s += '<div class="kc-in">Đang bảo lưu tại lớp <b>' + esc(l.ma) + '</b></div>';
      else s += '<div class="kc-in me">Đơn đăng ký lớp <b>' + esc(l.ma) + '</b> đang ' + (me.d.trangThai === 'cho-thanh-toan' ? 'chờ thanh toán' : 'chờ Phòng Đào tạo duyệt') + '</div>';
    } else if (st.k === 'ts') {
      var c = conNgay(hanDK(o)), cc = conCho(o);
      s += '<div class="kc-in ok"><b>Khai giảng ' + LMS.fmtDate(o.batDau) + '</b> · lớp ' + esc(o.ma) + '<br>Hạn đăng ký ' + LMS.fmtDate(hanDK(o)) + ' · <span class="kp-count">còn ' + c + ' ngày</span>' + (cc != null ? ' · còn ' + cc + '/' + o.sucChua + ' chỗ' : '') + (st.ls.length > 1 ? '<br>và ' + (st.ls.length - 1) + ' lớp khác đang tuyển sinh' : '') + '</div>';
    } else if (st.k === 'dang') s += '<div class="kc-in">Lớp ' + esc(o.ma) + ' đang học đến ' + LMS.fmtDate(o.ketThuc) + '. Đợt tiếp theo chưa công bố.</div>';
    else s += '<div class="kc-in">Chưa có lớp mở. Nhận thông báo khi Học viện mở đợt mới.</div>';
    s += '</div><div class="kc-ft">';
    if (me) s += '<span class="small muted">' + (me.k === 'hoan-thanh' ? 'Đã đạt' : me.k === 'don' ? 'Đơn ' + esc(me.d.ma || '') : 'Lớp ' + esc(me.l.ma)) + '</span>' + ctaHV(me);

        if (cu && D().dangKy.some(function (d) { return d.hv === cu.id && d.lop === l.id && (d.trangThai === 'cho-duyet' || d.trangThai === 'cho-thanh-toan'); })) { tr.innerHTML = '<div class="note warn" style="margin-bottom:12px">Bạn đã gửi đơn đăng ký lớp này, đơn đang chờ xử lý. Tra cứu trạng thái bằng mã đơn trong email xác nhận.</div>'; a.body.scrollTop = 0; return false; }
        if (cu && cu.cccd !== v.cccd) { loi('email', 'Email đã dùng cho hồ sơ khác'); return false; }
        var h = cu;
        if (!h) {
          var n = D().hocVien.reduce(function (m, x) { return Math.max(m, +String(x.ma).replace(/\D/g, '') || 0); }, 0) + 1;
          h = { id: 'hv' + n, ma: 'HV' + String(n).padStart(4, '0'), hoTen: v.hoTen.replace(/\s+/g, ' '), gioiTinh: v.gioiTinh, ngaySinh: v.ngaySinh, cccd: v.cccd, sdt: v.sdt, email: v.email, diaChi: '', noiCongTac: v.noiCongTac, doiTuong: v.doiTuong, trangThai: 'hoat-dong', taiKhoan: null, ngayTao: LMS.iso(TODAY), nguon: 'dang-ky-truc-tuyen' };
          D().hocVien.push(h);
        }
        var d = { id: LMS.nextId('dk'), ma: maDon(), lop: l.id, hv: h.id, ngay: LMS.iso(TODAY), trangThai: p ? 'cho-thanh-toan' : 'cho-duyet', kenh: 'dang-ky-truc-tuyen', doiTuong: v.doiTuong }; D().dangKy.push(d);
        if (p) D().thanhToan.push({ id: LMS.nextId('tt'), ma: 'DH' + d.ma.slice(2), hv: h.id, lop: l.id, khoanThu: l.khoanThu, soTien: p, trangThai: 'cho-thanh-toan', kenh: '—', ngay: LMS.iso(TODAY) });
        LMS.commit('Đơn đăng ký học trực tuyến', 'Đăng ký học', l.ma + ' · ' + h.hoTen + ' · ' + d.ma);
        a.close(); render(true);
        U.modal({ title: 'Đã gửi đơn đăng ký', body: '<div class="kp-ok"><div class="tick">' + ic('check') + '</div><b style="font-size:16px">Mã đơn <span class="mono">' + d.ma + '</span></b><div class="small muted">Xác nhận đã gửi tới ' + esc(h.email) + '</div><ol>' + (p ? '<li>Chuyển khoản ' + U.money(p) + ' theo hướng dẫn trong email, nội dung ghi mã đơn ' + d.ma + '.</li>' : '') + '<li>Phòng Đào tạo duyệt đơn trong 2 ngày làm việc.</li><li>Tài khoản học tập và hướng dẫn vào lớp gửi tới email trước ngày khai giảng ' + LMS.fmtDate(l.batDau) + '.</li><li>Tra cứu trạng thái đơn bằng mã đơn và 4 số cuối điện thoại tại mục Tra cứu.</li></ol></div>' });
        return false;
      } }] });
    api.body.querySelector('#dnNhanh').onclick = function (e) { e.preventDefault(); api.close(); dangNhap(l.id); };
  }
  function dangNhap(sauDK) {
    var tk = HV.tk();
    var api = U.modal({ title: 'Đăng nhập', body: '<div class="field"><label>Tên đăng nhập</label><input class="inp" name="u" value="' + esc(tk ? tk.ten : HV.me().ma.toLowerCase()) + '" autocomplete="username"></div><div class="field" style="margin-top:10px"><label>Mật khẩu</label><input class="inp" type="password" name="p" autocomplete="current-password"></div><div class="row" style="margin-top:8px"><a href="#" id="quen" class="small" style="color:var(--ems-navy);font-weight:600">Quên mật khẩu?</a></div><div id="quenBox"></div><div class="note info" style="margin-top:12px">Tài khoản học tập do Học viện cấp. Chưa có tài khoản: chọn lớp đang tuyển sinh và gửi đơn đăng ký.</div><div class="small muted" style="margin-top:8px">Bản demo: đăng nhập với học viên ' + esc(HV.me().hoTen) + ', mật khẩu bất kỳ.</div>',
      foot: [{ label: 'Hủy', close: true }, { label: 'Đăng nhập', cls: 'primary', onClick: function (a) {
        var v = U.formVals(a.body);
        if (!v.u || !v.p) { U.fieldErr(a.body, 'u', v.u ? '' : 'Nhập tên đăng nhập'); U.fieldErr(a.body, 'p', v.p ? '' : 'Nhập mật khẩu'); return false; }
        VAI = 'hv'; luuVai(VAI);
        if (sauDK) { a.close(); render(false); window.scrollTo(0, 0); dangKy(LMS.byId('lop', sauDK)); return false; }
        location.href = 'index.html';
      } }] });
    api.body.querySelector('#quen').onclick = function (e) { e.preventDefault(); api.body.querySelector('#quenBox').innerHTML = '<div class="kp-row" style="margin-top:8px"><input class="inp" type="email" id="qe" placeholder="Email đã đăng ký"><button class="btn" id="qg">Gửi liên kết</button></div>'; api.body.querySelector('#qg').onclick = function () { var em = api.body.querySelector('#qe').value.trim(); if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)) { U.toast('Email không đúng định dạng', 'bad'); return; } U.toast('Nếu email có trong hệ thống, liên kết đặt lại mật khẩu đã được gửi', 'ok'); api.body.querySelector('#quenBox').innerHTML = ''; }; };
  }
  function nhanThongBao(hp) {
    if (laHV()) { nhanTin().push({ hp: hp.id, hv: HV.id(), email: HV.me().email, luc: new Date().toISOString() }); LMS.commit(null); U.toast('Học viện sẽ báo qua email ' + HV.me().email + ' khi mở lớp ' + hp.ten, 'ok'); render(true); return; }
    U.modal({ title: 'Nhận thông báo mở lớp', body: '<div class="small muted" style="margin-bottom:10px">' + esc(hp.ten) + ' · ' + esc(hp.ma) + '</div><div class="field"><label>Email nhận thông báo</label><input class="inp" type="email" name="em"></div>', foot: [{ label: 'Hủy', close: true }, { label: 'Đăng ký nhận tin', cls: 'primary', onClick: function (a) { var em = U.formVals(a.body).em; if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(em)) { U.fieldErr(a.body, 'em', 'Email không đúng định dạng'); return false; } nhanTin().push({ hp: hp.id, email: em, luc: new Date().toISOString() }); LMS.commit(null); U.toast('Đã ghi nhận. Học viện gửi thông báo tới ' + em + ' khi mở lớp mới.', 'ok'); } }] });
  }
  function yeuCauDonVi() {
    U.modal({ title: 'Yêu cầu đào tạo cho đơn vị', body: '<div class="kp-form"><div class="field full"><label>Tên đơn vị <span class="req">*</span></label><input class="inp" name="dv"></div><div class="field"><label>Người liên hệ <span class="req">*</span></label><input class="inp" name="nguoi"></div><div class="field"><label>Điện thoại <span class="req">*</span></label><input class="inp mono" name="sdt" maxlength="10"></div><div class="field"><label>Email <span class="req">*</span></label><input class="inp" type="email" name="email"></div><div class="field"><label>Số người học dự kiến</label><input class="inp" type="number" min="1" name="sl"></div><div class="field full"><label>Học phần quan tâm</label><select class="sel" name="hp">' + U.opts(hps(), 'id', 'ten', '', 'Chọn học phần') + '</select></div></div>', foot: [{ label: 'Hủy', close: true }, { label: 'Gửi yêu cầu', cls: 'primary', onClick: function (a) { var v = U.formVals(a.body), ok = true; [['dv', !v.dv], ['nguoi', !v.nguoi], ['sdt', !/^0\d{9}$/.test(v.sdt)], ['email', !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v.email)]].forEach(function (x) { U.fieldErr(a.body, x[0], x[1] ? 'Kiểm tra lại thông tin' : ''); if (x[1]) ok = false; }); if (!ok) return false; D().yeuCauDonVi = D().yeuCauDonVi || []; D().yeuCauDonVi.push({ id: LMS.nextId('yc'), luc: new Date().toISOString(), donVi: v.dv, nguoi: v.nguoi, sdt: v.sdt, email: v.email, soLuong: +v.sl || null, hp: v.hp }); LMS.commit('Yêu cầu đào tạo của đơn vị', 'Đăng ký học', v.dv); U.toast('Đã gửi yêu cầu. Phòng Đào tạo liên hệ lại trong 2 ngày làm việc.', 'ok'); } }] });
  }
  function traCN(ma) {
    var box = document.getElementById('kqCN'), m = String(ma || '').trim().toUpperCase().match(/^VUTM-([A-Z0-9]+)-(\d{1,6})$/);
    if (!m) { box.innerHTML = '<div class="kp-res bad">Mã không đúng định dạng. Mã chứng nhận có dạng VUTM-mã học phần-số hiệu học viên.</div>'; return; }
    var hp = D().hocPhan.filter(function (h) { return h.ma === m[1]; })[0], hv = D().hocVien.filter(function (h) { return h.ma === 'HV' + m[2].padStart(4, '0'); })[0];
    var g = hp && hv ? D().ghiDanh.filter(function (x) { var l = LMS.byId('lop', x.lop); return x.hv === hv.id && x.trangThai === 'hoan-thanh' && l && l.hocPhan === hp.id; })[0] : null;
    if (!g) { box.innerHTML = '<div class="kp-res bad">Không tìm thấy chứng nhận với mã <b class="mono">' + esc(m[0]) + '</b>. Kiểm tra lại mã hoặc liên hệ Phòng Đào tạo.</div>'; return; }
    var l = LMS.byId('lop', g.lop);
    box.innerHTML = '<div class="kp-res ok"><b>' + ic('check', 14) + ' Chứng nhận hợp lệ</b><dl><dt>Người học</dt><dd>' + esc(hv.hoTen) + '</dd><dt>Học phần</dt><dd>' + esc(hp.ten) + ' · ' + hp.soTC + ' tín chỉ</dd><dt>Lớp</dt><dd>' + esc(l.ma) + ' · ' + LMS.fmtDate(l.batDau) + ' – ' + LMS.fmtDate(l.ketThuc) + '</dd><dt>Ngày cấp</dt><dd>' + LMS.fmtDate(LMS.addDays(LMS.parse(l.ketThuc), 10)) + '</dd><dt>Đơn vị cấp</dt><dd>Học viện Y Dược học cổ truyền Việt Nam</dd></dl></div>';
  }
  function traDon(ma, s4) {
    var box = document.getElementById('kqDon'); ma = String(ma || '').trim().toUpperCase(); s4 = String(s4 || '').trim();
    if (!/^DK\d{6}$/.test(ma) || !/^\d{4}$/.test(s4)) { box.innerHTML = '<div class="kp-res bad">Nhập mã đơn dạng DK123456 và đúng 4 số cuối điện thoại.</div>'; return; }
    var d = D().dangKy.filter(function (x) { return x.ma === ma; })[0], h = d ? LMS.byId('hocVien', d.hv) : null;
    if (!d || !h || String(h.sdt).slice(-4) !== s4) { box.innerHTML = '<div class="kp-res bad">Không tìm thấy đơn phù hợp. Kiểm tra lại mã đơn trong email xác nhận.</div>'; return; }
    var l = LMS.byId('lop', d.lop), TTD = { 'cho-thanh-toan': 'Chờ thanh toán', 'cho-duyet': 'Chờ Phòng Đào tạo duyệt', 'da-duyet': 'Đã duyệt, đã ghi danh', 'tu-choi': 'Không được duyệt', 'da-huy': 'Đã hủy' };
    box.innerHTML = '<div class="kp-res ' + (d.trangThai === 'tu-choi' || d.trangThai === 'da-huy' ? 'bad' : 'ok') + '"><b>' + esc(TTD[d.trangThai] || d.trangThai) + '</b><dl><dt>Người đăng ký</dt><dd>' + esc(h.hoTen) + '</dd><dt>Lớp</dt><dd>' + esc(l.ten) + ' · ' + esc(l.ma) + '</dd><dt>Ngày gửi</dt><dd>' + LMS.fmtDate(d.ngay) + '</dd>' + (d.lyDo ? '<dt>Lý do</dt><dd>' + esc(d.lyDo) + '</dd>' : '') + '</dl>' + (d.trangThai === 'da-duyet' ? '<div class="small" style="margin-top:8px">Tài khoản học tập đã gửi tới email ' + esc(h.email.replace(/^(.{2}).*(@.*)$/, '$1•••$2')) + '.</div>' : '') + '</div>';
  }

  render(false);
  var hq = HV.qp('hp'); if (hq && LMS.byId('hocPhan', hq)) chiTiet(LMS.byId('hocPhan', hq), HV.qp('tab'));
  var dq = HV.qp('dk'); if (dq && LMS.byId('lop', dq)) dangKy(LMS.byId('lop', dq));
})();
</script>
