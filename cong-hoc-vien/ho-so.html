<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng học viên · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../edot.css">
<link rel="stylesheet" href="hv.css">
</head><body>
<script src="../lms-core.js"></script>
<script src="hv-core.js"></script>
<script>
(function () {
  'use strict';
  var U = LMS.ui, esc = U.esc, tab = HV.qp('tab') || 'tt';
  var LOAI = [['hoc-tap', 'Học tập, tài liệu mới'], ['lich-hoc', 'Lịch học, đổi lịch, hủy buổi'], ['bai-tap', 'Bài tập, hạn nộp'], ['thi', 'Kỳ thi, công bố điểm'], ['hoi-dap', 'Trả lời câu hỏi của tôi'], ['khan', 'Thông báo khẩn']];
  function render() {
    var app = HV.shell('ho-so.html', { title: 'Hồ sơ' }), h = HV.me(), tk = HV.tk();
    app.innerHTML = '<div class="page-head"><div style="display:flex;gap:14px;align-items:center"><span class="avatar" style="width:56px;height:56px;font-size:18px">' + esc(U.initials(h.hoTen)) + '</span><div><h1>' + esc(h.hoTen) + '</h1><div class="sub"><span class="mono">' + esc(h.ma) + '</span> · ' + esc(tk ? tk.ten : '') + ' · ' + esc(h.email) + '</div></div></div></div><div id="tabs"></div><div id="tb"></div>';
    HV.tabs(document.getElementById('tabs'), [['tt', 'Thông tin cá nhân'], ['ls', 'Quá trình học tập'], ['tb', 'Cài đặt thông báo'], ['bm', 'Bảo mật']], tab, function (t) { tab = t; history.replaceState(null, '', HV.url('ho-so.html', { tab: t })); render(); });
    var host = document.getElementById('tb');
    if (tab === 'tt') {
      host.innerHTML = '<div class="two"><div class="panel"><div class="panel-head"><h2>Thông tin định danh</h2><span class="muted small" style="margin-left:auto">Phòng đào tạo quản lý</span></div><div class="panel-body"><dl class="kv"><dt>Mã học viên</dt><dd class="mono">' + esc(h.ma) + '</dd><dt>Họ và tên</dt><dd>' + esc(h.hoTen) + '</dd><dt>Giới tính</dt><dd>' + esc(h.gioiTinh || '—') + '</dd><dt>Ngày sinh</dt><dd>' + LMS.fmtDate(h.ngaySinh) + '</dd><dt>CCCD</dt><dd class="mono">' + esc(h.cccd ? h.cccd.slice(0, 3) + '•••••' + h.cccd.slice(-4) : '—') + '</dd><dt>Email</dt><dd>' + esc(h.email) + '</dd></dl><div class="small muted" style="margin-top:10px">Cần sửa thông tin định danh, gửi yêu cầu kèm giấy tờ tới Phòng đào tạo.</div><button class="btn sm" id="yc" style="margin-top:8px">Gửi yêu cầu điều chỉnh</button></div></div><div class="panel"><div class="panel-head"><h2>Thông tin liên hệ</h2></div><div class="panel-body stack"><div class="field"><label>Số điện thoại</label><input class="inp" name="sdt" value="' + esc(h.sdt || '') + '" inputmode="tel"></div><div class="field"><label>Địa chỉ liên hệ</label><input class="inp" name="dc" value="' + esc(h.diaChi || '') + '"></div><div class="field"><label>Đơn vị công tác</label><input class="inp" name="dv" value="' + esc(h.donViCT || '') + '" placeholder="Bệnh viện, cơ sở y tế (nếu có)"></div><div><button class="btn primary" id="luu">Lưu thay đổi</button></div></div></div></div>';
      document.getElementById('luu').onclick = function () { var v = U.formVals(host); if (v.sdt && !/^0\d{9}$/.test(v.sdt)) { U.fieldErr(host, 'sdt', 'Số điện thoại 10 chữ số, bắt đầu bằng 0'); return; } U.fieldErr(host, 'sdt', ''); var truoc = { sdt: h.sdt, diaChi: h.diaChi }; h.sdt = v.sdt; h.diaChi = v.dc; h.donViCT = v.dv; LMS.commit('Học viên cập nhật liên hệ', 'Học viên', h.ma, truoc, { sdt: h.sdt, diaChi: h.diaChi }); U.toast('Đã lưu thông tin liên hệ', 'ok'); };
      document.getElementById('yc').onclick = function () { U.modal({ title: 'Yêu cầu điều chỉnh thông tin', body: '<div class="field"><label>Nội dung cần điều chỉnh</label><textarea name="nd" rows="4" placeholder="VD: sai ngày sinh, đúng là 12/03/2004"></textarea></div><div class="field"><label>Giấy tờ minh chứng</label><input type="file" name="f"></div>', foot: [{ label: 'Hủy', close: true }, { label: 'Gửi yêu cầu', cls: 'primary', onClick: function (a) { if (!U.formVals(a.body).nd) { U.fieldErr(a.body, 'nd', 'Nhập nội dung'); return false; } LMS.commit('Yêu cầu điều chỉnh hồ sơ', 'Học viên', h.ma); U.toast('Đã gửi yêu cầu tới Phòng đào tạo', 'ok'); } }] }); };
    } else if (tab === 'ls') {
      var ds = HV.lopCuaToi({ all: true });
      host.innerHTML = '<div class="panel"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Lớp</th><th>Học phần</th><th>Thời gian</th><th>Trạng thái</th><th class="num">Tiến độ</th><th class="num">Tổng kết</th></tr></thead><tbody>' + ds.map(function (x) { var hp = LMS.hocPhanOfLop(x.l), tk = LMS.diemTongKet(x.l, HV.id()); return '<tr><td><span class="mono">' + esc(x.l.ma) + '</span><div class="t-sub">' + esc(x.l.ten) + '</div></td><td>' + esc(hp.ten) + '<div class="t-sub">' + hp.soTC + ' tín chỉ</div></td><td class="small">' + LMS.fmtDate(x.l.batDau) + ' – ' + LMS.fmtDate(x.l.ketThuc) + '<div class="t-sub">ghi danh ' + LMS.fmtDate(x.g.ngay) + '</div></td><td>' + U.badge(HV.TT_GD[x.g.trangThai][0], HV.TT_GD[x.g.trangThai][1]) + '</td><td class="num">' + HV.tienDoLop(x.l).pct + '%</td><td class="num"><b>' + (tk == null ? '—' : tk) + '</b></td></tr>'; }).join('') + '</tbody></table></div></div>';
    } else if (tab === 'tb') {
      var cd = h.caiDat = h.caiDat || {};
      host.innerHTML = '<div class="panel"><div class="panel-head"><h2>Kênh nhận thông báo</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Loại thông báo</th><th class="c">Trên cổng</th><th class="c">Email</th></tr></thead><tbody>' + LOAI.map(function (x) { var c = cd[x[0]] || { portal: true, email: x[0] !== 'hoc-tap' }; return '<tr><td>' + x[1] + '</td><td class="c"><input type="checkbox" checked disabled title="Luôn hiển thị trên cổng"></td><td class="c"><input type="checkbox" data-e="' + x[0] + '"' + (c.email ? ' checked' : '') + (x[0] === 'khan' || x[0] === 'thi' ? ' disabled title="Bắt buộc gửi email"' : '') + '></td></tr>'; }).join('') + '</tbody></table></div><div class="panel-body"><label class="check"><input type="checkbox" id="nhac"' + (cd.nhacBuoi !== false ? ' checked' : '') + '> Nhắc trước buổi học trực tuyến 30 phút</label></div></div>';
      host.querySelectorAll('[data-e]').forEach(function (x) { x.onchange = function () { cd[x.dataset.e] = { portal: true, email: x.checked }; LMS.commit(null); U.toast('Đã lưu cài đặt', 'ok'); }; });
      document.getElementById('nhac').onchange = function (e) { cd.nhacBuoi = e.target.checked; LMS.commit(null); U.toast('Đã lưu cài đặt', 'ok'); };
    } else {
      host.innerHTML = '<div class="two"><div class="panel"><div class="panel-head"><h2>Đổi mật khẩu</h2></div><div class="panel-body stack"><div class="field"><label>Mật khẩu hiện tại</label><input class="inp" type="password" name="cu" autocomplete="current-password"></div><div class="field"><label>Mật khẩu mới</label><input class="inp" type="password" name="moi" autocomplete="new-password"><div class="hint">Tối thiểu 8 ký tự, có chữ hoa, chữ thường và chữ số</div></div><div class="field"><label>Nhập lại mật khẩu mới</label><input class="inp" type="password" name="lai" autocomplete="new-password"></div><div><button class="btn primary" id="doi">Đổi mật khẩu</button></div></div></div><div class="panel"><div class="panel-head"><h2>Phiên đăng nhập</h2></div><div class="todo"><div class="row-it"><span class="ic ok">' + HV.svg('shield') + '</span><span class="tx"><b>Chrome · Windows 11 (thiết bị này)</b><small>Hà Nội · đang hoạt động</small></span></div><div class="row-it"><span class="ic">' + HV.svg('shield') + '</span><span class="tx"><b>Safari · iPhone</b><small>Hà Nội · ' + LMS.fmtDT(LMS.addDays(LMS.TODAY, -2)) + '</small></span><button class="btn sm" id="dx">Đăng xuất</button></div></div></div></div>';
      document.getElementById('doi').onclick = function () { var v = U.formVals(host), ok = true; U.fieldErr(host, 'cu', v.cu ? '' : 'Nhập mật khẩu hiện tại'); if (!v.cu) ok = false; var e = !/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(v.moi || '') ? 'Chưa đạt yêu cầu độ mạnh' : ''; U.fieldErr(host, 'moi', e); if (e) ok = false; U.fieldErr(host, 'lai', v.lai === v.moi ? '' : 'Không khớp mật khẩu mới'); if (v.lai !== v.moi) ok = false; if (!ok) return; host.querySelectorAll('input').forEach(function (i) { i.value = ''; }); LMS.commit('Học viên đổi mật khẩu', 'Tài khoản', h.ma); U.toast('Đã đổi mật khẩu. Các thiết bị khác cần đăng nhập lại.', 'ok'); };
      document.getElementById('dx').onclick = function () { this.closest('.row-it').remove(); U.toast('Đã đăng xuất thiết bị', 'ok'); };
    }
  }
  LMS.onChange(render); render();
})();
</script>
</body></html>
