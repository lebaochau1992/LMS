<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cổng học viên · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="../edot.css">
<link rel="stylesheet" href="hv.css">
</head><body>
<script src="../lms-core.js"></script>
<script src="hv-core.js"></script>
<script>
(function () {
  'use strict';
  var U = LMS.ui, esc = U.esc, f = { q: '', khoa: '', tt: '', phi: '' };
  function D() { return LMS.db; }
  function phi(l) { var k = l.khoanThu ? LMS.byId('khoanThu', l.khoanThu) : null; return k ? k.donGia : 0; }
  function ds() { return D().lop.filter(function (l) { return l.trangThai === 'tuyen-sinh' || l.trangThai === 'dang-hoc'; }); }
  document.title = 'Đào tạo trực tuyến · Học viện Y Dược học cổ truyền Việt Nam';
  var css = document.createElement('style');
  css.textContent = '.pub-top{position:sticky;top:0;z-index:30;background:var(--ems-surface);border-bottom:1px solid var(--ems-border);display:flex;align-items:center;gap:18px;padding:10px 24px}.pub-top nav{display:flex;gap:4px}.pub-top nav a{padding:6px 10px;border-radius:8px;color:var(--ems-text-2);font-weight:600;font-size:13.5px}.pub-top nav a:hover{background:var(--ems-surface-2);text-decoration:none}.hero{background:linear-gradient(120deg,#00327d,#0f5c8f 60%,#14b8a6);color:#fff;padding:44px 24px}.hero h1{font-size:30px;max-width:760px;line-height:1.25}.hero p{max-width:680px;opacity:.9;margin:10px 0 18px}.hero .srch{display:flex;gap:8px;max-width:620px}.hero .srch .inp{flex:1;font-size:15px;padding:10px 12px}.hstat{display:flex;gap:28px;margin-top:22px;flex-wrap:wrap}.hstat b{display:block;font-size:24px}.hstat span{font-size:12px;opacity:.85}.wrap{max-width:1200px;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:18px}.ctree{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.foot{background:#0b1220;color:#cbd5e1;padding:26px 24px;font-size:13px}.foot b{color:#fff}@media(max-width:700px){.pub-top{padding:10px 14px;gap:8px}.pub-top nav{display:none}.hero{padding:28px 16px}.hero h1{font-size:22px}.wrap{padding:16px}}';
  document.head.appendChild(css);
  function render() {
    var list = ds().filter(function (l) { var hp = LMS.hocPhanOfLop(l); return (!f.q || U.norm(l.ten + ' ' + hp.ten + ' ' + l.giangVien.map(function (g) { return LMS.name('giangVien', g, 'hoTen'); }).join(' ')).indexOf(U.norm(f.q)) >= 0) && (!f.khoa || l.khoa === f.khoa) && (!f.tt || l.trangThai === f.tt) && (!f.phi || (f.phi === 'mien' ? !phi(l) : phi(l) > 0)); }).sort(function (a, b) { return (a.trangThai === 'tuyen-sinh' ? 0 : 1) - (b.trangThai === 'tuyen-sinh' ? 0 : 1) || (a.batDau < b.batDau ? 1 : -1); });
    var ts = ds().filter(function (l) { return l.trangThai === 'tuyen-sinh'; }).length, nHV = D().hocVien.length, nGV = D().giangVien.filter(function (g) { return g.trangThai !== 'ngung'; }).length;
    var s = '<header class="pub-top"><a href="#" style="display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none"><span class="logo" style="width:34px;height:34px;border-radius:9px;background:var(--ems-navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11px">EGO</span><span><b style="display:block;font-size:14px">Đào tạo trực tuyến</b><small class="muted" style="font-size:11px">Học viện Y Dược học cổ truyền Việt Nam</small></span></a><nav><a href="#khoa">Khóa học</a><a href="#lo-trinh">Lộ trình đào tạo</a><a href="#gioi-thieu">Giới thiệu</a></nav><span style="margin-left:auto"></span><a class="btn primary" href="index.html">Đăng nhập</a></header>';
    s += '<section class="hero"><h1>Học phần y học cổ truyền trực tuyến, có giảng viên đồng hành</h1><p>Học theo lộ trình của Học viện: bài giảng video, buổi học trực tuyến với giảng viên, kiểm tra và cấp chứng nhận hoàn thành có mã tra cứu.</p><div class="srch"><input class="inp" id="q" placeholder="Tìm khóa học, học phần, giảng viên" value="' + esc(f.q) + '"><a class="btn" href="#khoa" style="background:#fff">Tìm khóa học</a></div><div class="hstat"><div><b>' + ts + '</b><span>lớp đang tuyển sinh</span></div><div><b>' + D().hocPhan.length + '</b><span>học phần trực tuyến</span></div><div><b>' + nGV + '</b><span>giảng viên</span></div><div><b>' + nHV + '</b><span>học viên đang theo học</span></div></div></section>';
    s += '<div class="wrap"><div id="khoa" class="page-head"><div><h1 style="font-size:20px">Khóa học</h1><div class="sub">Lớp đang tuyển sinh nhận đăng ký trực tuyến; lớp đã khai giảng xem giới thiệu và học thử bài đầu</div></div></div>';
    s += '<div class="filters"><select class="sel" id="fk">' + U.opts(D().donVi.filter(function (d) { return d.laKhoa; }), 'id', 'ten', f.khoa, 'Tất cả khoa') + '</select><select class="sel" id="ft">' + U.opts([{ v: 'tuyen-sinh', t: 'Đang tuyển sinh' }, { v: 'dang-hoc', t: 'Đã khai giảng' }], 'v', 't', f.tt, 'Mọi trạng thái') + '</select><select class="sel" id="fp">' + U.opts([{ v: 'mien', t: 'Miễn phí' }, { v: 'phi', t: 'Có học phí' }], 'v', 't', f.phi, 'Mọi mức học phí') + '</select><span class="muted small" style="margin-left:auto">' + list.length + ' khóa học</span></div>';
    s += list.length ? '<div class="lop-grid">' + list.map(function (l) { var hp = LMS.hocPhanOfLop(l), p = phi(l), ts2 = l.trangThai === 'tuyen-sinh'; return '<button class="lop-card" data-l="' + l.id + '" style="text-align:left;cursor:pointer;font:inherit;padding:0"><div class="lop-cover ' + HV.coverCls(l) + '">' + esc(hp.ten) + ' · ' + hp.soTC + ' TC<span class="st">' + U.badge(ts2 ? 'Khai giảng ' + LMS.fmtDate(l.batDau) : 'Đã khai giảng', ts2 ? 'ok' : '') + '</span></div><div class="bd"><h3>' + esc(l.ten) + '</h3><div class="meta">' + esc(LMS.donViTen(l.khoa)) + ' · ' + esc(HV.HT[l.hinhThuc] || '') + ' · ' + hp.bai.length + ' bài giảng</div><div class="meta">' + (l.giangVien.length ? 'Giảng viên: ' + esc(l.giangVien.map(HV.gvTen).join(', ')) : 'Tự học có hướng dẫn') + '</div></div><div class="ft"><b style="color:' + (p ? 'var(--ems-text)' : 'var(--ems-success)') + '">' + (p ? U.money(p) : 'Miễn phí') + '</b><span style="margin-left:auto;color:var(--ems-navy);font-weight:600">' + (ts2 ? 'Xem và đăng ký' : 'Xem giới thiệu') + ' ›</span></div></button>'; }).join('') + '</div>' : '<div class="panel"><div class="empty">Không có khóa học phù hợp</div></div>';
    s += '<div id="lo-trinh" class="page-head" style="margin-top:12px"><div><h1 style="font-size:20px">Lộ trình đào tạo</h1><div class="sub">Chương trình Y học cổ truyền trình độ đại học, học phần sắp xếp theo khối kiến thức</div></div></div><div class="ctree">' + D().chuongTrinh.filter(function (c) { return c.cha && D().chuongTrinh.some(function (x) { return x.cha === c.id; }); }).map(function (k) { return '<div class="panel"><div class="panel-head"><h2>' + esc(k.ten) + '</h2></div><div class="todo">' + D().chuongTrinh.filter(function (x) { return x.cha === k.id; }).map(function (c, i) { var hp = LMS.byId('hocPhan', c.hocPhan[0]); return '<div class="row-it"><span class="ic">' + (i + 1) + '</span><span class="tx"><b>' + esc(c.ten) + '</b><small>' + (hp ? esc(hp.ma) + ' · ' + hp.soTC + ' tín chỉ · ' + hp.bai.length + ' bài' : '') + '</small></span></div>'; }).join('') + '</div></div>'; }).join('') + '</div>';
    s += '<div id="gioi-thieu" class="panel" style="margin-top:12px"><div class="panel-body two"><div><h2 style="font-size:18px;margin-bottom:6px">Về Cổng đào tạo trực tuyến</h2><p>Cổng do Học viện Y Dược học cổ truyền Việt Nam vận hành, phục vụ sinh viên, học viên liên thông và người học có nhu cầu bồi dưỡng chuyên môn y học cổ truyền. Mỗi học phần có giảng viên phụ trách, lịch học trực tuyến, ngân hàng câu hỏi ôn tập và kỳ kiểm tra có giám sát.</p></div><div class="stack" style="gap:6px;font-size:13.5px"><b>Liên hệ Phòng đào tạo</b><div>Số 2 Trần Phú, Hà Đông, Hà Nội</div><div>(024) 3382 4929 · daotao@vutm.edu.vn</div><div>Giờ làm việc: 7:30–17:00, thứ Hai đến thứ Sáu</div><div style="margin-top:6px"><b>Đơn vị, tổ chức</b> cần đào tạo theo số lượng, cấp tài khoản theo danh sách: liên hệ để nhận báo giá.</div></div></div></div></div>';
    s += '<footer class="foot"><div style="max-width:1200px;margin:0 auto;display:flex;gap:24px;flex-wrap:wrap"><div><b>Học viện Y Dược học cổ truyền Việt Nam</b><div>Cổng đào tạo trực tuyến · vận hành trên nền tảng EGO LMS</div></div><div style="margin-left:auto">Tra cứu chứng chỉ · Quy định đào tạo · Chính sách bảo mật</div></div></footer>';
    document.body.innerHTML = s;
    var qi = document.getElementById('q'); qi.oninput = function () { f.q = qi.value; var p = qi.selectionStart; render(); var n = document.getElementById('q'); n.focus(); n.setSelectionRange(p, p); };
    document.getElementById('fk').onchange = function (e) { f.khoa = e.target.value; render(); };
    document.getElementById('ft').onchange = function (e) { f.tt = e.target.value; render(); };
    document.getElementById('fp').onchange = function (e) { f.phi = e.target.value; render(); };
    document.querySelectorAll('[data-l]').forEach(function (b) { b.onclick = function () { chiTiet(LMS.byId('lop', b.dataset.l)); }; });
  }
  function chiTiet(l) {
    var hp = LMS.hocPhanOfLop(l), p = phi(l), ts = l.trangThai === 'tuyen-sinh', con = l.sucChua ? Math.max(0, l.sucChua - LMS.soHV(l.id)) : null, bs = LMS.buoiCuaLop(l.id).filter(function (b) { return !b.huy; });
    var lich = bs.length ? (function () { var m = {}; bs.forEach(function (b) { var k = LMS.THU[LMS.parse(b.ngay).getDay()] + ' ' + b.gio + '–' + b.den; m[k] = (m[k] || 0) + 1; }); return Object.keys(m).sort(function (a, b) { return m[b] - m[a]; }).slice(0, 2).join(', ') + ' · ' + bs.length + ' buổi trực tuyến'; })() : (l.hinhThuc === 'tu-hoc' ? 'Tự học theo lộ trình, không có buổi học cố định' : 'Lịch học công bố trước khai giảng');
    var body = '<div class="stack" style="gap:12px"><div class="small muted">' + esc(LMS.donViTen(l.khoa)) + ' · ' + esc(hp.ma) + ' · ' + hp.soTC + ' tín chỉ</div><div>' + esc(hp.moTa || '') + '</div>' + (hp.chuanDauRa && hp.chuanDauRa.length ? '<div><b>Chuẩn đầu ra</b><ul style="margin:4px 0 0;padding-left:18px">' + hp.chuanDauRa.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul></div>' : '') +
      '<dl class="kv"><dt>Thời gian</dt><dd>' + LMS.fmtDate(l.batDau) + ' – ' + LMS.fmtDate(l.ketThuc) + '</dd><dt>Hình thức</dt><dd>' + esc(HV.HT[l.hinhThuc] || '') + '</dd><dt>Lịch học</dt><dd>' + esc(lich) + '</dd><dt>Giảng viên</dt><dd>' + (l.giangVien.map(HV.gvTen).join(', ') || '—') + '</dd><dt>Điều kiện hoàn thành</dt><dd>Hoàn thành bài giảng, điểm tổng kết từ ' + l.diemDat + ' (' + l.cotDiem.map(function (c) { return c.ten + ' ' + c.ts + '%'; }).join(', ') + ')</dd><dt>Học phí</dt><dd><b>' + (p ? U.money(p) : 'Miễn phí') + '</b></dd>' + (ts ? '<dt>Hạn đăng ký</dt><dd>' + LMS.fmtDate(LMS.addDays(LMS.parse(l.batDau), -1)) + (con != null ? ' · còn ' + con + '/' + l.sucChua + ' chỗ' : '') + '</dd>' : '') + '</dl>' +
      '<div class="panel"><div class="panel-head"><h2>Nội dung · ' + hp.bai.length + ' bài</h2></div><div class="bai-list" style="max-height:260px;overflow:auto">' + hp.bai.map(function (b, i) { return '<div class="bai-it' + (b.hocThu ? '' : ' khoa') + '"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(b.ten) + '<small>' + b.phut + ' phút</small></span>' + (b.hocThu ? '<button class="btn sm" data-thu="' + b.id + '">Học thử</button>' : '') + '</div>'; }).join('') + '</div></div></div>';
    var api = U.modal({ title: l.ten, size: 'lg', body: body, foot: [{ label: 'Đóng', close: true }].concat(ts ? [{ label: 'Đăng nhập để đăng ký', cls: 'primary', onClick: function () { location.href = 'dang-ky.html?lop=' + l.id; } }] : []) });
    api.body.querySelectorAll('[data-thu]').forEach(function (x) { x.onclick = function () { var b = hp.bai.find(function (y) { return y.id === x.dataset.thu; }); U.modal({ title: 'Học thử · ' + b.ten, size: 'lg', body: '<div class="note info">Bản học thử bài đầu tiên. Đăng ký học để mở toàn bộ bài và được ghi nhận tiến độ.</div><div class="video" style="margin-top:10px"><button class="play" aria-label="Phát">' + HV.svg('play') + '</button><div class="bar"><span>0:00 / ' + b.phut + ':00</span><div class="trk"><span style="width:0"></span></div></div></div><div class="nd" style="margin-top:10px">' + ((b.khoi || []).filter(function (k) { return k.loai === 'doan-van'; }).map(function (k) { return k.html; }).join('') || '') + '</div>' }); }; });
  }
  render();
})();
</script>
</body></html>
