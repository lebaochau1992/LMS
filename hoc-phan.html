<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học phần · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="edot.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js" defer></script>
<style>
.hp-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hp-title h1{margin:0}
.meta{color:var(--ems-muted);font-size:12px;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--ems-border);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--ems-text-2);background:var(--ems-surface)}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--ems-navy);cursor:pointer;font-weight:600;text-align:left}
.lnk:hover{text-decoration:underline}
.lnk.muted{color:var(--ems-muted);font-weight:500}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw i{width:34px;height:20px;border-radius:99px;background:var(--ems-border-strong);position:relative;transition:.15s;flex:none}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw input:checked+i{background:var(--ems-navy)}
.sw input:checked+i:after{left:16px}
.sw input:focus-visible+i{box-shadow:0 0 0 3px var(--ems-focus)}
.sw input:disabled+i{opacity:.5}
.drag{cursor:grab;color:var(--ems-faint);font-size:14px;padding:0 4px;user-select:none}
tr.dragging,.blk.dragging{opacity:.4}
tr.drop-before td{box-shadow:inset 0 2px 0 var(--ems-navy)}
.ord{display:inline-flex;gap:2px}
.ord .icon-btn{font-size:11px;padding:3px 6px}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sum-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--ems-surface-2);border-radius:var(--r-ctl);padding:10px 12px;font-size:13px}
.grp td{background:var(--ems-surface-2);font-weight:600;font-size:12px}
.lock-note{font-size:12px;color:var(--ems-muted)}
.qk{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.picklist{border:1px solid var(--ems-border);border-radius:var(--r-ctl);max-height:320px;overflow:auto}
.picklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--ems-border);cursor:pointer}
.picklist label:last-child{border-bottom:0}
.picklist label:hover{background:var(--ems-surface-2)}
.picklist .meta{margin:0}
.crit{border:1px solid var(--ems-border);border-radius:var(--r-card);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.crit .row{gap:8px}
.inp.w80{width:84px}
/* trình soạn bài giảng */
.ed-bar{position:sticky;top:0;z-index:20;background:var(--ems-navy);color:#fff;border-radius:var(--r-card) var(--r-card) 0 0;padding:10px 16px;display:flex;align-items:center;gap:10px}
:root[data-theme="dark"] .ed-bar{background:#16336b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ed-bar{background:#16336b}}
.ed-bar h2{color:#fff;font-size:15px;margin:0}
.ed-bar button{background:transparent;border:0;color:#fff;font:600 13px var(--font);cursor:pointer;padding:6px 8px;border-radius:6px;display:inline-flex;gap:6px;align-items:center}
.ed-bar button:hover{background:rgba(255,255,255,.12)}
.ed-bar .dirty{font-size:12px;font-weight:500;opacity:.85}
.tb{position:sticky;top:48px;z-index:15;background:var(--ems-surface);border:1px solid var(--ems-border);border-radius:var(--r-card);padding:8px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tb .lbl{font-size:12px;color:var(--ems-muted);margin-right:2px}
.tb .btn{padding:5px 9px;font-size:12px}
.tb .toc{margin-left:auto}
.blk{border:1px solid var(--ems-border);border-radius:var(--r-card);background:var(--ems-surface)}
.blk.err{border-color:var(--ems-danger);box-shadow:0 0 0 3px var(--ems-danger-bg)}
.blk-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--ems-border);background:var(--ems-surface-2);border-radius:var(--r-card) var(--r-card) 0 0}
.blk-h .t{font-weight:600;font-size:13px}
.blk-h .s{font-size:12px;color:var(--ems-muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.blk-h .icon-btn{padding:3px 7px;font-size:12px}
.blk-b{padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.ins{display:flex;justify-content:center;height:16px;align-items:center}
.ins button{opacity:0;border:1px dashed var(--ems-border-strong);background:var(--ems-surface);color:var(--ems-muted);font:12px var(--font);border-radius:99px;padding:1px 10px;cursor:pointer;transition:.1s}
.ins:hover button,.ins button:focus{opacity:1}
.empty-ed{border:1.5px dashed var(--ems-border-strong);border-radius:var(--r-card);padding:34px;text-align:center;color:var(--ems-muted);font-size:13px}
.rte-tb{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.rte-tb button{border:1px solid var(--ems-border);background:var(--ems-surface);border-radius:5px;min-width:28px;height:26px;font:600 12px var(--font);color:var(--ems-text);cursor:pointer;padding:0 6px}
.rte-tb button:hover{background:var(--ems-surface-2)}
.rte-tb select{height:26px;font-size:12px;padding:0 4px}
.rte-tb input[type=color]{width:28px;height:26px;padding:1px;border:1px solid var(--ems-border);border-radius:5px;background:var(--ems-surface)}
.rte{min-height:90px;border:1px solid var(--ems-border);border-radius:var(--r-ctl);padding:10px 12px;font-size:14px;line-height:1.6;outline:none;background:var(--ems-surface)}
.rte:focus{border-color:var(--ems-navy-line);box-shadow:0 0 0 3px var(--ems-focus)}
.rte p{margin:0 0 8px}
.fp{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--ems-border-strong);border-radius:var(--r-ctl);padding:8px 10px;background:var(--ems-surface-2)}
.fp.over{border-color:var(--ems-navy);background:var(--ems-navy-soft)}
.fp .f-name{font-size:12px;font-family:var(--mono);color:var(--ems-text-2);word-break:break-all}
.fp .hint{font-size:12px;color:var(--ems-muted)}
.cfg{border:1px solid var(--ems-border);border-radius:var(--r-ctl);padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--ems-surface-2)}
.cfg .eyebrow{margin:0}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.q{border:1px solid var(--ems-border);border-radius:var(--r-ctl);padding:10px;display:flex;flex-direction:column;gap:8px}
.q-h{display:flex;gap:8px;align-items:flex-start}
.q-n{width:22px;height:22px;border-radius:50%;background:var(--ems-navy);color:#fff;font:700 11px var(--font);display:flex;align-items:center;justify-content:center;flex:none;margin-top:6px}
.q-h textarea{flex:1;min-height:44px}
.q-h select{width:150px}
.opt{display:flex;gap:8px;align-items:center;padding-left:30px}
.opt .inp{flex:1}
.opt .sep{color:var(--ems-muted)}
.q .note-s{padding-left:30px;font-size:12px;color:var(--ems-muted)}
.cont{border:1px dashed var(--ems-border-strong);border-radius:var(--r-ctl);padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mini{display:flex;gap:2px;flex-wrap:wrap}
.mini button{border:0;background:transparent;color:var(--ems-text-2);width:26px;height:24px;border-radius:5px;cursor:pointer;font-size:12px}
.mini button:hover{background:var(--ems-surface-2);color:var(--ems-navy)}
.drop{border:1px dashed var(--ems-border);border-radius:6px;padding:12px;text-align:center;font-size:12px;color:var(--ems-faint)}
.cols{display:grid;gap:10px}
.seg-sm button{padding:4px 10px;font-size:12px}
.toc-pop{position:absolute;z-index:40;background:var(--ems-surface);border:1px solid var(--ems-border);border-radius:var(--r-card);box-shadow:0 12px 30px rgba(2,6,23,.18);max-height:360px;overflow:auto;min-width:260px;padding:6px}
.toc-pop button{display:flex;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:6px;font:13px var(--font);color:var(--ems-text);cursor:pointer}
.toc-pop button:hover{background:var(--ems-surface-2)}
.toc-pop .n{color:var(--ems-faint);min-width:22px;text-align:right}
.att{display:flex;gap:6px;flex-wrap:wrap}
.att .tag{display:inline-flex;gap:6px;align-items:center}
.att .tag button{border:0;background:transparent;cursor:pointer;color:var(--ems-muted);padding:0}
/* xem trước */
.pv-note{background:var(--ems-warning-bg);color:var(--ems-warning);border:1px solid var(--ems-warning-line);border-radius:var(--r-ctl);padding:8px 12px;font-size:12px}
.pv{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px;font-size:15px;line-height:1.65}
.pv h1,.pv h2,.pv h3{margin:0}
.pv hr{border:0;border-top:1px solid var(--ems-border);margin:4px 0}
.pv hr.dash{border-top-style:dashed}
.pv .ph{background:var(--ems-surface-2);border:1px solid var(--ems-border);border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;color:var(--ems-muted);font-size:13px;text-align:center;padding:10px}
.pv .player{background:#0f172a;color:#cbd5e1;border-radius:var(--r-ctl);aspect-ratio:16/9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden}
.pv .player .play{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff}
.pv .player .wm{position:absolute;right:12px;top:10px;font-size:11px;opacity:.5}
.pv .player .bar{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.6));display:flex;gap:8px;flex-wrap:wrap}
.pv .cap{font-size:12px;color:var(--ems-muted);text-align:center}
.pv .audio{border:1px solid var(--ems-border);border-radius:99px;padding:8px 14px;display:flex;gap:10px;align-items:center;font-size:13px}
.pv .audio .trk{flex:1;height:4px;background:var(--ems-border);border-radius:99px}
.pv .doc{border:1px solid var(--ems-border);border-radius:var(--r-ctl);padding:12px;display:flex;gap:10px;align-items:center}
.pv .pq{border:1px solid var(--ems-border);border-radius:var(--r-card);padding:14px;display:flex;flex-direction:column;gap:12px}
.pv .pq .it{display:flex;flex-direction:column;gap:6px}
.pv .pq label{display:flex;gap:8px;align-items:center;font-size:14px}
.pv .pq .res{font-size:12px}
.pv .pq .ok{color:var(--ems-success)} .pv .pq .bad{color:var(--ems-danger)}
.pv .w{cursor:pointer;border-radius:3px;padding:0 1px}
.pv .w.on{text-decoration:underline;text-decoration-thickness:2px;text-decoration-color:var(--ems-navy);background:var(--ems-navy-soft)}
.pv details{border:1px solid var(--ems-border);border-radius:var(--r-ctl);padding:8px 12px}
.pv details summary{font-weight:600;cursor:pointer}
.pv-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.pv-toc{border-right:1px solid var(--ems-border);padding-right:10px;display:flex;flex-direction:column;gap:2px;max-height:65vh;overflow:auto}
.pv-toc button{border:0;background:transparent;text-align:left;padding:7px 8px;border-radius:6px;font:13px var(--font);color:var(--ems-text);cursor:pointer}
.pv-toc button.on{background:var(--ems-navy-soft);color:var(--ems-navy);font-weight:600}
.pv-toc button:disabled{color:var(--ems-faint);cursor:default}
.kpis.k7{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.kpi .k-val.sm{font-size:20px}
@media (max-width:760px){
  .g3{grid-template-columns:1fr}
  .pv-wrap{grid-template-columns:1fr}
  .pv-toc{border-right:0;border-bottom:1px solid var(--ems-border);max-height:160px}
  .tb{position:static}
  .ed-bar .hp-n{display:none}
  .ed-bar h2{font-size:14px}
  .q-h{flex-wrap:wrap}.q-h select{width:100%}
  .opt{padding-left:0}
  .cols{grid-template-columns:1fr!important}
}
</style>
</head><body>
<div class="page" id="app"></div>
<script src="lms-core.js"></script>
<script>
(function(){ 'use strict';
var U = LMS.ui, esc = U.esc;
var app = document.getElementById('app');
function D(){ return LMS.db; }

/* ================= danh mục dùng chung ================= */
var TT = { 'hoat-dong':['Hoạt động','ok'], 'nhap':['Nháp','warn'], 'ngung':['Ngưng','']};
var KHOI = [
  ['tieu-de','Tiêu đề','T'],['doan-van','Đoạn văn','¶'],['cong-thuc','Công thức','∑'],['anh','Ảnh','▣'],['video','Video','▶'],['am-thanh','Âm thanh','♪'],['pdf','PDF','⎙'],['nut','Nút','⎋'],
  ['quiz','Quiz','?'],['nhung','Nhúng','⧉'],['html','HTML','</>'],['trang-tt','Trang tương tác','◧'],['duong-ke','Đường kẻ','—'],['nhom','Nhóm','▤'],['bo-cuc','Bố cục cột','▥'],['luoi','Lưới','▦']
];
var KL = {}; KHOI.forEach(function(k){ KL[k[0]] = k; });
var CONTAINER = { nhom:1, 'bo-cuc':1, luoi:1 };
var QT = [['mot','1 đáp án'],['nhieu','Nhiều đáp án'],['dung-sai','Đúng/Sai'],['ngan','Trả lời ngắn'],['noi','Nối chéo'],['sap-xep','Sắp xếp'],['gach-chan','Gạch chân'],['tu-luan','Tự luận']];
var QTL = {}; QT.forEach(function(q){ QTL[q[0]] = q[1]; });
var FILE_LOAI = { anh:'Ảnh', video:'Video', 'am-thanh':'Audio', pdf:'PDF' };
var ANH_SIZE = [['nho','Nhỏ (240px)'],['vua','Vừa (480px)'],['lon','Lớn (720px)'],['full','Toàn khung']];

var st = { view:'list', q:'', tt:'', ct:'', khoa:'', hp:null, tab:'info', hvQ:'', hvLop:'', hvTT:'', ed:null };

/* ================= tiện ích ================= */
function tongGiay(hp){ return hp.bai.reduce(function(s,b){ return s + (+b.giay || (+b.phut||0)*60); },0); }
function gio(g){ if(!g) return '—'; var h=g/3600; return (h>=10?Math.round(h):Math.round(h*10)/10).toLocaleString('vi-VN')+' giờ'; }
function dur(g){ g=+g||0; if(!g) return '—'; var m=Math.floor(g/60), s=g%60; return m+'m '+(s<10?'0':'')+s+'s'; }
function durDai(g){ g=+g||0; var h=Math.floor(g/3600), m=Math.floor(g%3600/60), s=g%60; return [h?h+' giờ':'', m?m+' phút':'', s&&!h?s+' giây':''].filter(Boolean).join(' ')||'0 giây'; }
function plain(t){ return String(t||'').replace(/^Bài \d+\s*[–-]\s*/,''); }
function autoNum(t){ return /^Bài \d+\s*[–-]\s*/.test(String(t||'')); }
function renumber(hp){ hp.bai.forEach(function(b,i){ if(autoNum(b.ten)) b.ten='Bài '+(i+1)+' – '+plain(b.ten); }); }
function prune(hp){ hp.bai.forEach(function(b,i){ var truoc=hp.bai.slice(0,i).map(function(x){return x.id;}); b.tienQuyet=(b.tienQuyet||[]).filter(function(t){ return truoc.indexOf(t)>=0; }); }); }
function idx(hp,id){ return hp.bai.findIndex(function(x){ return x.id===id; }); }
function ctPath(c){ var p=[c.ten], x=c; while(x && x.cha){ x=LMS.byId('chuongTrinh',x.cha); if(x) p.unshift(x.ten); } return p.join(' › '); }
function ctOf(hp){ return D().chuongTrinh.filter(function(c){ return c.hocPhan.indexOf(hp.id)>=0; }); }
function lopOf(hp){ return D().lop.filter(function(l){ return l.hocPhan===hp.id; }); }
function lopMo(hp){ return lopOf(hp).filter(function(l){ return l.trangThai==='dang-hoc'||l.trangThai==='tuyen-sinh'; }); }
function gdOf(hp){ var ids=lopOf(hp).map(function(l){return l.id;}); return D().ghiDanh.filter(function(g){ return ids.indexOf(g.lop)>=0; }); }
function soHVHP(hp){ var s={}; gdOf(hp).forEach(function(g){ if(g.trangThai!=='thoi-hoc') s[g.hv]=1; }); return Object.keys(s).length; }
function khoaList(){ return D().donVi.filter(function(d){ return d.laKhoa; }); }
function nhOf(hp){ return D().nganHang.find(function(n){ return n.hocPhan===hp.id; }); }
function uid(p){ return (p||'k')+Date.now().toString(36)+Math.floor(Math.random()*1e5).toString(36); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function countKhoi(list){ var n=0; LMS.walkKhoi(list,function(){ n++; }); return n; }
function khoiSummary(b){
  var c={}, n=0; LMS.walkKhoi(b.khoi,function(k){ n++; c[k.loai]=(c[k.loai]||0)+1; });
  if(!n) return '<span class="muted">Chưa có học liệu</span>';
  var ks=Object.keys(c).sort(function(a,z){ return c[z]-c[a]; });
  var parts=ks.slice(0,3).map(function(k){ return c[k]+' '+KL[k][1].toLowerCase(); });
  var rest=ks.slice(3).reduce(function(a,k){ return a+c[k]; },0);
  return n+' học liệu · '+parts.join(', ')+(rest?' và '+rest+' loại khác':'');
}
function tcText(t, coQuiz){ var a=[]; if(t.xemOn) a.push('xem ≥'+t.xem+'%'); if(t.quizOn && coQuiz!==false) a.push(t.quizKieu==='pct'?'quiz đúng ≥'+t.quizPct+'%':'quiz ≥'+t.quizDiem+' điểm'); return a.join(' · ')||'không đặt tiêu chí'; }
function sw(name, on, label, extra){ return '<label class="sw"><input type="checkbox" '+name+(on?' checked':'')+(extra||'')+'><i></i>'+(label?'<span>'+label+'</span>':'')+'</label>'; }
function soQuizBai(b){ var n=0; LMS.walkKhoi(b.khoi,function(k){ if(k.loai==='quiz') n+=(k.cauHoi||[]).length; }); return n; }
function hasVideo(b){ var v=false; LMS.walkKhoi(b.khoi,function(k){ if(k.loai==='video'&&k.file) v=true; }); return v; }
function mediaGiay(list){ var s=0; LMS.walkKhoi(list,function(k){ if((k.loai==='video'||k.loai==='am-thanh') && k.file){ s+= +k.giay || +((LMS.byId('thuVien',k.file)||{}).giay) || 0; } }); return s; }
function fileName(id){ var f=LMS.byId('thuVien',id); return f?f.ten:''; }

/* ================= DANH SÁCH ================= */
var tbl;
function rows(){
  var q=U.norm(st.q);
  return D().hocPhan.filter(function(h){
    if(st.tt && h.trangThai!==st.tt) return false;
    if(st.khoa && h.khoa!==st.khoa) return false;
    if(st.ct && ctOf(h).every(function(c){ return c.id!==st.ct; }) && h.phanLoai!==st.ct) return false;
    return !q || U.norm(h.ma+' '+h.ten).indexOf(q)>=0;
  });
}
function renderList(){
  var d=D(), n=d.hocPhan.length, nb=d.hocPhan.reduce(function(s,h){ return s+h.bai.length; },0), nNhap=d.hocPhan.filter(function(h){return h.trangThai==='nhap';}).length;
  app.innerHTML='<div class="page-head"><div><h1>Học phần</h1><div class="sub">'+n+' học phần · '+nb+' bài giảng · mỗi học phần gắn được vào nhiều chương trình đào tạo, dùng chung nội dung cho mọi lớp'+(nNhap?' · '+nNhap+' đang soạn (nháp)':'')+'</div></div><div class="actions"><button class="btn" id="goCT">Chương trình đào tạo</button><button class="btn primary" id="btnAdd">+ Tạo học phần</button></div></div>'+
    '<div class="panel"><div class="panel-head filters"><input class="inp" id="fq" placeholder="Tìm theo tên hoặc mã" value="'+esc(st.q)+'" aria-label="Tìm học phần">'+
    '<select class="sel" id="ftt" aria-label="Trạng thái">'+U.opts([{v:'hoat-dong',l:'Hoạt động'},{v:'nhap',l:'Nháp'},{v:'ngung',l:'Ngưng'}],'v','l',st.tt,'Tất cả trạng thái')+'</select>'+
    '<select class="sel" id="fct" aria-label="Chương trình">'+U.opts(d.chuongTrinh.map(function(c){ return {id:c.id,t:ctPath(c)}; }),'id','t',st.ct,'Tất cả chương trình')+'</select>'+
    '<select class="sel" id="fkhoa" aria-label="Khoa">'+U.opts(khoaList(),'id','ten',st.khoa,'Tất cả khoa')+'</select></div><div id="tbl"></div>'+

function nextMa(){ var n=0; D().hocPhan.forEach(function(h){ var m=/^HP-(\d+)$/.exec(h.ma); if(m) n=Math.max(n,+m[1]); }); return 'HP-'+String(n+1).padStart(3,'0'); }
function validHP(b,v,self){
  var ok=true;
  if(v.ma){ var dup=D().hocPhan.some(function(x){ return x.ma.toLowerCase()===v.ma.toLowerCase() && (!self||x.id!==self.id); }); var e=!/^[A-Za-z0-9_.\-]+$/.test(v.ma)?'Mã chỉ gồm chữ không dấu, số, _ . -':(dup?'Mã đã tồn tại':''); U.fieldErr(b,'ma',e); if(e) ok=false; }
  else if(self){ U.fieldErr(b,'ma','Nhập mã học phần'); ok=false; }
  U.fieldErr(b,'ten',v.ten?'':'Nhập tên học phần'); if(!v.ten) ok=false;
  U.fieldErr(b,'khoa',v.khoa?'':'Chọn khoa phụ trách'); if(!v.khoa) ok=false;
  var tc=+v.soTC, etc=(!(tc>=1&&tc<=10)||Math.round(tc)!==tc)?'Từ 1 đến 10 tín chỉ':''; U.fieldErr(b,'soTC',etc); if(etc) ok=false;
  return ok;
}
function ctOptions(){ return D().chuongTrinh.filter(function(c){ return c.trangThai!=='ngung'; }).map(function(c){ return {id:c.id,t:ctPath(c)}; }); }

      '<div class="field"><label for="c_tc">Số tín chỉ <span class="req">*</span></label><input class="inp" id="c_tc" name="soTC" type="number" min="1" max="10" value="2"></div>'+
      '<div class="field full"><label for="c_ten">Tên học phần <span class="req">*</span></label><input class="inp" id="c_ten" name="ten" maxlength="200" placeholder="VD: Xoa bóp – Bấm huyệt"></div>'+
      '<div class="field"><label for="c_khoa">Khoa phụ trách <span class="req">*</span></label><select class="sel" id="c_khoa" name="khoa">'+U.opts(khoaList(),'id','ten','','Chọn khoa')+'</select></div>'+
      '<div class="field"><label for="c_ct">Chương trình đào tạo</label><select class="sel" id="c_ct" name="phanLoai">'+U.opts(ctOptions(),'id','t','','Chưa phân loại')+'</select><div class="hint">Phân loại theo cây chương trình để lọc khi gắn học phần vào chương trình.</div></div>'+
      '<div class="field full"><label class="check"><input type="checkbox" name="ganCT"> Gắn luôn học phần vào chương trình đã chọn</label></div>'+

      D().hocPhan.push(hp);

function cloneHP(hp){
  U.modal({ title:'Nhân bản '+hp.ma, size:'sm', body:'<div class="field"><label for="n_ma">Mã học phần mới</label><input class="inp" id="n_ma" name="ma" value="'+esc(hp.ma+'-BS')+'"></div><div class="field"><label for="n_ten">Tên</label><input class="inp" id="n_ten" name="ten" value="'+esc(hp.ten+' (bản sao)')+'"></div><div class="muted small">Sao chép '+hp.bai.length+' bài giảng, quy tắc mở bài và tiêu chí hoàn thành. Bản sao ở trạng thái Nháp, chưa gắn chương trình và lớp.</div>',
    foot:[{label:'Hủy',close:true},{label:'Nhân bản',cls:'primary',onClick:function(api){
      var v=U.formVals(api.body); v.ma=(v.ma||'').trim(); v.ten=(v.ten||'').trim();
      if(!validHP(api.body,{ma:v.ma,ten:v.ten,khoa:hp.khoa,soTC:hp.soTC},{id:'__new'})) return false;
      var n=clone(hp), map={}; n.id=LMS.nextId('hp'); n.ma=v.ma; n.ten=v.ten; n.trangThai='nhap';
      n.bai.forEach(function(b,i){ var old=b.id; b.id=n.id+'-b'+(i+1)+uid(''); map[old]=b.id; LMS.walkKhoi(b.khoi,function(k){ k.id=uid('k'); if(k.cauHoi) k.cauHoi.forEach(function(q){ q.id=uid('qq'); }); }); });
      n.bai.forEach(function(b){ b.tienQuyet=(b.tienQuyet||[]).map(function(t){ return map[t]; }).filter(Boolean); });
      D().hocPhan.push(n);
      LMS.commit('Nhân bản','Học phần',hp.ma+' → '+n.ma,null,{ma:n.ma,ten:n.ten,soBai:n.bai.length});
      U.toast('Đã tạo bản sao '+n.ma,'ok'); openDetail(n.id,'bai');
    }}]});
}
function setTT(hp,to,after){
  var mo=lopMo(hp);
  if(to==='hoat-dong'){
    var xb=hp.bai.filter(function(b){ return b.xuatBan && countKhoi(b.khoi); }).length;
    if(!xb){ U.modal({title:'Chưa thể kích hoạt '+hp.ma,size:'sm',body:'<div class="note warn">Học phần chưa có bài giảng nào đã xuất bản và có nội dung.</div><div class="small muted">Biên soạn và bật Xuất bản cho ít nhất một bài, sau đó kích hoạt học phần.</div>',foot:[{label:'Đóng',close:true},{label:'Biên soạn bài giảng',cls:'primary',onClick:function(){ openDetail(hp.id,'bai'); }}]}); return; }
  }
  if(to==='nhap' && lopOf(hp).length){ U.blocked('Không chuyển về Nháp',lopOf(hp).map(function(l){ return 'Lớp '+l.ma+' đang dùng học phần'; }),'Học phần đã có lớp chỉ chuyển được giữa Hoạt động và Ngưng.'); return; }
  var html = to==='ngung' ? 'Ngưng sử dụng <b>'+esc(hp.ma+' · '+hp.ten)+'</b>? Không mở được lớp mới theo học phần này.'+(mo.length?'<div class="note warn" style="margin-top:10px">'+mo.length+' lớp đang học/tuyển sinh vẫn tiếp tục học bình thường.</div>':'') : to==='hoat-dong' ? 'Kích hoạt <b>'+esc(hp.ma+' · '+hp.ten)+'</b>? Học phần xuất hiện khi mở lớp và gắn chương trình.' : 'Chuyển <b>'+esc(hp.ma)+'</b> về Nháp?';
  U.confirm({title:to==='ngung'?'Ngưng sử dụng học phần':to==='hoat-dong'?'Kích hoạt học phần':'Chuyển về nháp',html:html,ok:to==='ngung'?'Ngưng sử dụng':'Xác nhận',danger:to==='ngung'}).then(function(y){
    if(!y) return; var t=hp.trangThai; hp.trangThai=to;
    LMS.commit(to==='ngung'?'Ngưng dùng':to==='hoat-dong'?'Kích hoạt':'Sửa','Học phần',hp.ma+' · '+hp.ten,{trangThai:TT[t][0]},{trangThai:TT[to][0]});
    U.toast('Đã chuyển '+hp.ma+' sang '+TT[to][0],'ok'); if(after) after(); else render();
  });

function removeHP(hp){
  var refs=LMS.refsOf('hocPhan',hp.id);
  if(refs.length){ U.blocked('Không thể xóa '+hp.ma,refs,'Dùng Ngưng sử dụng để giữ lịch sử đào tạo.'); return; }
  U.confirm({title:'Xóa học phần',html:'Xóa <b>'+esc(hp.ma+' · '+hp.ten)+'</b> cùng '+hp.bai.length+' bài giảng? Tệp trong thư viện không bị xóa.',ok:'Xóa',danger:true}).then(function(y){
    if(!y) return; D().hocPhan=D().hocPhan.filter(function(x){ return x.id!==hp.id; });
    LMS.commit('Xóa','Học phần',hp.ma+' · '+hp.ten,{ma:hp.ma,ten:hp.ten,soBai:hp.bai.length},null);
    U.toast('Đã xóa học phần '+hp.ma,'ok'); st.view='list'; render();
  });
}

function move(hp,i,j){
  if(j<0||j>=hp.bai.length||i===j) return;
  var b=hp.bai.splice(i,1)[0]; hp.bai.splice(j,0,b);
  var lost=hp.bai.reduce(function(a,x,k){ var truoc=hp.bai.slice(0,k).map(function(y){return y.id;}); return a+(x.tienQuyet||[]).filter(function(t){ return truoc.indexOf(t)<0; }).length; },0);
  prune(hp); renumber(hp);
  LMS.commit('Sắp xếp','Học phần',hp.ma+' · '+plain(b.ten)+' → vị trí '+(j+1));
  if(lost) U.toast('Đã bỏ '+lost+' điều kiện mở bài không còn hợp lệ sau khi đổi thứ tự','warn');
  renderDetail();
}
function cloneBai(hp,i){
  var b=clone(hp.bai[i]); b.id=hp.id+'-b'+uid(''); b.ten=(autoNum(b.ten)?'Bài '+(i+2)+' – ':'')+plain(b.ten)+' (bản sao)'; b.xuatBan=false; b.hocThu=false;
  LMS.walkKhoi(b.khoi,function(k){ k.id=uid('k'); if(k.cauHoi) k.cauHoi.forEach(function(q){ q.id=uid('qq'); }); });
  b.tienQuyet=hp.quyTac==='mo-toan-bo'?[]:[hp.bai[i].id];
  hp.bai.splice(i+1,0,b); renumber(hp);
  LMS.commit('Nhân bản bài','Học phần',hp.ma+' · '+b.ten);
  U.toast('Đã nhân bản thành bài nháp ngay sau bài gốc','ok'); renderDetail();
}
function removeBai(hp,b){
  var refs=[], d=D();
  var nq=d.cauHoi.filter(function(q){ return q.bai===b.id; }).length; if(nq) refs.push(nq+' câu hỏi trong ngân hàng gắn với bài');
  var nh=d.hoiDap.filter(function(q){ return q.bai===b.id; }).length; if(nh) refs.push(nh+' chủ đề hỏi đáp của học viên');

  if(refs.length){ U.blocked('Không thể xóa '+plain(b.ten),refs,'Chuyển các liên kết sang bài khác, hoặc tắt "Hiện" ở tab Nội dung học tập để ẩn bài với học viên.'); return; }
  var dep=hp.bai.filter(function(x){ return (x.tienQuyet||[]).indexOf(b.id)>=0; }), ld=lopMo(hp);

    if(!y) return;
    hp.bai=hp.bai.filter(function(x){ return x.id!==b.id; });
    hp.bai.forEach(function(x){ x.tienQuyet=(x.tienQuyet||[]).filter(function(t){ return t!==b.id; }); });

function validateBai(b){

    if(k.loai==='nhung' && !/^https:\/\//i.test(k.url||'')) m='Đường dẫn nhúng phải bắt đầu bằng https://';
    if(k.loai==='trang-tt' && !String(k.html||'').trim()) m='Chưa có mã trang tương tác';
    if(k.loai==='tieu-de' && !String(k.text||'').trim()) m='Tiêu đề đang trống';
    if(k.loai==='cong-thuc' && !String(k.tex||'').trim()) m='Công thức đang trống';
    if(k.loai==='quiz'){ k.cauHoi.forEach(function(q,qi){ if(m) return; var p='Câu '+(qi+1)+': ';
      if(!String(q.noiDung||'').trim() && q.loai!=='gach-chan') m=p+'chưa nhập nội dung';
      else if(q.loai==='mot'||q.loai==='nhieu'){ if(q.pa.some(function(x){ return !String(x.t).trim(); })) m=p+'có phương án trống'; else if(!q.pa.some(function(x){ return x.dung; })) m=p+'chưa chọn đáp án đúng'; }
      else if(q.loai==='ngan' && !(q.dapAn||[]).length) m=p+'chưa nhập đáp án chấp nhận';
      else if(q.loai==='noi' && q.cap.some(function(c){ return !c.trai.trim()||!c.phai.trim(); })) m=p+'có cặp nối chưa đủ hai vế';
      else if(q.loai==='sap-xep' && q.muc.some(function(x){ return !String(x).trim(); })) m=p+'có mục sắp xếp trống';
      else if(q.loai==='gach-chan' && !/\[\[[^\]]+\]\]/.test(q.doanVan||'')) m=p+'chưa đánh dấu từ cần gạch chân bằng [[ ]]';
    }); }

  });
  return {errs:errs,msgs:msgs,n:n};
}

function shuffle(a,seed){ a=a.slice(); var s=seed||7; for(var i=a.length-1;i>0;i--){ s=(s*9301+49297)%233280; var j=Math.floor(s/233280*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function bindPv(host,blocks){

    var box=host.querySelector('[data-pq="'+k.id+'"]'), dung=0, tong=0;
    k.cauHoi.forEach(function(q,qi){ var it=box.querySelector('[data-qi="'+qi+'"]'), ok=null;
      if(q.loai==='mot'||q.loai==='nhieu'){ var ch=[].slice.call(it.querySelectorAll('input:checked')).map(function(x){return +x.value;}); ok=q.pa.every(function(p,i){ return p.dung===(ch.indexOf(i)>=0); }); }
      if(q.loai==='dung-sai'){ var c=it.querySelector('input:checked'); ok=!!c && (c.value==='1')===q.dung; }
      if(q.loai==='ngan'){ var v=U.norm(it.querySelector('input').value.trim()); ok=(q.dapAn||[]).some(function(a){ return U.norm(a)===v; }); }
      if(q.loai==='noi'){ ok=[].slice.call(it.querySelectorAll('[data-noi]')).every(function(s){ return s.value===q.cap[+s.dataset.noi].phai; }); }

      var r=it.querySelector('.res');

  }; });
