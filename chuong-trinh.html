<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chương trình đào tạo · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edot.css">
<style>
.ct-lay{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
.ct-rail{position:sticky;top:8px;background:var(--ems-surface);border:1px solid var(--ems-border);border-radius:var(--r-card);display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.rail-h{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.rail-h b{font-size:13px;flex:1}
.rail-q{padding:0 10px 8px}
.rail-q .inp{width:100%;padding:6px 10px;font-size:13px}
.ct-tree{overflow-y:auto;padding:0 6px 8px;border-top:1px solid var(--ems-border)}
.he{display:flex;align-items:center;gap:6px;padding:7px 6px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;color:var(--ems-text);margin-top:4px;user-select:none}
.he:hover{background:var(--ems-surface-2)}
.he .tw{width:14px;text-align:center;font-size:10px;color:var(--ems-muted);flex:none}
.he .fo{color:var(--ems-warning);flex:none;display:flex}
.he .nm{flex:1;min-width:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.he .cnt{font-size:11px;font-weight:600;color:var(--ems-muted);background:var(--ems-surface-2);border-radius:99px;padding:0 7px}
.he .mo,.pg .mo{border:0;background:transparent;color:var(--ems-muted);cursor:pointer;padding:0 4px;border-radius:4px;font-size:14px;line-height:1;opacity:.6}
.he:hover .mo{opacity:1}
.he .mo:hover{background:var(--ems-border);color:var(--ems-text)}
.he.unc{font-weight:600;color:var(--ems-text-2)}
.pg{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent;margin:1px 0}
.pg:hover{background:var(--ems-surface-2)}
.pg.on{background:var(--ems-navy-soft);border-color:var(--ems-navy-line)}
.pg .dt{width:7px;height:7px;border-radius:50%;background:var(--ems-success);margin-top:6px;flex:none}
.pg.ngung .dt{background:var(--ems-faint)}
.pg .tx{min-width:0;flex:1}
.pg .tx b{display:block;font-size:13px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg.on .tx b{color:var(--ems-navy)}
.pg .tx small{display:block;font-size:11px;color:var(--ems-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg[draggable=true]{cursor:grab}
.pg.dragging{opacity:.4}
.drop-in{background:var(--ems-navy-soft)!important;box-shadow:inset 0 0 0 1.5px var(--ems-navy)}
.pg.drop-bf{box-shadow:0 -2px 0 var(--ems-navy)}
.pg-empty{font-size:11px;color:var(--ems-faint);padding:4px 8px 6px;border:1px dashed var(--ems-border);border-radius:6px;margin:2px 0 4px}
.rail-ft{border-top:1px solid var(--ems-border);padding:8px 12px;font-size:11px;color:var(--ems-muted)}
.ct-hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ct-hd h2{font-size:20px;margin:0;letter-spacing:-.01em}
.ct-hd .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ct-hd .acts{margin-left:auto;display:flex;gap:8px}
.grp{border:1px solid var(--ems-border);border-radius:10px;background:var(--ems-surface);margin-bottom:12px;overflow:hidden}
.grp-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ems-surface-2);border-bottom:1px solid var(--ems-border)}
.grp-h b{font-size:14px}
.grp-h .r{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--ems-text-2)}
.hp{display:grid;grid-template-columns:30px minmax(200px,1.4fr) 150px minmax(120px,.8fr) 130px 150px;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--ems-border)}
.grp-h + .hp{border-top:0}
.hp:hover{background:var(--ems-surface-2)}
.hp.flash{background:var(--ems-navy-soft)}
.hp .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--ems-navy-line);color:var(--ems-navy);display:grid;place-items:center;font-size:12px;font-weight:800}
.hp.ok .n{background:var(--ems-navy);border-color:var(--ems-navy);color:#fff}
:root[data-theme="dark"] .hp.ok .n{color:#0b1220}
.hp .t{min-width:0}
.hp .t b{display:block;font-size:14px}
.hp .t small{display:block;color:var(--ems-muted);font-size:12px;margin-top:2px}
.hp .inf{font-size:12.5px;color:var(--ems-text-2)}
.hp .inf small{display:block;color:var(--ems-muted)}
.hp .ac{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--ems-navy);cursor:pointer;font-weight:600;text-align:left}
.lnk:hover{text-decoration:underline}
.pick-list{max-height:320px;overflow-y:auto;border:1px solid var(--ems-border);border-radius:var(--r-ctl)}
.pick-item{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--ems-border);cursor:pointer}
.pick-item:last-child{border-bottom:0}
.pick-item:hover{background:var(--ems-surface-2)}
.pick-item input{margin-top:3px}
@media(max-width:1180px){.hp{grid-template-columns:30px minmax(0,1fr) 140px 150px}.hp .c3,.hp .c4{display:none}}
@media(max-width:900px){.ct-lay{grid-template-columns:1fr}.ct-rail{position:static;max-height:none}.hp{grid-template-columns:30px minmax(0,1fr) auto}.hp .c2{display:none}}
</style>
</head><body>
<div class="page" id="app"></div>
<script src="lms-core.js"></script>
<script>
(function(){ 'use strict';
/* Khung chương trình trực tuyến: chương trình → nhóm học phần → học phần mở lớp trên cổng */
var U = LMS.ui, esc = U.esc, app = document.getElementById('app');
var st = { sel: null, tab: 'lo-trinh', lq: '', flash: null };
function D(){ return LMS.db; }
function all(){ return D().chuongTrinh; }
function kids(id){ return all().filter(function(c){ return (c.cha || null) === (id || null); }); }
function subtree(id){ var out = [id]; kids(id).forEach(function(k){ out = out.concat(subtree(k.id)); }); return out; }
function roots(){ return kids(null); }
function mons(id){ return subtree(id).map(function(i){ return LMS.byId('chuongTrinh', i); }).filter(function(c){ return c && c.loai === 'hoc-phan'; }); }
function hpCua(m){ return m.hocPhan.length ? LMS.byId('hocPhan', m.hocPhan[0]) : null; }
function tt(m){ var hp = hpCua(m); return !hp ? 'chua' : hp.trangThai === 'hoat-dong' ? 'ok' : hp.trangThai === 'nhap' ? 'nhap' : 'ngung'; }
var TT = { ok: ['Sẵn sàng mở lớp', 'ok'], nhap: ['Đang biên soạn', 'warn'], chua: ['Chưa có nội dung', ''], ngung: ['Nội dung ngưng dùng', 'bad'] };
function khoaList(){ return D().donVi.filter(function(d){ return d.laKhoa; }); }
function lopCua(id){ var ids = subtree(id); return D().lop.filter(function(l){ return ids.indexOf(l.chuongTrinh) >= 0; }); }
function dangMo(ls){ return ls.filter(function(l){ return l.trangThai === 'dang-hoc' || l.trangThai === 'tuyen-sinh'; }); }
function hvCua(ls){ var m = {}, hv = {}; ls.forEach(function(l){ m[l.id] = 1; }); D().ghiDanh.forEach(function(g){ if (g.trangThai === 'dang-hoc' && m[g.lop]) hv[g.hv] = 1; }); return Object.keys(hv).length; }
function hocLieu(ms){ var bai = 0, phut = 0; ms.forEach(function(m){ var hp = hpCua(m); if (hp) hp.bai.forEach(function(b){ if (b.xuatBan !== false) { bai++; phut += b.phut || 0; } }); }); return { bai: bai, gio: Math.round(phut / 60) }; }
/* ---- danh mục chương trình (hệ đào tạo) ---- */
var FO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
var DONG = (function(){ try { return JSON.parse(localStorage.getItem('egoLmsDemo.ctHe') || '{}'); } catch (e) { return {}; } })();
function luuDong(){ try { localStorage.setItem('egoLmsDemo.ctHe', JSON.stringify(DONG)); } catch (e) {} }
function hes(){ return D().heDaoTao || (D().heDaoTao = []); }
function heById(id){ return hes().filter(function(h){ return h.id === id; })[0] || null; }
function heKids(id){ return hes().filter(function(h){ return (h.cha || null) === (id || null); }); }
function heSub(id){ var o = [id]; heKids(id).forEach(function(k){ o = o.concat(heSub(k.id)); }); return o; }
function heOf(c){ return c.he && heById(c.he) ? c.he : null; }
function hePath(id){ var p = [], h = heById(id), g = 0; while (h && g++ < 20) { p.unshift(h.ten); h = h.cha ? heById(h.cha) : null; } return p.join(' › '); }
function heOpts(boQua){ var o = []; (function walk(pid, d){ heKids(pid).forEach(function(h){ if (boQua && boQua.indexOf(h.id) >= 0) return; o.push({ id: h.id, t: (d ? '\u00a0\u00a0\u00a0\u00a0'.repeat(d) + '└ ' : '') + h.ten }); walk(h.id, d + 1); }); })(null, 0); return o; }
function quanTri(){ return LMS.phamVi.all; }
function suaDuoc(c){ return LMS.phamVi.all || !!LMS.phamVi.ids[c.khoa]; }
function cur(){ var c = LMS.byId('chuongTrinh', st.sel); if (!c || c.cha) { c = roots()[0] || null; st.sel = c ? c.id : null; } return c; }
function doiCho(n, d){ var sib = kids(n.cha), i = sib.indexOf(n), o = sib[i + d]; if (!o) return; var a = all(), x = a.indexOf(n), y = a.indexOf(o); a[x] = o; a[y] = n; LMS.commit(null); veChiTiet(); }

function render(){
  var rs = roots(), ms = all().filter(function(x){ return x.loai === 'hoc-phan'; });
  app.innerHTML = '<div class="page-head"><div><h1>Chương trình đào tạo</h1><div class="sub">Khung học phần học trực tuyến để mở lớp trên cổng · ' + rs.length + ' chương trình · ' + ms.filter(function(m){ return tt(m) === 'ok'; }).length + '/' + ms.length + ' học phần sẵn sàng mở lớp</div></div><div class="actions"><button class="btn primary" id="btnAdd">+ Thêm chương trình</button></div></div><div class="ct-lay"><aside class="ct-rail" id="rail"></aside><section id="detail" class="stack" style="gap:14px;min-width:0"></section></div>';
  document.getElementById('btnAdd').onclick = function(){ formCT(null); };
  veRail(); veChiTiet();
}
function veRail(){
  var rail = document.getElementById('rail'), nq = U.norm(st.lq), loc = !!nq;
  var ds = roots().filter(function(c){ return !nq || U.norm(c.ma + ' ' + c.ten).indexOf(nq) >= 0; });
  function progs(heId){ return ds.filter(function(c){ return heOf(c) === heId; }); }
  function dem(heId){ return heSub(heId).reduce(function(n, id){ return n + progs(id).length; }, 0); }
  var h = '<div class="rail-h"><b>Danh mục chương trình</b>' + (quanTri() ? '<button class="btn sm" id="heAdd" title="Thêm mục cấp gốc">+ Mục</button>' : '') + '</div><div class="rail-q"><input class="inp" id="lq" placeholder="Tìm chương trình" value="' + esc(st.lq) + '"></div><div class="ct-tree" id="tree">';
  function pgRow(c, d){ var ms = mons(c.id), ok = ms.filter(function(m){ return tt(m) === 'ok'; }).length, mo = dangMo(lopCua(c.id)).length, kh = LMS.byId('donVi', c.khoa);
    return '<div class="pg' + (c.id === st.sel ? ' on' : '') + (c.trangThai === 'ngung' ? ' ngung' : '') + '" data-ct="' + c.id + '"' + (suaDuoc(c) && !loc ? ' draggable="true"' : '') + ' style="padding-left:' + (10 + d * 14) + 'px" title="' + esc(c.ten + (c.trangThai === 'ngung' ? ' · Ngưng dùng' : '')) + '"><span class="dt"></span><span class="tx"><b>' + U.hl(c.ten, st.lq) + '</b><small>' + esc(kh ? kh.ma : 'Chưa gắn khoa') + ' · ' + ok + '/' + ms.length + ' sẵn sàng · ' + mo + ' lớp mở</small></span></div>'; }
  function heRow(he, d){
    var n = dem(he.id); if ((loc || !quanTri()) && !n) return '';
    var mo = loc || !DONG[he.id], r = '<div class="he" data-he="' + he.id + '" style="padding-left:' + (6 + d * 14) + 'px"><span class="tw">' + (mo ? '▾' : '▸') + '</span><span class="fo">' + FO + '</span><span class="nm" title="' + esc(he.ten) + '">' + esc(he.ten) + '</span><span class="cnt">' + n + '</span>' + (quanTri() ? '<button class="mo" data-mhe="' + he.id + '" aria-label="Thao tác mục ' + esc(he.ten) + '">⋯</button>' : '') + '</div>';
    if (!mo) return r;
    heKids(he.id).forEach(function(k){ r += heRow(k, d + 1); });
    var ps = progs(he.id); ps.forEach(function(c){ r += pgRow(c, d + 1); });
    if (!ps.length && !heKids(he.id).length && !loc) r += '<div class="pg-empty" data-hedrop="' + he.id + '" style="margin-left:' + (10 + (d + 1) * 14) + 'px">Chưa có chương trình · kéo chương trình vào đây</div>';
    return r;
  }
  heKids(null).forEach(function(he){ h += heRow(he, 0); });
  var khong = progs(null);
  if (khong.length || !loc) { h += '<div class="he unc" data-he=""><span class="tw">' + (loc || !DONG.__k ? '▾' : '▸') + '</span><span class="fo" style="color:var(--ems-faint)">' + FO + '</span><span class="nm">Chưa phân loại</span><span class="cnt">' + khong.length + '</span></div>'; if (loc || !DONG.__k) khong.forEach(function(c){ h += pgRow(c, 1); }); }
  if (!ds.length) h += '<div class="empty">Không có chương trình phù hợp</div>';
  h += '</div><div class="rail-ft">' + (loc ? 'Đang lọc theo từ khóa' : 'Kéo thả chương trình để chuyển mục hoặc đổi thứ tự') + '</div>';
  rail.innerHTML = h;
  var lq = document.getElementById('lq'); lq.oninput = function(){ st.lq = lq.value.trim(); var p = lq.selectionStart; veRail(); var n = document.getElementById('lq'); n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} };
  var ha = document.getElementById('heAdd'); if (ha) ha.onclick = function(){ formHe(null, null); };
  var tree = document.getElementById('tree');
  tree.querySelectorAll('.pg').forEach(function(b){ b.onclick = function(){ st.sel = b.dataset.ct; veRail(); veChiTiet(); }; });
  tree.querySelectorAll('.he').forEach(function(b){ b.onclick = function(e){ var m = e.target.closest('[data-mhe]'); if (m) { e.stopPropagation(); menuHe(m, heById(m.dataset.mhe)); return; } if (loc) return; var k = b.dataset.he || '__k'; DONG[k] = !DONG[k]; luuDong(); veRail(); }; });
  /* kéo thả */
  var keo = null;
  function clr(){ tree.querySelectorAll('.drop-in,.drop-bf').forEach(function(x){ x.classList.remove('drop-in', 'drop-bf'); }); }
  tree.querySelectorAll('.pg[draggable]').forEach(function(el){
    el.addEventListener('dragstart', function(e){ keo = el.dataset.ct; el.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', keo); e.dataTransfer.effectAllowed = 'move'; } catch (x) {} });
    el.addEventListener('dragend', function(){ el.classList.remove('dragging'); clr(); keo = null; });
  });
  tree.querySelectorAll('.pg,.he,.pg-empty').forEach(function(el){
    el.addEventListener('dragover', function(e){ if (!keo) return; e.preventDefault(); clr(); el.classList.add(el.classList.contains('pg') ? 'drop-bf' : 'drop-in'); });
    el.addEventListener('drop', function(e){ e.preventDefault(); clr(); if (!keo) return; var c = LMS.byId('chuongTrinh', keo), dich = null, truoc = null;
      if (el.classList.contains('pg')) { truoc = LMS.byId('chuongTrinh', el.dataset.ct); if (!truoc || truoc === c) return; dich = heOf(truoc); }
      else dich = el.dataset.hedrop != null ? el.dataset.hedrop : (el.dataset.he || null);
      chuyenMuc(c, dich, truoc); keo = null; });
  });
}
function chuyenMuc(c, heId, truoc){
  var cu = heOf(c), a = all(), i = a.indexOf(c); if (i < 0) return;
  a.splice(i, 1);
  if (truoc) a.splice(a.indexOf(truoc), 0, c); else a.push(c);
  c.he = heId || null;
  if (heId) DONG[heId] = false; else DONG.__k = false; luuDong();
  if (cu !== c.he) { LMS.commit('Chuyển mục', 'Chương trình đào tạo', c.ma + ' · ' + c.ten + ' → ' + (heId ? hePath(heId) : 'Chưa phân loại'), { 'Mục': cu ? hePath(cu) : 'Chưa phân loại' }, { 'Mục': heId ? hePath(heId) : 'Chưa phân loại' }); U.toast('Đã chuyển ' + c.ma + ' vào “' + (heId ? heById(heId).ten : 'Chưa phân loại') + '”', 'ok'); }
  else LMS.commit('Sắp xếp', 'Chương trình đào tạo', c.ma + ' · đổi thứ tự trong mục');
  st.sel = c.id; render();
}
function menuHe(btn, he){
  var sib = heKids(he.cha), i = sib.indexOf(he);
  U.menu(btn, [
    { label: 'Đổi tên / chuyển mục cha', onClick: function(){ formHe(he); } },
    { label: 'Thêm mục con', onClick: function(){ formHe(null, he.id); } },
    { label: 'Thêm chương trình vào mục', onClick: function(){ formCT(null, he.id); } },
    { label: 'Đưa lên', disabled: i === 0, onClick: function(){ doiHe(he, sib[i - 1]); } },
    { label: 'Đưa xuống', disabled: i === sib.length - 1, onClick: function(){ doiHe(he, sib[i + 1]); } },
    '-',
    { label: 'Xóa mục', danger: true, onClick: function(){ xoaHe(he); } }
  ]);
}
function doiHe(a, b){ var l = hes(), x = l.indexOf(a), y = l.indexOf(b); l[x] = b; l[y] = a; LMS.commit(null); veRail(); }
function formHe(he, cha){
  var moi = !he, cam = he ? heSub(he.id) : [];
  U.modal({ title: moi ? 'Thêm mục chương trình' : 'Sửa mục · ' + he.ten, size: 'sm',
    body: '<div class="field"><label>Tên mục <span class="req">*</span></label><input class="inp" name="ten" maxlength="120" value="' + esc(he ? he.ten : '') + '" placeholder="VD: Đào tạo sau đại học"></div><div class="field" style="margin-top:10px"><label>Thuộc mục</label><select class="sel" name="cha">' + U.opts(heOpts(cam), 'id', 't', he ? he.cha || '' : cha || '', '— Cấp gốc —') + '</select><div class="hint">Dùng để gom chương trình theo hệ, loại hình đào tạo.</div></div>',
    foot: [{ label: 'Hủy', close: true }, { label: moi ? 'Thêm mục' : 'Lưu', cls: 'primary', onClick: function(a){
      var v = U.formVals(a.body); v.ten = String(v.ten || '').trim().replace(/\s+/g, ' '); v.cha = v.cha || null;
      if (!v.ten) { U.fieldErr(a.body, 'ten', 'Nhập tên mục'); return false; }
      if (heKids(v.cha).some(function(x){ return x !== he && U.norm(x.ten) === U.norm(v.ten); })) { U.fieldErr(a.body, 'ten', 'Đã có mục cùng tên ở cấp này'); return false; }
      if (moi) { hes().push({ id: LMS.nextId('he'), ten: v.ten, cha: v.cha }); if (v.cha) DONG[v.cha] = false; luuDong(); LMS.commit('Tạo', 'Danh mục chương trình', (v.cha ? hePath(v.cha) + ' › ' : '') + v.ten); U.toast('Đã thêm mục ' + v.ten, 'ok'); }
      else { var t = { 'Tên': he.ten, 'Thuộc mục': he.cha ? hePath(he.cha) : 'Cấp gốc' }; he.ten = v.ten; he.cha = v.cha; LMS.commit('Sửa', 'Danh mục chương trình', v.ten, t, { 'Tên': he.ten, 'Thuộc mục': he.cha ? hePath(he.cha) : 'Cấp gốc' }); U.toast('Đã lưu mục ' + v.ten, 'ok'); }
      veRail(); veChiTiet();
    } }] });
}
function xoaHe(he){
  var con = heKids(he.id), ps = roots().filter(function(c){ return heOf(c) === he.id; }), cha = he.cha ? heById(he.cha) : null;
  var html = 'Xóa mục <b>' + esc(he.ten) + '</b>?' + (ps.length || con.length ? '<div class="note warn" style="margin-top:10px">' + [ps.length ? ps.length + ' chương trình chuyển sang <b>' + esc(cha ? cha.ten : 'Chưa phân loại') + '</b>' : '', con.length ? con.length + ' mục con chuyển lên <b>' + esc(cha ? cha.ten : 'cấp gốc') + '</b>' : ''].filter(Boolean).join('; ') + '. Chương trình không bị xóa.</div>' : '');
  U.confirm({ title: 'Xóa mục chương trình', html: html, ok: 'Xóa mục', danger: true }).then(function(y){
    if (!y) return;
    con.forEach(function(k){ k.cha = he.cha || null; }); ps.forEach(function(c){ c.he = he.cha || null; });
    D().heDaoTao = hes().filter(function(x){ return x !== he; });

      var ids = Object.keys(sel), dk = U.formVals(a.body).duKien;
      if (!ids.length && !dk) { U.toast('Chọn học phần hoặc nhập tên học phần dự kiến', 'bad'); return false; }
      if (dk && mons(c.id).some(function(x){ return U.norm(x.ten) === U.norm(dk); })) { U.fieldErr(a.body, 'duKien', 'Chương trình đã có học phần này'); return false; }
      ids.forEach(function(id){ var hp = LMS.byId('hocPhan', id); all().push({ id: LMS.nextId('ct'), ma: hp.ma, ten: hp.ten, cha: g.id, khoa: hp.khoa, hocPhan: [id], trangThai: 'hoat-dong', loai: 'hoc-phan', hocSau: [] }); });
      if (dk) all().push({ id: LMS.nextId('ct'), ma: 'DK' + (mons(c.id).length + 1), ten: dk, cha: g.id, khoa: g.khoa, hocPhan: [], trangThai: 'hoat-dong', loai: 'hoc-phan', hocSau: [] });
      LMS.commit('Gắn học phần', 'Chương trình đào tạo', c.ma + ' · ' + g.ten + ' · thêm ' + (ids.length + (dk ? 1 : 0)) + ' học phần'); U.toast('Đã thêm ' + (ids.length + (dk ? 1 : 0)) + ' học phần vào ' + g.ten, 'ok'); veRail(); veChiTiet();
    } }] });
}
function ganHP(m){
  var c = cur(), da = hpTrongCT(c, m), chon = m.hocPhan[0] || '', q = '';
  U.modal({ title: 'Nội dung của ' + m.ten, body: '<input class="inp" data-q placeholder="Tìm học phần theo mã, tên" style="margin-bottom:10px"><div class="pick-list" data-list></div>',
    onOpen: function(api){
      var list = api.body.querySelector('[data-list]');
      function draw(){ var hps = D().hocPhan.filter(function(h){ return (h.trangThai !== 'ngung' || h.id === chon) && !da[h.id] && (!q || U.norm(h.ma + ' ' + h.ten).indexOf(U.norm(q)) >= 0); });
        list.innerHTML = '<label class="pick-item"><input type="radio" name="hp" value=""' + (chon ? '' : ' checked') + '><div><b>Chưa gắn</b><div class="small muted">Giữ là học phần dự kiến</div></div></label>' + hps.map(function(h){ return '<label class="pick-item"><input type="radio" name="hp" value="' + h.id + '"' + (chon === h.id ? ' checked' : '') + '>' + dongHP(h, q) + '</label>'; }).join('');
        list.querySelectorAll('[name=hp]').forEach(function(r){ r.onchange = function(){ chon = r.value; }; }); }
      api.body.querySelector('[data-q]').oninput = function(e){ q = e.target.value.trim(); draw(); }; draw();
    },
    foot: [{ label: 'Hủy', close: true }, { label: 'Lưu', cls: 'primary', onClick: function(){
      var cu = m.hocPhan[0] || ''; if (cu === chon) return;
      if (cu) { var refs = D().lop.filter(function(l){ return l.chuongTrinh === m.id && l.hocPhan === cu && l.trangThai !== 'ket-thuc' && l.trangThai !== 'huy'; }).map(function(l){ return 'Lớp ' + l.ma + ' · ' + l.ten; }); if (refs.length) { U.blocked('Không thể đổi nội dung', refs, 'Học phần đang có lớp mở theo nội dung hiện tại.'); return false; } }
      var hp = chon ? LMS.byId('hocPhan', chon) : null; m.hocPhan = chon ? [chon] : []; if (hp) { m.ten = hp.ten; m.ma = hp.ma; }
      LMS.commit('Gắn học phần', 'Chương trình đào tạo', c.ma + ' · ' + m.ten + (hp ? ' → ' + hp.ma : ' · bỏ gắn'), { hocPhan: cu }, { hocPhan: chon });
      U.toast(hp ? 'Đã gắn nội dung ' + hp.ma : 'Đã bỏ gắn nội dung', 'ok'); st.flash = m.id; veRail(); veChiTiet();
    } }] });
}
function hocTruoc(m){
  var c = cur(), ds = mons(c.id).filter(function(x){ return x !== m; }), sel = {}; (m.hocSau || []).forEach(function(i){ sel[i] = 1; });
  function phuThuoc(x, dich, seen){ seen = seen || {}; if (!x || seen[x.id]) return false; seen[x.id] = 1; return (x.hocSau || []).some(function(i){ return i === dich || phuThuoc(LMS.byId('chuongTrinh', i), dich, seen); }); }
  U.modal({ title: 'Học phần học trước · ' + m.ten, body: '<div class="small muted" style="margin-bottom:8px">Học viên được khuyến nghị hoàn thành các học phần đã chọn trước khi đăng ký ' + esc(m.ten) + '.</div><div class="pick-list">' + ds.map(function(x){ var vong = phuThuoc(x, m.id); return '<label class="pick-item"><input type="checkbox" data-id="' + x.id + '"' + (sel[x.id] ? ' checked' : '') + (vong ? ' disabled' : '') + '><div><b>' + esc(x.ten) + '</b><div class="small muted">' + esc(LMS.byId('chuongTrinh', x.cha).ten) + (vong ? ' · đang yêu cầu học sau ' + esc(m.ten) : '') + '</div></div></label>'; }).join('') + '</div>', foot: [{ label: 'Hủy', close: true }, { label: 'Lưu', cls: 'primary', onClick: function(a){ m.hocSau = [].slice.call(a.body.querySelectorAll('[data-id]:checked')).map(function(x){ return x.dataset.id; }); LMS.commit('Sửa', 'Chương trình đào tạo', c.ma + ' · ' + m.ten + ' · học phần học trước'); U.toast('Đã lưu thứ tự học', 'ok'); st.flash = m.id; veChiTiet(); } }] });
}
function doiTen(m){
  U.modal({ title: 'Đổi tên học phần dự kiến', size: 'sm', body: '<div class="field"><label>Tên học phần <span class="req">*</span></label><input class="inp" name="ten" maxlength="150" value="' + esc(m.ten) + '"></div>', foot: [{ label: 'Hủy', close: true }, { label: 'Lưu', cls: 'primary', onClick: function(a){ var v = U.formVals(a.body); if (!v.ten) { U.fieldErr(a.body, 'ten', 'Nhập tên học phần'); return false; } m.ten = v.ten; LMS.commit('Sửa', 'Chương trình đào tạo', cur().ma + ' · ' + m.ten); veChiTiet(); } }] });
}
function toggleTT(c){
  var ngung = c.trangThai !== 'ngung', n = dangMo(lopCua(c.id)).length;
  U.confirm({ title: ngung ? 'Ngưng dùng chương trình' : 'Kích hoạt chương trình', html: ngung ? 'Ngưng dùng <b>' + esc(c.ten) + '</b>? Chương trình không còn được chọn khi mở lớp mới.' + (n ? '<div class="note warn" style="margin-top:10px">' + n + ' lớp đang học/tuyển sinh vẫn tiếp tục bình thường.</div>' : '') : 'Kích hoạt lại <b>' + esc(c.ten) + '</b>?', ok: ngung ? 'Ngưng dùng' : 'Kích hoạt', danger: ngung }).then(function(y){
    if (!y) return; var t = c.trangThai; c.trangThai = ngung ? 'ngung' : 'hoat-dong';
    LMS.commit(ngung ? 'Ngưng dùng' : 'Kích hoạt', 'Chương trình đào tạo', c.ma + ' · ' + c.ten, { trangThai: t }, { trangThai: c.trangThai }); U.toast(ngung ? 'Đã ngưng dùng ' + c.ma : 'Đã kích hoạt ' + c.ma, 'ok'); render();
  });
}
function xoa(n){
  var ids = subtree(n.id), refs = [], l = n.loai;
  D().lop.forEach(function(x){ if (ids.indexOf(x.chuongTrinh) >= 0) refs.push('Lớp ' + x.ma + ' · ' + x.ten); });
  if (refs.length) { U.blocked('Không thể ' + (l === 'hoc-phan' ? 'gỡ ' : 'xóa ') + n.ten, refs.slice(0, 12), l === 'chuong-trinh' ? 'Dùng thao tác Ngưng dùng để giữ lịch sử đào tạo.' : 'Học phần đã mở lớp theo chương trình này nên phải giữ lại.'); return; }
  var ten = { 'chuong-trinh': 'chương trình', nhom: 'nhóm', 'hoc-phan': 'học phần' }[l] || 'mục';
  U.confirm({ title: (l === 'hoc-phan' ? 'Gỡ ' : 'Xóa ') + ten, html: (l === 'hoc-phan' ? 'Gỡ <b>' + esc(n.ten) + '</b> khỏi chương trình? Bài giảng của học phần không bị xóa.' : 'Xóa ' + ten + ' <b>' + esc(n.ten) + '</b>' + (ids.length > 1 ? ' cùng ' + (ids.length - 1) + ' mục bên trong' : '') + '?'), ok: l === 'hoc-phan' ? 'Gỡ' : 'Xóa', danger: true }).then(function(y){
    if (!y) return; D().chuongTrinh = all().filter(function(x){ return ids.indexOf(x.id) < 0; });
    all().forEach(function(x){ if (x.hocSau) x.hocSau = x.hocSau.filter(function(i){ return ids.indexOf(i) < 0; }); });
    LMS.commit('Xóa', 'Chương trình đào tạo', (l === 'chuong-trinh' ? '' : cur().ma + ' · ') + ten + ' ' + n.ten, { ma: n.ma, ten: n.ten }, null);
    U.toast('Đã ' + (l === 'hoc-phan' ? 'gỡ ' : 'xóa ') + n.ten, 'ok'); if (l === 'chuong-trinh') st.sel = null; render();
  });
}

var p = LMS.param('chuong-trinh.html');
if (p && p.chuongTrinh) { var g = LMS.ctGoc(p.chuongTrinh); if (g) { st.sel = g.id; if (g.id !== p.chuongTrinh) st.flash = p.chuongTrinh; } }
LMS.onChange(render);
render();
})();
</script>
</body></html>
