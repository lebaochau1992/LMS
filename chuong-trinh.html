<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chương trình đào tạo · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edot.css">
<style>
.ct-lay{display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
.ct-rail{position:sticky;top:8px;background:var(--ems-surface);border:1px solid var(--ems-border);border-radius:var(--r-card);display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.rail-h{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.rail-h b{font-size:14px;flex:1;text-transform:uppercase;letter-spacing:.03em;color:var(--ems-text-2)}
.rail-q{padding:0 12px 10px}
.rail-q .inp{width:100%;padding:8px 12px;font-size:14px}
.ct-tree{overflow-y:auto;padding:6px 8px 10px;border-top:1px solid var(--ems-border)}
.he{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:700;color:var(--ems-text);margin-top:6px;user-select:none}
.he:first-child{margin-top:0}
.he:hover{background:var(--ems-surface-2)}
.he .tw{width:16px;text-align:center;font-size:11px;color:var(--ems-muted);flex:none;transition:transform .15s}
.he .tw.dong{transform:rotate(-90deg)}
.he .fo{color:var(--ems-warning);flex:none;display:flex}
.he .nm{flex:1;min-width:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.he .cnt{font-size:12px;font-weight:700;color:var(--ems-text-2);background:var(--ems-surface-2);border:1px solid var(--ems-border);border-radius:99px;padding:1px 8px;min-width:24px;text-align:center}
.he .mo,.pg .mo{border:0;background:transparent;color:var(--ems-muted);cursor:pointer;padding:2px 6px;border-radius:4px;font-size:15px;line-height:1;opacity:0}
.he:hover .mo,.he .mo:focus{opacity:1}
.he .mo:hover{background:var(--ems-border);color:var(--ems-text)}
.he.unc{font-weight:600;color:var(--ems-text-2);margin-top:10px;border-top:1px dashed var(--ems-border);border-radius:0 0 8px 8px;padding-top:11px}
.he-body{position:relative}
.he-body::before{content:"";position:absolute;top:2px;bottom:4px;left:var(--gl,15px);border-left:1px solid var(--ems-border)}
.pg{position:relative;display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin:2px 0}
.pg:hover{background:var(--ems-surface-2)}
.pg.on{background:var(--ems-navy-soft);border-color:var(--ems-navy-line)}
.pg.on::before{content:"";position:absolute;left:-1px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--ems-navy)}
.pg .dt{width:8px;height:8px;border-radius:50%;background:var(--ems-success);margin-top:7px;flex:none}
.pg.ngung .dt{background:var(--ems-faint)}
.pg .tx{min-width:0;flex:1}
.pg .tx b{display:block;font-size:14px;font-weight:600;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.pg.on .tx b{color:var(--ems-navy)}
.pg .tx small{display:block;font-size:12px;color:var(--ems-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .tx small .ok{color:var(--ems-success);font-weight:600}
.pg[draggable=true]{cursor:grab}
.pg.dragging{opacity:.4}
.drop-in{background:var(--ems-navy-soft)!important;box-shadow:inset 0 0 0 1.5px var(--ems-navy)}
.pg.drop-bf{box-shadow:0 -2px 0 var(--ems-navy)}
.pg-empty{font-size:12px;color:var(--ems-faint);padding:6px 10px;border:1px dashed var(--ems-border);border-radius:6px;margin:2px 0 6px}
.rail-ft{border-top:1px solid var(--ems-border);padding:9px 14px;font-size:12px;color:var(--ems-muted)}
.ct-hd{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.ct-hd h2{font-size:20px;margin:0;letter-spacing:-.01em}
.ct-hd .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ct-hd .acts{margin-left:auto;display:flex;gap:8px}
.grp{border:1px solid var(--ems-border);border-radius:10px;background:var(--ems-surface);margin-bottom:12px;overflow:hidden;transition:box-shadow .12s}
.grp-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--ems-surface-2);border-bottom:1px solid var(--ems-border);cursor:pointer;user-select:none}
.grp.dong .grp-h{border-bottom:0}
.grp.dong .grp-b{display:none}
.grp-h .tw{width:18px;flex:none;text-align:center;font-size:12px;color:var(--ems-muted);transition:transform .15s}
.grp.dong .grp-h .tw{transform:rotate(-90deg)}
.grp-h .kh{width:16px;flex:none;color:var(--ems-faint);cursor:grab;font-size:14px;line-height:1;letter-spacing:-2px;text-align:center}
.grp-h .kh:hover{color:var(--ems-text)}
.grp-h b{font-size:15px}
.grp-h .so{font-size:12px;font-weight:600;color:var(--ems-text-2);background:var(--ems-surface);border:1px solid var(--ems-border);border-radius:99px;padding:1px 9px}
.grp-h .r{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ems-text-2)}
.grp-h .kn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp.dragging{opacity:.45}
.grp.drop-tr{box-shadow:0 -3px 0 var(--ems-navy)}
.grp.drop-sa{box-shadow:0 3px 0 var(--ems-navy)}
.lt-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.lt-bar .gp{display:flex;gap:6px}
.hp{display:grid;grid-template-columns:30px minmax(200px,1.5fr) 150px minmax(140px,.9fr) 140px 36px;gap:12px;align-items:center;padding:12px;border-top:1px solid var(--ems-border)}
.grp-b > .hp:first-child{border-top:0}
.hp:hover{background:var(--ems-surface-2)}
.hp.flash{background:var(--ems-navy-soft)}
.hp .n{width:26px;height:26px;border-radius:50%;border:2px solid var(--ems-navy-line);color:var(--ems-navy);display:grid;place-items:center;font-size:12px;font-weight:800}
.hp.ok .n{background:var(--ems-navy);border-color:var(--ems-navy);color:#fff}
:root[data-theme="dark"] .hp.ok .n{color:#0b1220}
.hp .t{min-width:0}
.hp .t b{display:block;font-size:14px}
.hp .t small{display:block;color:var(--ems-muted);font-size:12px;margin-top:2px}
.hp .inf{font-size:12.5px;color:var(--ems-text-2)}
.hp .inf small{display:block;color:var(--ems-muted)}
.hp .ac{display:flex;gap:6px;justify-content:flex-end;align-items:center}
.page-head > div:first-child{flex:1;min-width:0}
.page-head .sub.ct-sub{flex:1 0 100%;box-sizing:border-box;font-weight:600;color:var(--ems-navy);font-size:13.5px;background:var(--ems-navy-soft);border:1px solid var(--ems-navy-line);border-left:3px solid var(--ems-navy);border-radius:6px;padding:7px 12px;margin-top:2px;line-height:1.5}
.so-lop{display:block;font-size:12.5px;font-weight:600;color:var(--ems-navy)}
.he-pick{border:1px solid var(--ems-border-strong);border-radius:var(--r-ctl);background:var(--ems-surface);max-height:280px;overflow-y:auto;padding:4px 0}
.hp-o{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--ems-text);margin:0;font-weight:400}
.hp-o:hover{background:var(--ems-surface-2)}
.hp-o.on{background:var(--ems-navy-soft);color:var(--ems-navy);font-weight:600}
.hp-o.dis{color:var(--ems-faint);cursor:not-allowed;background:none}
.hp-o input{margin:0;flex:none}
.hp-o .fo{color:var(--ems-warning);display:flex;flex:none}
.hp-o.dis .fo{color:var(--ems-faint)}
.hp-o .nm{flex:1;min-width:0}
.hp-o .ln{font-size:12px;font-style:italic;font-weight:400}
.lnk{background:none;border:0;padding:0;font:inherit;color:var(--ems-navy);cursor:pointer;font-weight:600;text-align:left}
.lnk:hover{text-decoration:underline}
.pick-list{max-height:320px;overflow-y:auto;border:1px solid var(--ems-border);border-radius:var(--r-ctl)}
.pick-item{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--ems-border);cursor:pointer}
.pick-item:last-child{border-bottom:0}
.pick-item:hover{background:var(--ems-surface-2)}
.pick-item input{margin-top:3px}
@media(max-width:1180px){.hp{grid-template-columns:30px minmax(0,1fr) 140px 36px}.hp .c3,.hp .c4{display:none}}
@media(max-width:1180px){.ct-lay{grid-template-columns:280px minmax(0,1fr)}}
@media(max-width:900px){.grp-h .kn{display:none}.ct-lay{grid-template-columns:1fr}.ct-rail{position:static;max-height:none}.hp{grid-template-columns:30px minmax(0,1fr) auto}.hp .c2{display:none}}
</style>
</head><body>
<div class="page" id="app"></div>
<script src="lms-core.js"></script>
<script>
(function(){ 'use strict';
/* Khung chương trình trực tuyến: chương trình → nhóm học phần → học phần mở lớp trên cổng

   [BẮT BUỘC TRIỂN KHAI] Phạm vi dữ liệu của màn này (quy tắc chung xem lms-core.js, mục PHẠM VI DỮ LIỆU):
   - Admin hệ thống / Quản trị hệ thống / nhóm quyền phạm vi Toàn Học viện: thấy và quản lý mọi chương trình.
   - Nhân sự phòng ban, khoa: danh mục bên trái chỉ có chương trình mà khoa chủ quản thuộc đơn vị được
     phân công (và đơn vị trực thuộc). Không hiển thị, không tìm thấy, không mở được bằng đường dẫn
     các chương trình do phòng ban / khoa khác đưa lên.
   - Thêm / sửa chương trình: ô Khoa chủ quản chỉ liệt kê khoa trong phạm vi (khoaList).
   - Thêm / sửa / xóa mục danh mục (cây bên trái): chỉ tài khoản phạm vi Toàn Học viện (quanTri).
   Bản demo lọc sẵn LMS.db theo phạm vi; hệ thống thật phải lọc ở API trả danh sách chương trình
   và chặn ở API sửa/xóa nếu chương trình ngoài phạm vi. */
var U = LMS.ui, esc = U.esc, app = document.getElementById('app');
var st = { sel: null, tab: 'lo-trinh', lq: '', flash: null };
function D(){ return LMS.db; }
function all(){ return D().chuongTrinh; }
function kids(id){ return all().filter(function(c){ return (c.cha || null) === (id || null); }); }
function subtree(id){ var out = [id]; kids(id).forEach(function(k){ out = out.concat(subtree(k.id)); }); return out; }
function roots(){ return kids(null); }
function mons(id){ return subtree(id).map(function(i){ return LMS.byId('chuongTrinh', i); }).filter(function(c){ return c && c.loai === 'hoc-phan'; }); }
function hpCua(m){ return m.hocPhan.length ? LMS.byId('hocPhan', m.hocPhan[0]) : null; }
function tt(m){ var hp = hpCua(m); return !hp ? 'chua' : hp.trangThai === 'hoat-dong' ? 'ok' : hp.trangThai === 'nhap' ? 'nhap' : 'ngung'; }
var TT = { ok: ['Sẵn sàng mở lớp', 'ok'], nhap: ['Đang biên soạn', 'warn'], chua: ['Chưa có nội dung', ''], ngung: ['Nội dung ngưng dùng', 'bad'] };
function khoaNhom(g){ return (g.khoaDs && g.khoaDs.length ? g.khoaDs : g.khoa ? [g.khoa] : []).filter(function(id){ return LMS.byId('donVi', id); }); }
function khoaNhomTen(g){ return khoaNhom(g).map(function(id){ return LMS.donViTen(id); }).join(', '); }
function khoaList(){ return D().donVi.filter(function(d){ return d.laKhoa && LMS.trongPhamVi(d.id); }); }
function lopCua(id){ var ids = subtree(id); return D().lop.filter(function(l){ return ids.indexOf(l.chuongTrinh) >= 0; }); }
function dangMo(ls){ return ls.filter(function(l){ return l.trangThai === 'dang-hoc' || l.trangThai === 'tuyen-sinh'; }); }
function hvCua(ls){ var m = {}, hv = {}; ls.forEach(function(l){ m[l.id] = 1; }); D().ghiDanh.forEach(function(g){ if (g.trangThai === 'dang-hoc' && m[g.lop]) hv[g.hv] = 1; }); return Object.keys(hv).length; }
function hocLieu(ms){ var bai = 0, phut = 0; ms.forEach(function(m){ var hp = hpCua(m); if (hp) hp.bai.forEach(function(b){ if (b.xuatBan !== false) { bai++; phut += b.phut || 0; } }); }); return { bai: bai, gio: Math.round(phut / 60) }; }
/* ---- danh mục chương trình (hệ đào tạo) ---- */
var FO = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
var DONG = (function(){ try { return JSON.parse(localStorage.getItem('egoLmsDemo.ctHe') || '{}'); } catch (e) { return {}; } })();
function luuDong(){ try { localStorage.setItem('egoLmsDemo.ctHe', JSON.stringify(DONG)); } catch (e) {} }
function hes(){ return D().heDaoTao || (D().heDaoTao = []); }
function heById(id){ return hes().filter(function(h){ return h.id === id; })[0] || null; }
function heKids(id){ return hes().filter(function(h){ return (h.cha || null) === (id || null); }); }
function heSub(id){ var o = [id]; heKids(id).forEach(function(k){ o = o.concat(heSub(k.id)); }); return o; }
function heOf(c){ return c.he && heById(c.he) ? c.he : null; }
function hePath(id){ var p = [], h = heById(id), g = 0; while (h && g++ < 20) { p.unshift(h.ten); h = h.cha ? heById(h.cha) : null; } return p.join(' › '); }
/* chọn mục dạng cây mở sẵn: name = tên trường, val = mục đang chọn, cam = các mục không được chọn, goc = nhãn lựa chọn gốc */
function heTree(name, val, cam, goc, ghiChu){
  var k = 'tp_' + name, h = '<input type="hidden" name="' + name + '" value="' + esc(val || '') + '"><div class="he-pick" role="radiogroup">';
  function dong(id, ten, d, khoa, ln){ var on = (val || '') === id; return '<label class="hp-o' + (on ? ' on' : '') + (khoa ? ' dis' : '') + '" style="padding-left:' + (12 + d * 22) + 'px"><input type="radio" name="' + k + '" value="' + esc(id) + '"' + (on ? ' checked' : '') + (khoa ? ' disabled' : '') + '>' + (id ? '<span class="fo">' + FO + '</span>' : '') + '<span class="nm">' + esc(ten) + '</span>' + (ln ? '<span class="ln">' + esc(ln) + '</span>' : '') + '</label>'; }
  h += dong('', goc, 0, false, '');
  (function walk(pid, d, khoaCha){ heKids(pid).forEach(function(x){ var khoa = khoaCha || cam.indexOf(x.id) >= 0; h += dong(x.id, x.ten, d, khoa, khoa && ghiChu ? (cam[0] === x.id ? ghiChu[0] : ghiChu[1]) : ''); walk(x.id, d + 1, khoa); }); })(null, 1, false);
  return h + '</div>';
}
function ganTree(body){ body.querySelectorAll('.he-pick').forEach(function(t){ var hid = t.previousElementSibling; t.onchange = function(e){ if (!e.target.matches('input[type=radio]')) return; hid.value = e.target.value; t.querySelectorAll('.hp-o').forEach(function(l){ l.classList.toggle('on', l.querySelector('input').checked); }); }; }); }
function quanTri(){ return LMS.phamVi.all; }
function suaDuoc(c){ return LMS.phamVi.all || !!LMS.phamVi.ids[c.khoa]; }
function cur(){ var c = LMS.byId('chuongTrinh', st.sel); if (!c || c.cha) { c = roots()[0] || null; st.sel = c ? c.id : null; } return c; }
var NHOM = (function(){ try { return JSON.parse(localStorage.getItem('egoLmsDemo.ctNhom') || '{}'); } catch (e) { return {}; } })();
function luuNhom(){ try { localStorage.setItem('egoLmsDemo.ctNhom', JSON.stringify(NHOM)); } catch (e) {} }
function chuyenNhom(g, dich, sau){
  if (!g || !dich || g === dich) return;
  var a = all(); a.splice(a.indexOf(g), 1);
  var y = a.indexOf(dich); a.splice(sau ? y + 1 : y, 0, g);
  st.flashG = g.id;
  LMS.commit('Sắp xếp', 'Chương trình đào tạo', cur().ma + ' · đổi thứ tự nhóm ' + g.ten);
  veChiTiet();
}
function doiCho(n, d){ var sib = kids(n.cha), i = sib.indexOf(n), o = sib[i + d]; if (!o) return; var a = all(), x = a.indexOf(n), y = a.indexOf(o); a[x] = o; a[y] = n; if (n.loai === 'nhom') st.flashG = n.id; LMS.commit(null); veChiTiet(); }

function render(){
  
  app.innerHTML = '<div class="page-head"><div><h1>Chương trình đào tạo</h1></div><div class="actions"><button class="btn primary" id="btnAdd">+ Thêm chương trình</button></div><div class="sub ct-sub">Khung đầy đủ của ngành (tín chỉ, học kỳ, học phần thực hành, chuẩn đầu ra) quản lý ở hệ thống Quản lý đào tạo. Màn này chỉ khai báo các học phần lý thuyết tổ chức học trực tuyến.</div></div><div class="ct-lay"><aside class="ct-rail" id="rail"></aside><section id="detail" class="stack" style="gap:14px;min-width:0"></section></div>';
  document.getElementById('btnAdd').onclick = function(){ formCT(null); };
  veRail(); veChiTiet();
}
function veRail(){
  var rail = document.getElementById('rail'), nq = U.norm(st.lq), loc = !!nq;
  var ds = roots().filter(function(c){ return !nq || U.norm(c.ma + ' ' + c.ten).indexOf(nq) >= 0; });
  function progs(heId){ return ds.filter(function(c){ return heOf(c) === heId; }); }
  function dem(heId){ return heSub(heId).reduce(function(n, id){ return n + progs(id).length; }, 0); }
  var h = '<div class="rail-h"><b>Danh mục chương trình</b>' + (quanTri() ? '<button class="btn sm" id="heAdd" title="Thêm mục cấp gốc">+ Mục</button>' : '') + '</div><div class="rail-q"><input class="inp" id="lq" placeholder="Tìm chương trình" value="' + esc(st.lq) + '"></div><div class="ct-tree" id="tree">';
  function pgRow(c, d){
    return '<div class="pg' + (c.id === st.sel ? ' on' : '') + (c.trangThai === 'ngung' ? ' ngung' : '') + '" data-ct="' + c.id + '"' + (suaDuoc(c) && !loc ? ' draggable="true"' : '') + ' style="padding-left:' + (10 + d * 16) + 'px" title="' + esc(c.ten + (c.trangThai === 'ngung' ? ' · Ngưng dùng' : '')) + '"><span class="dt"></span><span class="tx"><b>' + U.hl(c.ten, st.lq) + '</b></span></div>'; }
  function heRow(he, d){
    var n = dem(he.id); if ((loc || !quanTri()) && !n) return '';
    var mo = loc || !DONG[he.id], r = '<div class="he" data-he="' + he.id + '" style="padding-left:' + (8 + d * 16) + 'px" title="' + (loc ? '' : mo ? 'Bấm để thu gọn' : 'Bấm để mở') + '"><span class="tw' + (mo ? '' : ' dong') + '">▾</span><span class="fo">' + FO + '</span><span class="nm" title="' + esc(he.ten) + '">' + esc(he.ten) + '</span><span class="cnt">' + n + '</span>' + (quanTri() ? '<button class="mo" data-mhe="' + he.id + '" aria-label="Thao tác mục ' + esc(he.ten) + '">⋯</button>' : '') + '</div>';
    if (!mo) return r;
    r += '<div class="he-body" style="--gl:' + (16 + d * 16) + 'px">';
    heKids(he.id).forEach(function(k){ r += heRow(k, d + 1); });
    var ps = progs(he.id); ps.forEach(function(c){ r += pgRow(c, d + 1); });
    if (!ps.length && !heKids(he.id).length && !loc) r += '<div class="pg-empty" data-hedrop="' + he.id + '" style="margin-left:' + (10 + (d + 1) * 16) + 'px">Chưa có chương trình · kéo chương trình vào đây</div>';
    return r + '</div>';
  }
  heKids(null).forEach(function(he){ h += heRow(he, 0); });
  var khong = progs(null);
  if (khong.length || !loc) { h += '<div class="he unc" data-he=""><span class="tw' + (loc || !DONG.__k ? '' : ' dong') + '">▾</span><span class="fo" style="color:var(--ems-faint)">' + FO + '</span><span class="nm">Chưa phân loại</span><span class="cnt">' + khong.length + '</span></div>'; if (loc || !DONG.__k) { h += '<div class="he-body" style="--gl:16px">'; khong.forEach(function(c){ h += pgRow(c, 1); }); h += '</div>'; } }
  if (!ds.length) h += '<div class="empty">Không có chương trình phù hợp</div>';
  h += '</div>';
  rail.innerHTML = h;
  var lq = document.getElementById('lq'); lq.oninput = function(){ st.lq = lq.value.trim(); var p = lq.selectionStart; veRail(); var n = document.getElementById('lq'); n.focus(); try { n.setSelectionRange(p, p); } catch (e) {} };

  U.modal({ title: moi ? 'Thêm chương trình' : 'Sửa chương trình · ' + c.ma, body: '<div class="form-grid"><div class="field"><label>Mã chương trình <span class="req">*</span></label><input class="inp" name="ma" maxlength="20" value="' + esc(c ? c.ma : '') + '"></div><div class="field"><label>Khoa chủ quản <span class="req">*</span></label><select class="sel" name="khoa">' + U.opts(khoaList(), 'id', 'ten', c ? c.khoa : '', '— Chọn khoa —') + '</select></div><div class="field full"><label>Tên chương trình <span class="req">*</span></label><input class="inp" name="ten" maxlength="200" value="' + esc(c ? c.ten : '') + '"></div><div class="field full"><label>Thuộc mục</label>' + heTree('he', c ? heOf(c) || '' : (heMacDinh !== undefined ? heMacDinh || '' : (cur() ? heOf(cur()) || '' : '')), [], 'Chưa phân loại') + '<div class="hint">Mục trong danh mục chương trình bên trái, ví dụ Đào tạo đại học, Đào tạo sau đại học.</div></div><div class="field full"><label>Giới thiệu ngắn</label><textarea name="moTa" rows="3">' + esc(c ? c.moTa || '' : '') + '</textarea><div class="hint">Hiển thị ở mục Lộ trình đào tạo trên Cổng học viên</div></div><div class="field full"><label>Đối tượng học</label><input class="inp" name="doiTuong" value="' + esc(c ? c.doiTuong || '' : '') + '"></div><div class="field"><label>Mã chương trình bên Quản lý đào tạo</label><input class="inp mono" name="maQLDT" maxlength="20" value="' + esc(c ? c.maQLDT || '' : '') + '"><div class="hint">Dùng để đối chiếu, đồng bộ kết quả học tập</div></div><div class="field"><label>Trạng thái</label><select class="sel" name="trangThai">' + U.opts([{ v: 'hoat-dong', l: 'Đang dùng' }, { v: 'ngung', l: 'Ngưng dùng' }], 'v', 'l', c ? c.trangThai : 'hoat-dong') + '</select></div></div>', onOpen: function(api){ ganTree(api.body); }, foot: [{ label: 'Hủy', close: true }, { label: moi ? 'Thêm' : 'Lưu', cls: 'primary', onClick: function(a){
    var v = U.formVals(a.body), ok = true;
    function loi(n, m){ U.fieldErr(a.body, n, m); if (m) ok = false; }
    loi('ma', !v.ma ? 'Nhập mã chương trình' : !/^[A-Za-z0-9_.\-]+$/.test(v.ma) ? 'Mã chỉ gồm chữ không dấu, số, _ . -' : maTrung(v.ma, c && c.id, roots()) ? 'Mã đã tồn tại' : '');
    loi('ten', v.ten ? '' : 'Nhập tên chương trình');
    loi('khoa', v.khoa ? '' : 'Chọn khoa chủ quản');
    if (!ok) return false;
    var o = { he: v.he || null, ma: v.ma, ten: v.ten, khoa: v.khoa, moTa: v.moTa, doiTuong: v.doiTuong, maQLDT: v.maQLDT, trangThai: v.trangThai, congKhai: true };
    if (moi) { var n = { id: LMS.nextId('ct'), cha: null, loai: 'chuong-trinh', hocPhan: [] }; for (var k in o) n[k] = o[k]; all().push(n); if (n.he) { DONG[n.he] = false; luuDong(); } st.sel = n.id; st.tab = 'lo-trinh'; LMS.commit('Tạo', 'Chương trình đào tạo', n.ma + ' · ' + n.ten, null, { ma: n.ma, ten: n.ten }); U.toast('Đã thêm chương trình ' + n.ma, 'ok'); }
    else { var truoc = { ma: c.ma, ten: c.ten, trangThai: c.trangThai }; for (var k2 in o) c[k2] = o[k2]; LMS.commit('Sửa', 'Chương trình đào tạo', c.ma + ' · ' + c.ten, truoc, { ma: c.ma, ten: c.ten, trangThai: c.trangThai }); U.toast('Đã lưu thay đổi', 'ok'); }
    render();
  } }] });
}
function formNhom(g, c){
  var moi = !g, chon = g ? khoaNhom(g) : (c.khoa ? [c.khoa] : []), ms = null;
  U.modal({ title: moi ? 'Thêm nhóm học phần' : 'Sửa nhóm học phần', body: '<div class="field"><label>Tên nhóm <span class="req">*</span></label><input class="inp" name="ten" maxlength="120" value="' + esc(g ? g.ten : '') + '" placeholder="VD: Năm thứ nhất, Châm cứu"></div><div class="field"><label>Khoa phụ trách <span class="req">*</span></label><div data-khoa></div><div class="hint">Chọn một hoặc nhiều khoa. Bấm × trên tên khoa để bỏ.</div></div>',
    onOpen: function(api){ ms = U.multiSelect(api.body.querySelector('[data-khoa]'), { options: khoaList().map(function(k){ return { id: k.id, label: k.ten }; }), value: chon, placeholder: 'Chọn khoa phụ trách', empty: 'Chưa có khoa trong danh mục đơn vị' }); },
    foot: [{ label: 'Hủy', close: true }, { label: moi ? 'Thêm' : 'Lưu', cls: 'primary', onClick: function(a){
    var v = U.formVals(a.body), ks = ms ? ms.get() : chon, ok = true; v.ten = String(v.ten || '').trim().replace(/\s+/g, ' ');
    if (!v.ten) { U.fieldErr(a.body, 'ten', 'Nhập tên nhóm'); ok = false; }
    else if (kids(c.id).some(function(x){ return x !== g && U.norm(x.ten) === U.norm(v.ten); })) { U.fieldErr(a.body, 'ten', 'Chương trình đã có nhóm này'); ok = false; }
    if (!ks.length) { U.toast('Chọn ít nhất một khoa phụ trách', 'bad'); ok = false; }
    if (!ok) return false;
    if (moi) all().push({ id: LMS.nextId('ct'), ma: 'N' + (kids(c.id).length + 1), ten: v.ten, cha: c.id, khoa: ks[0], khoaDs: ks, hocPhan: [], trangThai: 'hoat-dong', loai: 'nhom' }); else { g.ten = v.ten; g.khoa = ks[0]; g.khoaDs = ks; }
    LMS.commit(moi ? 'Tạo' : 'Sửa', 'Chương trình đào tạo', c.ma + ' · nhóm ' + v.ten); U.toast('Đã lưu nhóm ' + v.ten, 'ok'); veChiTiet();
  } }] });
}
function hpTrongCT(c, boQua){ var m = {}; mons(c.id).forEach(function(x){ if (x !== boQua && x.hocPhan[0]) m[x.hocPhan[0]] = x; }); return m; }
function dongHP(h, q, extra){ return '<div class="grow"><div><span class="mono">' + U.hl(h.ma, q) + '</span> · <b>' + U.hl(h.ten, q) + '</b> ' + (h.trangThai === 'nhap' ? U.badge('Đang biên soạn', 'warn') : '') + '</div><div class="small muted">' + esc(LMS.donViTen(h.khoa)) + ' · ' + h.bai.length + ' bài giảng' + (extra || '') + '</div></div>'; }
function themHP(g){
  var c = cur(), da = hpTrongCT(c), sel = {}, q = '';
  U.modal({ title: 'Thêm học phần vào nhóm ' + g.ten, size: 'lg', body: '<div class="note info">Chọn học phần đã biên soạn ở màn Học phần. Học phần chưa biên soạn thêm dưới dạng dự kiến để theo dõi kế hoạch làm học liệu.</div><input class="inp" data-q placeholder="Tìm học phần theo mã, tên" style="margin:10px 0"><div class="pick-list" data-list></div><div class="field" style="margin-top:12px"><label>Hoặc thêm học phần dự kiến (chưa có nội dung)</label><input class="inp" name="duKien" maxlength="150" placeholder="Tên học phần, VD: Xoa bóp bấm huyệt (lý thuyết)"></div>',
    onOpen: function(api){
      var list = api.body.querySelector('[data-list]');
      function draw(){ var hps = D().hocPhan.filter(function(h){ return h.trangThai !== 'ngung' && !da[h.id] && (!q || U.norm(h.ma + ' ' + h.ten).indexOf(U.norm(q)) >= 0); });
        list.innerHTML = hps.length ? hps.map(function(h){ var khac = all().filter(function(x){ return x.hocPhan.indexOf(h.id) >= 0; }).map(function(x){ return (LMS.ctGoc(x.id) || {}).ma; }); return '<label class="pick-item"><input type="checkbox" data-id="' + h.id + '"' + (sel[h.id] ? ' checked' : '') + '>' + dongHP(h, q, khac.length ? ' · đang dùng ở ' + esc(khac.join(', ')) : '') + '</label>'; }).join('') : '<div class="empty">Mọi học phần đã biên soạn đều có trong chương trình này</div>';
        list.querySelectorAll('[data-id]').forEach(function(cb){ cb.onchange = function(){ if (cb.checked) sel[cb.dataset.id] = 1; else delete sel[cb.dataset.id]; }; }); }
      api.body.querySelector('[data-q]').oninput = function(e){ q = e.target.value.trim(); draw(); }; draw();
    },
    foot: [{ label: 'Hủy', close: true }, { label: 'Thêm vào chương trình', cls: 'primary', onClick: function(a){
      var ids = Object.keys(sel), dk = U.formVals(a.body).duKien;
      if (!ids.length && !dk) { U.toast('Chọn học phần hoặc nhập tên học phần dự kiến', 'bad'); return false; }
      if (dk && mons(c.id).some(function(x){ return U.norm(x.ten) === U.norm(dk); })) { U.fieldErr(a.body, 'duKien', 'Chương trình đã có học phần này'); return false; }
      ids.forEach(function(id){ var hp = LMS.byId('hocPhan', id); all().push({ id: LMS.nextId('ct'), ma: hp.ma, ten: hp.ten, cha: g.id, khoa: hp.khoa, hocPhan: [id], trangThai: 'hoat-dong', loai: 'hoc-phan', hocSau: [] }); });
      if (dk) all().push({ id: LMS.nextId('ct'), ma: 'DK' + (mons(c.id).length + 1), ten: dk, cha: g.id, khoa: g.khoa, hocPhan: [], trangThai: 'hoat-dong', loai: 'hoc-phan', hocSau: [] });
      LMS.commit('Gắn học phần', 'Chương trình đào tạo', c.ma + ' · ' + g.ten + ' · thêm ' + (ids.length + (dk ? 1 : 0)) + ' học phần'); U.toast('Đã thêm ' + (ids.length + (dk ? 1 : 0)) + ' học phần vào ' + g.ten, 'ok'); veRail(); veChiTiet();
    } }] });
}
function ganHP(m){
  var c = cur(), da = hpTrongCT(c, m), chon = m.hocPhan[0] || '', q = '';
  U.modal({ title: 'Đổi học phần · ' + m.ten, body: '<input class="inp" data-q placeholder="Tìm học phần theo mã, tên" style="margin-bottom:10px"><div class="pick-list" data-list></div>',
    onOpen: function(api){
      var list = api.body.querySelector('[data-list]');
      function draw(){ var hps = D().hocPhan.filter(function(h){ return (h.trangThai !== 'ngung' || h.id === chon) && !da[h.id] && (!q || U.norm(h.ma + ' ' + h.ten).indexOf(U.norm(q)) >= 0); });
        list.innerHTML = '<label class="pick-item"><input type="radio" name="hp" value=""' + (chon ? '' : ' checked') + '><div><b>Chưa gắn</b><div class="small muted">Giữ là học phần dự kiến</div></div></label>' + hps.map(function(h){ return '<label class="pick-item"><input type="radio" name="hp" value="' + h.id + '"' + (chon === h.id ? ' checked' : '') + '>' + dongHP(h, q) + '</label>'; }).join('');
        list.querySelectorAll('[name=hp]').forEach(function(r){ r.onchange = function(){ chon = r.value; }; }); }
      api.body.querySelector('[data-q]').oninput = function(e){ q = e.target.value.trim(); draw(); }; draw();
    },
    foot: [{ label: 'Hủy', close: true }, { label: 'Lưu', cls: 'primary', onClick: function(){
      var cu = m.hocPhan[0] || ''; if (cu === chon) return;
      if (cu) { var refs = D().lop.filter(function(l){ return l.chuongTrinh === m.id && l.hocPhan === cu && l.trangThai !== 'ket-thuc' && l.trangThai !== 'huy'; }).map(function(l){ return 'Lớp ' + l.ma + ' · ' + l.ten; }); if (refs.length) { U.blocked('Không thể đổi nội dung', refs, 'Học phần đang có lớp mở theo nội dung hiện tại.'); return false; } }
      var hp = chon ? LMS.byId('hocPhan', chon) : null; m.hocPhan = chon ? [chon] : []; if (hp) { m.ten = hp.ten; m.ma = hp.ma; }
      LMS.commit('Gắn học phần', 'Chương trình đào tạo', c.ma + ' · ' + m.ten + (hp ? ' → ' + hp.ma : ' · bỏ gắn'), { hocPhan: cu }, { hocPhan: chon });
      U.toast(hp ? 'Đã gắn nội dung ' + hp.ma : 'Đã bỏ gắn nội dung', 'ok'); st.flash = m.id; veRail(); veChiTiet();
    } }] });
}
function hocTruoc(m){
  var c = cur(), ds = mons(c.id).filter(function(x){ return x !== m; }), sel = {}; (m.hocSau || []).forEach(function(i){ sel[i] = 1; });
  function phuThuoc(x, dich, seen){ seen = seen || {}; if (!x || seen[x.id]) return false; seen[x.id] = 1; return (x.hocSau || []).some(function(i){ return i === dich || phuThuoc(LMS.byId('chuongTrinh', i), dich, seen); }); }
  U.modal({ title: 'Học phần tiên quyết · ' + m.ten, body: '<div class="small muted" style="margin-bottom:8px">Học viên cần hoàn thành các học phần tiên quyết đã chọn trước khi đăng ký ' + esc(m.ten) + '.</div><div class="pick-list">' + ds.map(function(x){ var vong = phuThuoc(x, m.id); return '<label class="pick-item"><input type="checkbox" data-id="' + x.id + '"' + (sel[x.id] ? ' checked' : '') + (vong ? ' disabled' : '') + '><div><b>' + esc(x.ten) + '</b><div class="small muted">' + esc(LMS.byId('chuongTrinh', x.cha).ten) + (vong ? ' · đang nhận ' + esc(m.ten) + ' làm tiên quyết' : '') + '</div></div></label>'; }).join('') + '</div>', foot: [{ label: 'Hủy', close: true }, { label: 'Lưu', cls: 'primary', onClick: function(a){ m.hocSau = [].slice.call(a.body.querySelectorAll('[data-id]:checked')).map(function(x){ return x.dataset.id; }); LMS.commit('Sửa', 'Chương trình đào tạo', c.ma + ' · ' + m.ten + ' · học phần tiên quyết'); U.toast('Đã lưu học phần tiên quyết', 'ok'); st.flash = m.id; veChiTiet(); } }] });
}
function toggleTT(c){
  var ngung = c.trangThai !== 'ngung', n = dangMo(lopCua(c.id)).length;
  U.confirm({ title: ngung ? 'Ngưng dùng chương trình' : 'Kích hoạt chương trình', html: ngung ? 'Ngưng dùng <b>' + esc(c.ten) + '</b>? Chương trình không còn được chọn khi mở lớp mới.' + (n ? '<div class="note warn" style="margin-top:10px">' + n + ' lớp đang học/tuyển sinh vẫn tiếp tục bình thường.</div>' : '') : 'Kích hoạt lại <b>' + esc(c.ten) + '</b>?', ok: ngung ? 'Ngưng dùng' : 'Kích hoạt', danger: ngung }).then(function(y){
    if (!y) return; var t = c.trangThai; c.trangThai = ngung ? 'ngung' : 'hoat-dong';
    LMS.commit(ngung ? 'Ngưng dùng' : 'Kích hoạt', 'Chương trình đào tạo', c.ma + ' · ' + c.ten, { trangThai: t }, { trangThai: c.trangThai }); U.toast(ngung ? 'Đã ngưng dùng ' + c.ma : 'Đã kích hoạt ' + c.ma, 'ok'); render();
  });
}
function xoa(n){
  var ids = subtree(n.id), refs = [], l = n.loai;
  D().lop.forEach(function(x){ if (ids.indexOf(x.chuongTrinh) >= 0) refs.push('Lớp ' + x.ma + ' · ' + x.ten); });
  if (refs.length) { U.blocked('Không thể ' + (l === 'hoc-phan' ? 'gỡ ' : 'xóa ') + n.ten, refs.slice(0, 12), l === 'chuong-trinh' ? 'Dùng thao tác Ngưng dùng để giữ lịch sử đào tạo.' : 'Học phần đã mở lớp theo chương trình này nên phải giữ lại.'); return; }
  var ten = { 'chuong-trinh': 'chương trình', nhom: 'nhóm', 'hoc-phan': 'học phần' }[l] || 'mục';
  U.confirm({ title: (l === 'hoc-phan' ? 'Gỡ ' : 'Xóa ') + ten, html: (l === 'hoc-phan' ? 'Gỡ <b>' + esc(n.ten) + '</b> khỏi chương trình? Bài giảng của học phần không bị xóa.' : 'Xóa ' + ten + ' <b>' + esc(n.ten) + '</b>' + (ids.length > 1 ? ' cùng ' + (ids.length - 1) + ' mục bên trong' : '') + '?'), ok: l === 'hoc-phan' ? 'Gỡ' : 'Xóa', danger: true }).then(function(y){
    if (!y) return; D().chuongTrinh = all().filter(function(x){ return ids.indexOf(x.id) < 0; });
    all().forEach(function(x){ if (x.hocSau) x.hocSau = x.hocSau.filter(function(i){ return ids.indexOf(i) < 0; }); });
    LMS.commit('Xóa', 'Chương trình đào tạo', (l === 'chuong-trinh' ? '' : cur().ma + ' · ') + ten + ' ' + n.ten, { ma: n.ma, ten: n.ten }, null);
    U.toast('Đã ' + (l === 'hoc-phan' ? 'gỡ ' : 'xóa ') + n.ten, 'ok'); if (l === 'chuong-trinh') st.sel = null; render();
  });
}

var p = LMS.param('chuong-trinh.html');
if (p && p.chuongTrinh) { var g = LMS.ctGoc(p.chuongTrinh); if (g) { st.sel = g.id; if (g.id !== p.chuongTrinh) st.flash = p.chuongTrinh; } }
LMS.onChange(render);
render();
})();
</script>
</body></html>
