<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bài tập & giao bài · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edot.css">
<style>
.role{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ems-muted)}
.role .sel{font-size:13px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ems-muted)}
.steps span i{width:20px;height:20px;border-radius:50%;border:1px solid var(--ems-border-strong);display:inline-grid;place-items:center;font-style:normal;font-size:11px}
.steps span.on{color:var(--ems-navy)} .steps span.on i{background:var(--ems-navy);border-color:var(--ems-navy);color:#fff}
.steps span.done i{background:var(--ems-success);border-color:var(--ems-success);color:#fff}
.steps b{color:var(--ems-border-strong);font-weight:400}
.picklist{border:1px solid var(--ems-border);border-radius:8px;max-height:300px;overflow:auto}
.picklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--ems-border);cursor:pointer;font-size:13px}
.picklist label:last-child{border-bottom:0}
.picklist label:hover{background:var(--ems-surface-2)}
.picklist label.dis{opacity:.5;cursor:not-allowed}
.picklist .meta{font-size:12px;color:var(--ems-muted)}
.rub{display:grid;grid-template-columns:1fr 90px 32px;gap:6px;align-items:center}
.head-card{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.head-card .meta{color:var(--ems-muted);font-size:13px;margin-top:4px}
.stat-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--ems-border)}
.stat-strip div{padding:12px 16px;border-right:1px solid var(--ems-border)}
.stat-strip div:last-child{border-right:0}
.stat-strip b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.stat-strip span{font-size:12px;color:var(--ems-muted)}
@media (max-width:900px){.stat-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
.qa{border:1px solid var(--ems-border);border-radius:8px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.qa .ok{color:var(--ems-success);font-weight:700} .qa .no{color:var(--ems-danger);font-weight:700}
.answer{background:var(--ems-surface-2);border:1px solid var(--ems-border);border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap}
.score-inp{width:72px;text-align:right;padding:5px 6px}
.calc{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:13px;padding:10px 12px;border:1px solid var(--ems-navy-line);background:var(--ems-navy-soft);border-radius:8px}
.calc b.total{font-size:20px;color:var(--ems-navy)}
.col-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.col-pick label{border:1px solid var(--ems-border-strong);border-radius:8px;padding:10px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;font-size:13px}
.col-pick label.on{border-color:var(--ems-navy);box-shadow:0 0 0 3px var(--ems-focus)}
.col-pick label.dis{opacity:.55;cursor:not-allowed}
.hint-q{border:0;background:transparent;color:var(--ems-navy);cursor:pointer;font:600 12px var(--font);padding:0}
</style>
</head><body>
<div class="page" id="app"></div>
<script src="lms-core.js"></script>
<script>
(function(){ 'use strict';
var U = LMS.ui, esc = U.esc;
var ACT='egoLmsDemo.actAs';
var LOAI = { 'trac-nghiem':'Trắc nghiệm', 'tu-luan':'Tự luận', 'nop-tep':'Nộp tệp', 'ket-hop':'Trắc nghiệm + tự luận' };
var DK = { De:'Dễ', TrungBinh:'Trung bình', Kho:'Khó' };
var st = { view:'list', bt:null, tab:'nop', q:'', lop:'', tt:'', loai:'', nopF:'all' };

var p = LMS.param('bai-tap.html');
if(p && p.bt){ st.view='detail'; st.bt=p.bt; }
if(p && p.lop){ st.lop=p.lop; (function(){ var L=LMS.byId('lop',p.lop); if(L && L.giangVien.length && L.giangVien.indexOf(actor())<0 && !(p.xem)){ setActor(L.giangVien[0]); } })(); }

function db(){ return LMS.db; }
function actor(){ var a=null; try{ a=localStorage.getItem(ACT); }catch(e){} if(!a) a='gv2'; return a; }
function setActor(a){ try{ localStorage.setItem(ACT,a); }catch(e){} }
function isAdmin(){ return actor()==='admin'; }
function gvCur(){ return isAdmin()?null:LMS.byId('giangVien',actor()); }
function canManage(lop){ return !isAdmin() && lop && lop.giangVien.indexOf(actor())>=0; }
function myLops(){ return db().lop.filter(function(l){ return isAdmin() || l.giangVien.indexOf(actor())>=0; }); }
function openLops(){ return myLops().filter(function(l){ return l.trangThai==='dang-hoc' || l.trangThai==='tuyen-sinh'; }); }
function visibleBT(){ var ids=myLops().map(function(l){return l.id;}); return db().baiTap.filter(function(b){ return ids.indexOf(b.lop)>=0; }); }
function hp(bt){ return LMS.byId('hocPhan',bt.hocPhan); }
function baiIdx(h,id){ return h.bai.findIndex(function(b){ return b.id===id; })+1; }
function phamViText(bt){ var h=hp(bt); if(bt.phamVi.loai==='hoc-phan') return 'Cả học phần '+h.ten; var ix=bt.phamVi.bai.map(function(id){ return baiIdx(h,id); }).sort(function(a,b){return a-b;}); if(ix.length===1){ var b=h.bai[ix[0]-1]; return b?b.ten:'—'; } var cont = ix.every(function(v,i){ return !i || v===ix[i-1]+1; }); return (cont?'Bài '+ix[0]+'–'+ix[ix.length-1]:'Bài '+ix.join(', '))+' · '+h.ten; }
function nextMa(){ var n=0; db().baiTap.forEach(function(b){ var m=+String(b.ma).replace(/\D/g,''); if(m>n) n=m; }); return 'BT'+String(n+1).padStart(3,'0'); }
function roleNote(){ return isAdmin() ? '<div class="note info">Đang xem với vai trò quản trị: xem được toàn bộ bài tập, không giao và không chấm. Chỉ giảng viên phụ trách lớp mới giao bài và chấm điểm cho lớp đó.</div>' : ''; }
function dtLocal(d){ d=new Date(d); var z=function(n){return (n<10?'0':'')+n;}; return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes()); }
function lateDays(bt,n){ return Math.max(0, Math.ceil((new Date(n.nopLuc)-new Date(bt.hanNop))/86400000)); }
function calcScore(bt, diemTN, diemTL, tru){ var t = (diemTN||0)*bt.tyLe.tn/100 + (diemTL||0)*bt.tyLe.tl/100; return Math.max(0, Math.round(t*(1-(tru||0)/100)*10)/10); }

/* =================== DANH SÁCH =================== */
var tbl;
function renderList(){
  var d=db(), list=visibleBT(), now=Date.now(), t0=new Date(); t0.setHours(0,0,0,0); var lim3=t0.getTime()+4*86400000;
  var mo = list.filter(function(b){ var s=LMS.btStatus(b).key; return s==='mo'||s==='muon'; }).length;
  var sap = list.filter(function(b){ var h=new Date(b.hanNop).getTime(); return b.trangThai==='da-giao' && h>=now && h<lim3; }).length;
  var cho = list.reduce(function(a,b){ return a+LMS.btStats(b).choCham; },0);
  var chuaCD = list.filter(function(b){ var s=LMS.btStats(b); return b.trangThai!=='nhap' && !b.chuyenDiem && s.daCham>0; }).length;
  var g=gvCur();
  var h = '<div class="page-head"><div><h1>Bài tập & giao bài</h1><div class="sub">'+list.length+' bài tập · giao theo bài giảng của lớp, chấm và chuyển điểm vào bảng điểm lớp</div></div><div class="actions"><div class="role"><label for="actAs">Thao tác với vai trò</label><select class="sel" id="actAs">'+U.opts([{id:'admin',t:'Quản trị (chỉ xem)'}].concat(d.giangVien.map(function(x){ return {id:x.id,t:'GV · '+x.hoTen}; })),'id','t',actor())+'</select></div><button class="btn primary" id="btnNew"'+(isAdmin()||!openLops().length?' disabled title="Chỉ giảng viên phụ trách lớp đang mở được giao bài"':'')+'>+ Giao bài tập</button></div></div>';
  h += roleNote();
  if(g) h += '<div class="muted small">'+esc(g.hoTen)+' phụ trách: '+(myLops().map(function(l){ return '<span class="tag">'+esc(l.ma)+'</span>'; }).join('')||'chưa có lớp')+'</div>';
  h += '<div class="kpis">'+
    '<div class="kpi clickable '+(st.tt==='mo'?'active':'')+'" data-k="mo"><div class="k-label">Đang nhận bài</div><div class="k-val">'+mo+'</div><div class="k-sub">gồm cả thời gian nộp muộn</div></div>'+
    '<div class="kpi '+(sap?'warn':'')+'"><div class="k-label">Đến hạn trong 3 ngày</div><div class="k-val">'+sap+'</div><div class="k-sub">'+(sap?'▲ nhắc học viên chưa nộp':'không có')+'</div></div>'+
    '<div class="kpi clickable '+(cho?'warn ':'')+(st.tt==='cham'?'active':'')+'" data-k="cham"><div class="k-label">Bài nộp chờ chấm</div><div class="k-val">'+cho+'</div><div class="k-sub">'+(cho?'▲ phần tự luận / tệp nộp':'đã chấm hết')+'</div></div>'+
    '<div class="kpi clickable '+(chuaCD?'warn ':'')+(st.tt==='cd'?'active':'')+'" data-k="cd"><div class="k-label">Có điểm, chưa chuyển vào lớp</div><div class="k-val">'+chuaCD+'</div><div class="k-sub">'+(chuaCD?'▲ chọn cột điểm để chuyển':'đã chuyển đủ')+'</div></div></div>';
  h += '<div class="panel"><div class="panel-head filters"><input class="inp" id="q" placeholder="Tìm theo mã, tên bài tập, bài giảng…" value="'+esc(st.q)+'" aria-label="Tìm bài tập">'+
    '<select class="sel" id="fLop" aria-label="Lớp">'+U.opts(myLops(),'id',function(l){ return l.ma+' · '+l.ten; },st.lop,isAdmin()?'Tất cả lớp':'Tất cả lớp tôi phụ trách')+'</select>'+
    '<select class="sel" id="fTT" aria-label="Trạng thái">'+U.opts([{id:'nhap',t:'Nháp'},{id:'hen',t:'Hẹn giao'},{id:'mo',t:'Đang nhận bài'},{id:'het',t:'Hết hạn nộp'},{id:'cham',t:'Còn bài chờ chấm'},{id:'cd',t:'Chưa chuyển điểm'},{id:'dong',t:'Đã đóng'}],'id','t',st.tt,'Tất cả trạng thái')+'</select>'+
    '<select class="sel" id="fLoai" aria-label="Loại">'+U.opts(Object.keys(LOAI).map(function(k){return {id:k,t:LOAI[k]};}),'id','t',st.loai,'Mọi loại bài')+'</select></div><div id="tbl"></div></div>';
  document.getElementById('app').innerHTML = h;
  tbl = U.table(document.getElementById('tbl'),{ pageSize:12, sort:'han', dir:-1, empty: isAdmin()?'Chưa có bài tập':'Bạn chưa giao bài tập nào. Bấm “Giao bài tập” để bắt đầu.',
    rows:function(){ var nq=U.norm(st.q); return visibleBT().filter(function(b){ var s=LMS.btStatus(b).key, ss=LMS.btStats(b);
      if(nq && U.norm(b.ma+' '+b.ten+' '+phamViText(b)).indexOf(nq)<0) return false; if(st.lop && b.lop!==st.lop) return false; if(st.loai && b.loai!==st.loai) return false;
      if(st.tt==='mo' && s!=='mo' && s!=='muon') return false; if(st.tt==='cham' && !ss.choCham) return false; if(st.tt==='cd' && (b.chuyenDiem||!ss.daCham||b.trangThai==='nhap')) return false;
      if(['nhap','hen','het','dong'].indexOf(st.tt)>=0 && s!==st.tt) return false; return true; }); },
    onRowClick:function(b){ openDetail(b.id); },
    columns:[
      {key:'ma',label:'Mã',render:function(b){ return '<span class="mono">'+esc(b.ma)+'</span>'; }},
      {key:'ten',label:'Bài tập',render:function(b){ return '<div class="t-main">'+U.hl(b.ten,st.q)+'</div><div class="t-sub">'+esc(phamViText(b))+'</div>'; }},
      {key:'lop',label:'Lớp',render:function(b){ var l=LMS.byId('lop',b.lop); return '<span class="mono">'+esc(l.ma)+'</span><div class="t-sub">'+esc(LMS.name('giangVien',b.gv,'hoTen'))+'</div>'; },sortVal:function(b){ return LMS.byId('lop',b.lop).ma; }},
      {key:'loai',label:'Loại',render:function(b){ return esc(LOAI[b.loai])+(b.cauHoi.length?'<div class="t-sub">'+b.cauHoi.length+' câu</div>':''); }},
      {key:'han',label:'Hạn nộp',render:function(b){ var s=LMS.btStatus(b); return '<div class="num">'+LMS.fmtDT(b.hanNop)+'</div>'+U.badge(s.label,s.tone)+(s.sub?' <span class="t-sub">'+esc(s.sub)+'</span>':''); },sortVal:function(b){ return b.hanNop; }},
      {key:'nop',label:'Đã nộp',w:'150px',render:function(b){ if(b.trangThai==='nhap') return '<span class="muted">—</span>'; var s=LMS.btStats(b); return U.prog(s.tong?Math.round(s.daNop/s.tong*100):0,'ok',s.daNop+'/'+s.tong); },sortVal:function(b){ var s=LMS.btStats(b); return s.tong?s.daNop/s.tong:0; }},
      {key:'cho',label:'Chờ chấm',cls:'num',render:function(b){ var n=LMS.btStats(b).choCham; return n?'<b style="color:var(--ems-warning)">'+n+'</b>':'<span class="muted">0</span>'; },sortVal:function(b){ return LMS.btStats(b).choCham; }},
      {key:'tb',label:'Điểm TB',cls:'num',render:function(b){ var t=LMS.btStats(b).tb; return t==null?'<span class="muted">—</span>':t.toFixed(1); },sortVal:function(b){ return LMS.btStats(b).tb; }},
      {key:'cd',label:'Cột điểm lớp',render:function(b){ if(b.chuyenDiem){ var l=LMS.byId('lop',b.lop), c=l.cotDiem[b.chuyenDiem.cot]; return U.badge('→ '+(c?c.ten:'?'),'ok'); } var s=LMS.btStats(b); return s.daCham?U.badge('Chưa chuyển','warn'):'<span class="muted">—</span>'; },sortable:false},
      {key:'x',label:'',sortable:false,render:function(b){ return '<button class="icon-btn" data-m="'+b.id+'" aria-label="Thao tác">⋯</button>'; }}
    ],
    after:function(host){ host.querySelectorAll('[data-m]').forEach(function(x){ x.onclick=function(e){ e.stopPropagation(); rowMenu(x, LMS.byId('baiTap',x.dataset.m)); }; }); }
  });
  document.getElementById('actAs').onchange=function(){ setActor(this.value); st.lop=''; render(); U.toast(isAdmin()?'Chuyển sang vai trò quản trị (chỉ xem)':'Đang thao tác với vai trò '+gvCur().hoTen); };
  document.getElementById('btnNew').onclick=function(){ wizard(null); };
  document.getElementById('q').oninput=function(){ st.q=this.value; tbl.render(true); };
  document.getElementById('fLop').onchange=function(){ st.lop=this.value; tbl.render(true); };
  document.getElementById('fTT').onchange=function(){ st.tt=this.value; renderList(); };
  document.getElementById('fLoai').onchange=function(){ st.loai=this.value; tbl.render(true); };
  document.querySelectorAll('[data-k]').forEach(function(k){ k.onclick=function(){ st.tt = st.tt===k.dataset.k?'':k.dataset.k; renderList(); }; });
}
function rowMenu(btn,b){
  var l=LMS.byId('lop',b.lop), can=canManage(l), s=LMS.btStats(b), tip='Chỉ giảng viên phụ trách lớp';
  U.menu(btn,[
    {label: can&&s.choCham?'Chấm bài ('+s.choCham+')':'Xem bài nộp', onClick:function(){ openDetail(b.id,'nop'); }},
    {label:'Sửa bài tập', disabled:!can, title:tip, onClick:function(){ editBT(b); }},
    {label:'Gia hạn nộp', disabled:!can||b.trangThai==='nhap', title:tip, onClick:function(){ extend(b); }},
    {label:'Nhắc học viên chưa nộp ('+s.chuaNop+')', disabled:!can||b.trangThai==='nhap'||!s.chuaNop, onClick:function(){ remind(b); }},
    {label:'Chuyển điểm vào lớp', disabled:!can||!s.daCham, onClick:function(){ openDetail(b.id,'cd'); }},
    {label:'Nhân bản sang lớp khác', disabled:!can, onClick:function(){ cloneBT(b); }},
    '-',
    {label: b.trangThai==='da-dong'?'Mở lại nhận bài':'Đóng nhận bài', disabled:!can||b.trangThai==='nhap', onClick:function(){ toggleClose(b); }},
    {label:'Xóa bài tập', danger:true, disabled:!can, onClick:function(){ delBT(b); }}
  ]);
}

/* =================== GIAO BÀI TẬP (4 bước) =================== */
function wizard(src){
  var lops=openLops();
  var f = src ? JSON.parse(JSON.stringify(src)) : { id:null, ma:nextMa(), ten:'', lop: (st.lop && lops.some(function(l){return l.id===st.lop;})) ? st.lop : (lops[0]||{}).id, phamVi:{loai:'bai',bai:[]}, loai:'trac-nghiem', cauHoi:[], deTL:'', rubric:[{ten:'Nội dung đúng, đủ ý',diem:5},{ten:'Liên hệ lâm sàng',diem:3},{ten:'Trình bày',diem:2}], taiLieu:[], tyLe:{tn:100,tl:0}, giaoNgay:true, giaoLuc:'', hanNop:'', nopMuon:{cho:false,truPct:10,toiDa:3}, soLan:1, cachLay:'cao-nhat', tronCau:true, hienDapAn:'sau-han', doiTuong:'ca-lop', hvChon:[], thongBao:true, nhacTruocHan:true, cotDuKien:'' };
  if(!src && p && p.bai && f.lop===p.lop){ f.phamVi.bai=[p.bai]; p.bai=null; }
  if(src){ f.giaoNgay = src.trangThai==='nhap'; }
  var hasSub = src && db().baiNop.some(function(n){ return n.bt===src.id; });
  var w = { step: hasSub?3:1, qf:{ q:'', dk:'', scope:true } };
  var api = U.modal({ title: src?'Sửa bài tập '+src.ma:'Giao bài tập', size:'lg', body:'<div></div>', noFocus:true, foot:[
    {label:'Hủy'},
    {label:'Quay lại', id:'wBack', close:false, onClick:function(){ collect(); if(w.step>(hasSub?3:1)){ w.step--; paint(); } return false; }},
    {label:'Lưu nháp', id:'wDraft', close:false, onClick:function(){ collect(); if(!validate(true)) return false; save(true); return true; }},
    {label:'Tiếp tục', id:'wNext', cls:'primary', close:false, onClick:function(){ collect(); if(!validate(false)) return false; if(w.step<4){ w.step++; paint(); return false; } save(false); api.close(); return false; }}
  ]});
  function lop(){ return LMS.byId('lop',f.lop); }
  function hpOf(){ var l=lop(); return l?LMS.hocPhanOfLop(l):null; }
  function steps(){ return '<div class="steps">'+['Lớp & phạm vi','Nội dung đề','Thời hạn & quy tắc','Xem lại'].map(function(t,i){ var n=i+1; return (i?'<b>—</b>':'')+'<span class="'+(n===w.step?'on':n<w.step?'done':'')+'"><i>'+(n<w.step?'✓':n)+'</i>'+t+'</span>'; }).join('')+'</div>'+(hasSub?'<div class="note warn">Đã có học viên nộp bài: chỉ sửa được thời hạn, quy tắc nộp và đối tượng. Nội dung đề được giữ nguyên để điểm không bị sai lệch.</div>':''); }
  function paint(){
    var b=api.body, H=hpOf(), h=steps();
    if(w.step===1){
      h += '<div class="form-grid"><div class="field"><label for="f_lop">Lớp <span class="req">*</span></label><select class="sel" id="f_lop" name="lop"'+(src?' disabled':'')+'>'+U.opts(lops,'id',function(l){ return l.ma+' · '+l.ten; },f.lop,'Chọn lớp bạn phụ trách')+'</select></div>'+
        '<div class="field"><label for="f_ten">Tên bài tập <span class="req">*</span></label><input class="inp" id="f_ten" name="ten" value="'+esc(f.ten)+'" placeholder="VD: Bài tập kinh Thủ thái âm Phế"></div></div>';
      if(H){
        h += '<div class="field"><label>Giao cho</label><div class="seg" role="radiogroup"><button data-pv="bai" class="'+(f.phamVi.loai==='bai'?'on':'')+'">Một bài giảng</button><button data-pv="nhieu-bai" class="'+(f.phamVi.loai==='nhieu-bai'?'on':'')+'">Nhiều bài (chương, phần)</button><button data-pv="hoc-phan" class="'+(f.phamVi.loai==='hoc-phan'?'on':'')+'">Cả học phần</button></div></div>';
        if(f.phamVi.loai==='nhieu-bai') h += '<div class="row small"><span>Chọn nhanh từ bài</span><select class="sel" id="rFrom">'+U.opts(H.bai.map(function(x,i){return {id:i+1,t:i+1};}),'id','t',1)+'</select><span>đến bài</span><select class="sel" id="rTo">'+U.opts(H.bai.map(function(x,i){return {id:i+1,t:i+1};}),'id','t',Math.min(3,H.bai.length))+'</select><button class="btn sm" id="rApply">Áp dụng</button></div>';

  function bind(){
    var b=api.body, H=hpOf();
    var fl=b.querySelector('#f_lop'); if(fl) fl.onchange=function(){ collect(); f.lop=this.value; f.phamVi.bai=[]; f.cauHoi=[]; paint(); };
    b.querySelectorAll('[data-pv]').forEach(function(x){ x.onclick=function(){ collect(); f.phamVi.loai=x.dataset.pv; if(x.dataset.pv==='bai') f.phamVi.bai=f.phamVi.bai.slice(0,1); if(x.dataset.pv==='hoc-phan') f.phamVi.bai=H.bai.map(function(z){return z.id;}); paint(); }; });
    var ra=b.querySelector('#rApply'); if(ra) ra.onclick=function(){ var a=+b.querySelector('#rFrom').value, c=+b.querySelector('#rTo').value; if(c<a){ var t=a; a=c; c=t; } f.phamVi.bai=H.bai.slice(a-1,c).map(function(z){return z.id;}); paint(); };
    b.querySelectorAll('[data-loai]').forEach(function(x){ x.onclick=function(){ collect(); f.loai=x.dataset.loai; f.tyLe = f.loai==='trac-nghiem'?{tn:100,tl:0}:f.loai==='ket-hop'?{tn:60,tl:40}:{tn:0,tl:100}; if(f.loai==='tu-luan'||f.loai==='nop-tep') f.cauHoi=[]; paint(); }; });
    if(b.querySelector('#qList')){ paintQ(); b.querySelector('#qq').oninput=function(){ w.qf.q=this.value; paintQ(); }; b.querySelector('#qdk').onchange=function(){ w.qf.dk=this.value; paintQ(); }; b.querySelector('#qscope').onchange=function(){ w.qf.scope=this.checked; paintQ(); };
      b.querySelector('#rPick').onclick=function(){ var want={De:+b.querySelector('#rDe').value||0,TrungBinh:+b.querySelector('#rTB').value||0,Kho:+b.querySelector('#rKho').value||0}; var pool=qPool(true), short=[]; Object.keys(want).forEach(function(k){ var cand=pool.filter(function(q){ return q.doKho===k && f.cauHoi.indexOf(q.id)<0; }); cand.sort(function(){ return Math.random()-.5; }); if(cand.length<want[k]) short.push(DK[k]+' thiếu '+(want[k]-cand.length)); cand.slice(0,want[k]).forEach(function(q){ f.cauHoi.push(q.id); }); }); paintQ(); if(short.length) U.toast('Ngân hàng không đủ câu: '+short.join(', '),'bad'); };
      b.querySelector('#qClear').onclick=function(){ f.cauHoi=[]; paintQ(); };
      b.querySelector('#goNH').onclick=function(){ var nh=db().nganHang.find(function(n){ return n.hocPhan===H.id; }); api.close(); LMS.go('ngan-hang-cau-hoi.html',{nh:nh&&nh.id}); }; }
    b.querySelectorAll('[data-r]').forEach(function(x){ x.oninput=function(){ var r=f.rubric[+x.dataset.r]; r[x.dataset.f]= x.dataset.f==='diem'?+x.value:x.value; rubSum(); }; });
    b.querySelectorAll('[data-rdel]').forEach(function(x){ x.onclick=function(){ collect(); f.rubric.splice(+x.dataset.rdel,1); paint(); }; });
    var ra2=b.querySelector('#rubAdd'); if(ra2) ra2.onclick=function(){ collect(); f.rubric.push({ten:'',diem:1}); paint(); };
    rubSum();
    var tn=b.querySelector('#f_tn'); if(tn) tn.oninput=function(){ var v=Math.max(0,Math.min(100,+this.value||0)); b.querySelector('#tlPct').textContent=100-v; };
    b.querySelectorAll('[data-gn]').forEach(function(x){ x.onclick=function(){ collect(); f.giaoNgay=x.dataset.gn==='1'; paint(); }; });
    b.querySelectorAll('[data-dt]').forEach(function(x){ x.onclick=function(){ collect(); f.doiTuong=x.dataset.dt; paint(); }; });
    b.querySelectorAll('[data-han]').forEach(function(x){ x.onclick=function(){ var base=f.giaoNgay?new Date():new Date(b.querySelector('[name=giaoLuc]').value||Date.now()); var d=LMS.addDays(base,+x.dataset.han); d.setHours(23,59); b.querySelector('#f_han').value=dtLocal(d); }; });

  function rubSum(){ var e=api.body.querySelector('#rubSum'); if(!e) return; var s=f.rubric.reduce(function(a,r){return a+(+r.diem||0);},0); e.innerHTML='Tổng điểm tiêu chí: <b>'+s+'</b> (quy đổi về thang 10)'; }
  function qPool(ignoreFilter){ var H=hpOf(), nh=db().nganHang.find(function(n){ return n.hocPhan===H.id; }); var nq=U.norm(w.qf.q); return db().cauHoi.filter(function(q){ if(!nh||q.nh!==nh.id||q.loai==='tu-luan'||q.trangThai==='luu-tru') return false; if(w.qf.scope && f.phamVi.loai!=='hoc-phan' && f.phamVi.bai.length && f.phamVi.bai.indexOf(q.bai)<0 && !ignoreFilter) return false; if(ignoreFilter) return !(w.qf.scope && f.phamVi.loai!=='hoc-phan' && f.phamVi.bai.length && f.phamVi.bai.indexOf(q.bai)<0); if(w.qf.dk && q.doKho!==w.qf.dk) return false; if(nq && U.norm(q.noiDung).indexOf(nq)<0) return false; return true; }); }
  function paintQ(){ var b=api.body, H=hpOf(), pool=qPool(false); var usedIn={}; db().baiTap.forEach(function(o){ if(o.lop===f.lop && o.id!==f.id) o.cauHoi.forEach(function(id){ (usedIn[id]=usedIn[id]||[]).push(o.ma); }); });
    b.querySelector('#qList').innerHTML = pool.length ? pool.map(function(q){ var on=f.cauHoi.indexOf(q.id)>=0; return '<label><input type="checkbox" data-q="'+q.id+'"'+(on?' checked':'')+(hasSub?' disabled':'')+'><span><span>'+U.hl(q.noiDung.replace(/^Câu\s*\d+\s*:\s*/,''),w.qf.q)+'</span><div class="meta">'+DK[q.doKho]+' · '+(q.loai==='nhieu-dap-an'?'nhiều đáp án':'một đáp án')+' · Bài '+baiIdx(H,q.bai)+(usedIn[q.id]?' · <span style="color:var(--ems-warning)">đã dùng ở '+usedIn[q.id].join(', ')+'</span>':'')+'</div></span></label>'; }).join('') : '<div class="empty">Không có câu phù hợp. Bỏ lọc "Chỉ câu thuộc bài đã chọn" hoặc bổ sung câu vào ngân hàng.</div>';
    b.querySelector('#qCount').textContent='Đã chọn '+f.cauHoi.length+' câu';
    b.querySelectorAll('[data-q]').forEach(function(c){ c.onchange=function(){ var i=f.cauHoi.indexOf(c.dataset.q); if(c.checked&&i<0) f.cauHoi.push(c.dataset.q); if(!c.checked&&i>=0) f.cauHoi.splice(i,1); b.querySelector('#qCount').textContent='Đã chọn '+f.cauHoi.length+' câu'; }; }); }
  function collect(){
    var b=api.body, v=U.formVals(b);
    if(w.step===1){ if(v.lop) f.lop=v.lop; f.ten=v.ten!=null?v.ten:f.ten; var picks=[].slice.call(b.querySelectorAll('[name=baiPick]:checked')).map(function(x){return x.value;}); if(f.phamVi.loai!=='hoc-phan' && b.querySelector('#baiPick')) f.phamVi.bai=picks; }
    if(w.step===2){ if(v.deTL!=null) f.deTL=v.deTL; if(v.tn!=null){ var t=Math.max(0,Math.min(100,+v.tn||0)); f.tyLe={tn:t,tl:100-t}; } var tls=b.querySelectorAll('[data-tl]'); if(tls.length) f.taiLieu=[].slice.call(tls).filter(function(x){return x.checked;}).map(function(x){return x.dataset.tl;}); }
    if(w.step===3){ if(!f.giaoNgay && v.giaoLuc) f.giaoLuc=new Date(v.giaoLuc).toISOString(); if(v.hanNop) f.hanNop=new Date(v.hanNop).toISOString(); f.nopMuon={cho:!!v.choMuon,truPct:Math.max(0,Math.min(100,+v.truPct||0)),toiDa:Math.max(1,+v.toiDa||1)}; f.soLan=+v.soLan||1; f.cachLay=v.cachLay; f.hienDapAn=v.hienDapAn; f.tronCau=!!v.tronCau; f.thongBao=!!v.thongBao; f.nhacTruocHan=!!v.nhacTruocHan; f.cotDuKien=v.cotDuKien; if(f.doiTuong==='chon') f.hvChon=[].slice.call(b.querySelectorAll('[data-hv]:checked')).map(function(x){return x.dataset.hv;}); }
  }
  function validate(draft){

function preview(host,b,l,cotIdx,gop,khongNop,done){
  var rows=rowsNop(b);
  var col = cotIdx!=null ? l.cotDiem[cotIdx] : null;
  var others = col && col.nguon==='bai-tap' ? (col.baiTap||[]).filter(function(x){ return x!==b.id; }).map(function(x){ return LMS.byId('baiTap',x); }).filter(Boolean) : [];
  function colVal(hid){ var vals=[]; others.concat([b]).forEach(function(bt){ if(!bt.chuyenDiem && bt!==b) return; if(LMS.btDoiTuong(bt).indexOf(hid)<0) return; var v=LMS.diemBaiTap(bt,hid); if(v==null && khongNop==='tinh-0' && LMS.btHetHan(bt) && !LMS.nopCuaHV(bt,hid).length) v=0; if(v!=null) vals.push(v); }); if(!vals.length) return null; return gop==='cao-nhat'?Math.max.apply(null,vals):Math.round(vals.reduce(function(a,c){return a+c;},0)/vals.length*10)/10; }
  U.table(host,{ pageSize:10, rows:rows, columns:[
    {key:'hv',label:'Học viên',render:function(r){ return U.person(r.hv.hoTen,esc(r.hv.ma)); },sortVal:function(r){ return r.hv.hoTen.split(' ').pop(); }},
    {key:'d',label:'Điểm '+b.ma,cls:'num',render:function(r){ return r.diem==null?(r.tt==='cho-cham'?U.badge('chờ chấm','warn'):r.tt==='khong-nop'?'<span class="muted">không nộp</span>':'<span class="muted">—</span>'):r.diem.toFixed(1); },sortVal:function(r){ return r.diem; }},
    {key:'c',label:col?'Cột '+col.ten+(done?'':' sau khi chuyển'):'Cột mới',cls:'num',render:function(r){ var v = done ? (function(){ var i=l.cotDiem.indexOf(col); return LMS.diemCot(l,r.id,i); })() : colVal(r.id); return v==null?'<span class="muted">trống</span>':'<b>'+v.toFixed(1)+'</b>'; },sortable:false},
    {key:'tk',label:'Tổng kết hiện tại',cls:'num',render:function(r){ var v=LMS.diemTongKet(l,r.id); return v==null?'<span class="muted">chưa đủ cột</span>':v.toFixed(1); },sortable:false}
  ]});
}

/* ---- thao tác khác ---- */
function remind(b){ var ids=rowsNop(b).filter(function(r){ return r.tt==='chua-nop'||r.tt==='tra-lai'; }).map(function(r){ return r.id; }); if(!ids.length){ U.toast('Không có học viên cần nhắc'); return; } sendRemind(b,ids); }
function sendRemind(b,ids){ U.modal({title:'Nhắc nộp bài '+b.ma,body:'<div class="field"><label for="rmT">Nội dung</label><textarea id="rmT" name="t">Bài tập "'+esc(b.ten)+'" hết hạn lúc '+LMS.fmtDT(b.hanNop)+'. Các em chưa nộp vui lòng hoàn thành đúng hạn.</textarea></div><div class="muted small">Gửi tới '+ids.length+' học viên qua thông báo trên cổng học viên và email.</div>',foot:[{label:'Hủy'},{label:'Gửi nhắc ('+ids.length+')',cls:'primary',onClick:function(api){ var t=U.formVals(api.body).t; var d=db(); d.thongBao=d.thongBao||[]; d.thongBao.push({id:LMS.nextId('tb'),lop:b.lop,tieuDe:'Nhắc nộp bài: '+b.ten,noiDung:t,nguoiNhan:ids,ngay:new Date().toISOString(),nguoiGui:actor()}); LMS.commit('Nhắc nộp bài','Bài tập',b.ma+' · '+ids.length+' học viên'); U.toast('Đã gửi nhắc tới '+ids.length+' học viên','ok'); }}]}); }
function extend(b){ U.modal({title:'Gia hạn '+b.ma,size:'sm',body:'<div class="field"><label for="nh">Hạn nộp mới</label><input class="inp" type="datetime-local" id="nh" name="h" value="'+dtLocal((function(){ var d=LMS.addDays(new Date(b.hanNop),3); d.setHours(23,59,0,0); return d; })())+'"></div><label class="check"><input type="checkbox" name="tb" checked> Thông báo cho học viên</label>',foot:[{label:'Hủy'},{label:'Gia hạn',cls:'primary',onClick:function(api){ var v=U.formVals(api.body), nh=new Date(v.h), l=LMS.byId('lop',b.lop); if(!v.h||nh<=new Date(b.hanNop)){ U.fieldErr(api.body,'h','Hạn mới phải sau hạn hiện tại'); return false; } if(nh>LMS.parse(l.ketThuc).getTime()+86399000){ U.fieldErr(api.body,'h','Vượt ngày kết thúc lớp ('+LMS.fmtDate(l.ketThuc)+')'); return false; } var before=LMS.fmtDT(b.hanNop); b.hanNop=nh.toISOString(); if(b.trangThai==='da-dong') b.trangThai='da-giao'; LMS.commit('Gia hạn','Bài tập',b.ma,{hanNop:before},{hanNop:LMS.fmtDT(b.hanNop)}); U.toast('Đã gia hạn đến '+LMS.fmtDT(b.hanNop),'ok'); render(); }}]}); }
function toggleClose(b){ var closing=b.trangThai!=='da-dong'; U.confirm({title:(closing?'Đóng nhận bài ':'Mở lại nhận bài ')+b.ma,message:closing?'Học viên chưa nộp sẽ không nộp được nữa và được tính là không nộp.':'Học viên được nộp tiếp đến hạn nộp hiện tại.',ok:closing?'Đóng nhận bài':'Mở lại'}).then(function(ok){ if(!ok) return; b.trangThai=closing?'da-dong':'da-giao'; LMS.commit(closing?'Đóng nhận bài':'Mở lại nhận bài','Bài tập',b.ma); U.toast(closing?'Đã đóng nhận bài':'Đã mở lại nhận bài','ok'); render(); }); }
function cloneBT(b){ var l=LMS.byId('lop',b.lop), targets=openLops().filter(function(x){ return x.id!==b.lop && x.hocPhan===b.hocPhan; });
  if(!targets.length){ U.toast('Bạn không phụ trách lớp nào khác cùng học phần '+hp(b).ten,'bad'); return; }
  U.modal({title:'Nhân bản '+b.ma+' sang lớp khác',size:'sm',body:'<div class="field"><label for="cl">Lớp nhận</label><select class="sel" id="cl" name="l">'+U.opts(targets,'id',function(x){ return x.ma+' · '+x.ten; })+'</select></div><div class="muted small">Bản sao ở trạng thái nháp, giữ nguyên đề và tiêu chí; cần đặt lại hạn nộp trước khi giao.</div>',foot:[{label:'Hủy'},{label:'Tạo bản sao',cls:'primary',onClick:function(api){ var to=U.formVals(api.body).l; var n=JSON.parse(JSON.stringify(b)); n.id=LMS.nextId('bt'); n.ma=nextMa(); n.lop=to; n.gv=actor(); n.trangThai='nhap'; n.chuyenDiem=null; n.cotDuKien=''; n.hvChon=[]; n.doiTuong='ca-lop'; n.ngayTao=new Date().toISOString(); db().baiTap.push(n); LMS.commit('Nhân bản','Bài tập',b.ma+' → '+n.ma+' · '+LMS.name('lop',to,'ma')); U.toast('Đã tạo bản nháp '+n.ma,'ok'); openDetail(n.id,'de'); }}]}); }
function delBT(b){ var n=db().baiNop.filter(function(x){ return x.bt===b.id; }).length; if(n){ U.blocked('Không thể xóa '+b.ma,[n+' bài nộp của học viên'].concat(b.chuyenDiem?['Điểm đã chuyển vào bảng điểm lớp']:[]),'Dùng Đóng nhận bài để dừng bài tập, lịch sử làm bài được giữ lại.'); return; }
  U.confirm({title:'Xóa '+b.ma,message:'Bài tập chưa có bài nộp. Xóa bài tập "'+b.ten+'"?',ok:'Xóa',danger:true}).then(function(ok){ if(!ok) return; db().baiTap=db().baiTap.filter(function(x){ return x.id!==b.id; }); LMS.commit('Xóa','Bài tập',b.ma+' · '+b.ten); U.toast('Đã xóa '+b.ma,'ok'); st.view='list'; render(); }); }

function render(){ if(st.view==='detail') renderDetail(); else renderList(); }
render();
if(p && p.moi && !isAdmin() && openLops().some(function(l){ return l.id===st.lop; })) wizard();
LMS.onChange(render);
})();
</script>
</body></html>
