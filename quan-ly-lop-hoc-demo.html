function bindSurveyEditor(c){
  const readTop = ()=>{
    SV.title = val('vTitle'); SV.desc = val('vDesc');
    SV.start = F('vStart').value; SV.end = F('vEnd').value; SV.anonymous = F('vAnon').checked;
  };
  ['vTitle','vDesc','vStart','vEnd'].forEach(id=>{ F(id).oninput = readTop; });
  F('vAnon').onchange = readTop;
  F('svBack').onclick = ()=>{ show('detail'); tab='surveys'; drawDetail(); };
  F('svDraft').onclick = ()=>{ readTop(); saveSurvey(c, false); };
  F('svPub').onclick = ()=>{ readTop(); saveSurvey(c, true); };
  if(F('vInsCancel')) F('vInsCancel').onclick = ()=>{ insAt = null; drawSurvey(); };
  F('surveyView').querySelectorAll('[data-add]').forEach(b=>{
    b.onclick = ()=>{
      readTop();
      const q = newQ(b.dataset.add);
      if(insAt==null) SV.qs.push(q); else SV.qs.splice(insAt, 0, q);
      insAt = null; drawSurvey();
    };
  });
  F('surveyView').querySelectorAll('[data-ins]').forEach(el=>{
    el.onclick = ()=>{ readTop(); insAt = (insAt === +el.dataset.ins) ? null : +el.dataset.ins; drawSurvey(); };
  });
  F('surveyView').querySelectorAll('.blk-h input.tt').forEach(el=>{
    el.oninput = ()=>{ SV.qs[+el.dataset.q].text = el.value; };
  });
  F('surveyView').querySelectorAll('[data-opt]').forEach(el=>{
    el.oninput = ()=>{ SV.qs[+el.dataset.q].opts[+el.dataset.opt] = el.value; };
  });
  F('surveyView').querySelectorAll('[data-f="req"]').forEach(el=>{
    el.onchange = ()=>{ SV.qs[+el.dataset.q].req = el.checked; };
  });
  F('surveyView').querySelectorAll('[data-addopt]').forEach(b=>{
    b.onclick = ()=>{ readTop(); const q = SV.qs[+b.dataset.addopt]; q.opts.push('Lựa chọn '+(q.opts.length+1)); drawSurvey(); };
  });
  F('surveyView').querySelectorAll('[data-killopt]').forEach(b=>{
    b.onclick = ()=>{ readTop(); SV.qs[+b.dataset.killopt].opts.splice(+b.dataset.oi,1); drawSurvey(); };
  });
  F('surveyView').querySelectorAll('[data-del]').forEach(b=>{
    b.onclick = ()=>{ readTop(); SV.qs.splice(+b.dataset.del,1); drawSurvey(); };
  });
  F('surveyView').querySelectorAll('[data-fold]').forEach(b=>{
    b.onclick = ()=>{ readTop(); const q = SV.qs[+b.dataset.fold]; q._open = !q._open; drawSurvey(); };
  });
  F('surveyView').querySelectorAll('[data-mv]').forEach(b=>{
    b.onclick = ()=>{
      readTop();
      const i = +b.dataset.i, j = i + (+b.dataset.mv);
      if(j<0 || j>=SV.qs.length) return;
      const a = SV.qs; const t = a[i]; a[i] = a[j]; a[j] = t;
      drawSurvey();
    };
  });
}
function saveSurvey(c, publish){
  if(!SV.title.trim()){ toast('Nhập tên khảo sát'); return; }
  if(!SV.qs.length){ toast('Thêm ít nhất một câu hỏi'); return; }
  if(SV.qs.some(q=>!q.text.trim())){ toast('Còn câu hỏi chưa nhập nội dung'); return; }
  if(SV.qs.some(q=>(q.t==='single'||q.t==='multi') && q.opts.filter(o=>o.trim()).length < 2)){
    toast('Câu trắc nghiệm cần ít nhất hai lựa chọn'); return;
  }
  SV.published = publish;
  const i = c.surveys.findIndex(x=>x.id===SV.id);
  if(i >= 0) c.surveys[i] = SV; else c.surveys.push(SV);
  toast(publish ? 'Đã phát hành khảo sát tới '+c.students.length+' học viên' : 'Đã lưu nháp khảo sát');
  show('detail'); tab='surveys'; drawDetail();
}

/* ---------- trả lời và kết quả khảo sát ---------- */
function fillBox(c, sv){
  const left = c.students.filter(s=>!sv.responses.some(r=>r.stu===s.id));
  if(!c.students.length){ toast('Lớp chưa có học viên'); return; }
  if(!left.length){ toast('Toàn bộ học viên đã trả lời khảo sát này'); return; }
  openBox('<h3>'+esc(sv.title)+'</h3>'+
    '<div class="head-sub">'+(sv.desc? esc(sv.desc)+' · ' : '')+'mở từ '+fmtD(sv.start)+' đến '+fmtD(sv.end)+'</div>'+
    '<div class="field"><label>Trả lời với tư cách học viên</label><select class="input" id="fStu">'+
      left.map(s=>'<option value="'+s.id+'">'+esc(s.name)+' · '+esc(s.code)+'</option>').join('')+'</select></div>'+
    sv.qs.map((q,i)=>'<div class="field"><label>'+(i+1)+'. '+esc(q.text)+(q.req?' <span class="req">*</span>':'')+'</label>'+
      (q.t==='rating' ? '<div class="att" data-r="'+q.id+'">'+[1,2,3,4,5].map(v=>'<button data-v="'+v+'">'+v+'</button>').join('')+
          '</div><div class="note">1 là rất không hài lòng, 5 là rất hài lòng</div>'
      : q.t==='single' ? q.opts.map(o=>'<label class="check"><input type="radio" name="q'+q.id+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>').join('')
      : q.t==='multi' ? q.opts.map(o=>'<label class="check"><input type="checkbox" name="q'+q.id+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>').join('')
      : '<textarea class="input" id="ta'+q.id+'" rows="2" placeholder="Nhập ý kiến của bạn"></textarea>')+
    '</div>').join('')+
    '<div class="foot"><button class="btn ghost" id="fNo">Đóng</button><button class="btn" id="fOk">Gửi phản hồi</button></div>', 'wide');
  F('fNo').onclick = closeBox;
  document.querySelectorAll('[data-r] button').forEach(b=>{
    b.onclick = ()=>{
      const p = b.parentNode;
      p.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); b.dataset.v && (p.dataset.val = b.dataset.v);
    };
  });
  F('fOk').onclick = ()=>{
    const a = {};
    for(const q of sv.qs){
      if(q.t==='rating'){ const el = document.querySelector('[data-r="'+q.id+'"]'); if(el.dataset.val) a[q.id] = +el.dataset.val; }
      else if(q.t==='single'){ const el = document.querySelector('input[name="q'+q.id+'"]:checked'); if(el) a[q.id] = el.value; }
      else if(q.t==='multi'){ const v = [].slice.call(document.querySelectorAll('input[name="q'+q.id+'"]:checked')).map(x=>x.value); if(v.length) a[q.id] = v; }
      else { const v = val('ta'+q.id); if(v) a[q.id] = v; }
      if(q.req && a[q.id]==null){ toast('Chưa trả lời câu bắt buộc: '+q.text); return; }
    }
    sv.responses.push({stu:F('fStu').value, at:iso(TODAY), a});
    closeBox(); toast('Đã ghi nhận phản hồi'); drawDetail();
  };
}
function simulate(c, sv){
  let n = 0;
  c.students.filter(s=>!sv.responses.some(r=>r.stu===s.id)).forEach(s=>{
    if(Math.random() < 0.25) return;
    const a = {};
    sv.qs.forEach(q=>{
      if(q.t==='rating') a[q.id] = 3+rnd(3);
      else if(q.t==='single') a[q.id] = pick(q.opts);
      else if(q.t==='multi') a[q.id] = q.opts.filter(()=>Math.random()<0.4);
      else if(Math.random() < 0.6) a[q.id] = pick(['Lớp học sôi nổi, mong có thêm bài tập về nhà',
        'Giảng viên nhiệt tình, chữa bài kỹ','Muốn tăng thời lượng luyện nói','Phòng học hơi ồn vào cuối giờ']);
    });
    sv.responses.push({stu:s.id, at:iso(TODAY), a}); n++;
  });
  toast(n? 'Đã tạo '+n+' phản hồi mô phỏng' : 'Không còn học viên nào để mô phỏng'); drawDetail();
}
function statBox(c, sv){
  const sent = c.students.length, res = sv.responses.length;
  const bar = (lb,n,tot,color)=>'<div class="prog"><div class="pl">'+esc(lb)+'</div>'+
    '<div class="pb"><i style="width:'+(tot? n*100/tot:0)+'%'+(color?';background:'+color:'')+'"></i></div>'+
    '<div class="pv">'+n+' ('+(tot? Math.round(n*100/tot):0)+'%)</div></div>';
  openBox('<h3>Kết quả · '+esc(sv.title)+'</h3>'+
    '<div class="head-sub">'+esc(c.name)+' · mở từ '+fmtD(sv.start)+' đến '+fmtD(sv.end)+(sv.anonymous?' · ẩn danh':'')+'</div>'+
    '<div class="stat">'+
      '<div><span>Đã gửi</span><b>'+sent+'</b></div>'+
      '<div><span>Đã thực hiện</span><b>'+res+'</b></div>'+
      '<div><span>Chưa thực hiện</span><b>'+(sent-res)+'</b></div>'+
      '<div><span>Tỉ lệ phản hồi</span><b>'+(sent? Math.round(res*100/sent):0)+'%</b></div>'+
      '<div><span>Điểm trung bình</span><b>'+(svAvg(sv)==null?'—':svAvg(sv))+'</b></div>'+
    '</div>'+
    sv.qs.map((q,i)=>{
      const ans = sv.responses.map(r=>r.a[q.id]).filter(v=>v!=null && v!=='');
      let body = '';
      if(q.t==='rating'){
        const avg = ans.length? Math.round(ans.reduce((s,v)=>s+ +v,0)/ans.length*100)/100 : null;
        body = '<div class="note" style="margin:0 0 8px">Điểm trung bình <b>'+(avg==null?'—':avg)+'</b> trên '+ans.length+' lượt trả lời</div>'+
          [5,4,3,2,1].map(v=>bar(v+' điểm', ans.filter(x=>+x===v).length, ans.length,
            v>=4?'var(--success)':(v===3?'var(--warn)':'var(--danger)'))).join('');
      }else if(q.t==='single' || q.t==='multi'){
        const flat = q.t==='multi' ? [].concat.apply([], ans) : ans;
        body = q.opts.map(o=>bar(o, flat.filter(x=>x===o).length, q.t==='multi'? ans.length : flat.length)).join('')+
          '<div class="note">'+ans.length+' lượt trả lời'+(q.t==='multi'?' · chọn được nhiều đáp án':'')+'</div>';
      }else{
        body = ans.length ? '<div style="max-height:170px;overflow:auto">'+ans.map(t=>'<div class="pill" style="display:block;border-radius:var(--radius);margin-bottom:6px">'+esc(t)+'</div>').join('')+'</div>'
          : '<div class="note">Chưa có câu trả lời</div>';
      }
      return '<div class="blk" style="margin-bottom:12px"><div class="blk-h"><span class="badge">'+esc(QT[q.t])+'</span>'+
        '<b style="flex:1;font-weight:600">'+(i+1)+'. '+esc(q.text)+'</b></div>'+
        '<div class="blk-c">'+body+'</div></div>';
    }).join('')+
    '<h4 style="margin:18px 0 10px;font-size:15px">Tình trạng thực hiện theo học viên</h4>'+
    '<div style="max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius)">'+
    '<table class="tbl"><thead><tr><th style="width:112px">Mã</th><th>Họ và tên</th>'+
      '<th style="width:130px">Trạng thái</th><th style="width:110px">Thời điểm</th></tr></thead><tbody>'+
    c.students.map(s=>{
      const r = sv.responses.find(x=>x.stu===s.id);
      return '<tr><td class="mono" style="color:var(--text-2)">'+esc(s.code)+'</td><td><span class="ellip">'+esc(s.name)+'</span></td>'+
        '<td>'+(r?'<span class="tag on">Đã thực hiện</span>':'<span class="tag draft">Chưa thực hiện</span>')+'</td>'+
        '<td>'+(r? fmtD(r.at) : '<span style="color:var(--text-3)">—</span>')+'</td></tr>';
    }).join('')+'</tbody></table></div>'+
    '<div class="foot"><button class="btn ghost" id="rExp">Xuất kết quả</button>'+
      '<button class="btn ghost" id="rSim">Mô phỏng phản hồi</button>'+
      '<button class="btn" id="rNo">Đóng</button></div>', 'wide');
  F('rNo').onclick = closeBox;
  F('rSim').onclick = ()=>{ closeBox(); simulate(c, sv); };
  F('rExp').onclick = ()=>{
    if(!hasXLSX()) return;
    const aoa = [['Học viên','Mã','Thời điểm'].concat(sv.qs.map(q=>q.text))];
    sv.responses.forEach(r=>{
      const s = c.students.find(x=>x.id===r.stu) || {};
      aoa.push([sv.anonymous?'(ẩn danh)':(s.name||''), sv.anonymous?'':(s.code||''), fmtD(r.at)]
        .concat(sv.qs.map(q=>{ const v = r.a[q.id]; return Array.isArray(v)? v.join(', ') : (v==null?'':v); })));
    });
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'KetQua');
    XLSX.writeFile(wb, 'Ket-qua-khao-sat-'+c.code+'.xlsx');
    toast('Đã xuất kết quả khảo sát');
  };
}

function rcpBody(c){

      '<div class="field"><label>Nội dung</label><textarea class="input" id="nB" rows="4"></textarea></div>'+
      '<div class="field"><label>Người nhận <span class="req">*</span></label><div id="nRcp">'+rcpBody(c)+'</div></div>'+
      '<div class="foot"><button class="btn ghost" id="nNo">Huỷ</button><button class="btn" id="nOk">Gửi thông báo</button></div>');
    F('nNo').onclick = closeBox;
    bindRcp(c);
    F('nOk').onclick = ()=>{
      const t = val('nT'); if(!t){ toast('Nhập tiêu đề thông báo'); return; }
      if(!NC.ids.length){ toast('Chọn ít nhất một học viên nhận thông báo'); return; }
      c.notices.unshift({id:uid('nt'), title:t, body:val('nB'), at:iso(TODAY), by:tName(c.teachers[0]),
        to:NC.ids.slice(), read:[]});
      closeBox(); toast('Đã gửi thông báo tới '+NC.ids.length+' học viên'); drawDetail();
    };
  };
  F('tabBody').querySelectorAll('[data-vn]').forEach(b=>{
    b.onclick = ()=>{ const nt = c.notices.find(x=>x.id===b.dataset.vn); if(nt) noticeStatBox(c, nt); };
  });
  F('tabBody').querySelectorAll('[data-rmn]').forEach(b=>{
    b.onclick = ()=>{ c.notices = c.notices.filter(x=>x.id!==b.dataset.rmn); toast('Đã xoá thông báo'); drawDetail(); };
  });
}
function tabRegs(c){
  return '<div class="rowbar"><span class="hint">'+(canSelfReg(c)
    ? 'Yêu cầu đăng ký từ học viên, duyệt xong sẽ thêm thẳng vào danh sách lớp'
    : 'Lớp đang ở trạng thái '+esc(stLabel(c.status))+' nên không nhận đăng ký mới, chỉ quản trị viên thêm học viên')+'</span></div>'+
    (c.regs.length ?
      '<table class="tbl"><colgroup><col><col style="width:150px"><col class="col-prog" style="width:220px">'+
        '<col style="width:120px"><col style="width:120px"><col style="width:170px"></colgroup>'+
      '<thead><tr><th>Họ và tên</th><th>Điện thoại</th><th class="col-prog">Email</th><th>Ngày gửi</th>'+
        '<th>Trạng thái</th><th></th></tr></thead><tbody>'+
      c.regs.map(r=>'<tr><td><b>'+esc(r.name)+'</b></td><td>'+esc(r.phone)+'</td>'+
        '<td class="col-prog"><span class="ellip">'+esc(r.email)+'</span></td><td>'+fmtD(r.at)+'</td>'+
        '<td>'+(r.status==='Chờ duyệt'?'<span class="tag draft">Chờ duyệt</span>'
          : r.status==='Đã duyệt'?'<span class="tag on">Đã duyệt</span>':'<span class="tag off">Từ chối</span>')+'</td>'+
        '<td>'+(r.status==='Chờ duyệt'
          ? '<button class="btn ghost sm" data-ok="'+r.id+'">Duyệt vào lớp</button> <span class="rm" data-no="'+r.id+'">Từ chối</span>'
          : '<span style="color:var(--text-3);font-size:12.5px">—</span>')+'</td></tr>').join('')+
      '</tbody></table>'
      : '<div class="empty">Chưa có yêu cầu đăng ký nào.</div>');
}
function bindRegs(c){
  F('tabBody').querySelectorAll('[data-ok]').forEach(b=>{
    b.onclick = ()=>{
      const r = c.regs.find(x=>x.id===b.dataset.ok);
      if(!canAddStu(c)){ toast('Lớp đang ở trạng thái '+stLabel(c.status)+', chưa duyệt học viên vào lớp được'); return; }
      if(c.capacity && actives(c).length >= c.capacity){ toast('Lớp đã đủ sức chứa '+c.capacity+' học viên'); return; }
      r.status = 'Đã duyệt'; stuSeq++;
      const rst = {id:uid('st'), code:'HV'+stuSeq, name:r.name, gender:'—', dob:'', phone:r.phone,
        email:r.email, status:'Đang học', moveTo:'', moveAt:'', reason:'', join:iso(TODAY), note:'Duyệt từ đăng ký trực tuyến'};
      if(c.fee) rst.debt = newDebt(c);
      c.students.push(rst);
      toast('Đã duyệt '+r.name+' vào lớp'); drawDetail();
    };
  });
  F('tabBody').querySelectorAll('[data-no]').forEach(b=>{
    b.onclick = ()=>{ c.regs.find(x=>x.id===b.dataset.no).status = 'Từ chối'; toast('Đã từ chối yêu cầu'); drawDetail(); };
  });
}

/* ---------- khởi động ---------- */
document.getElementById('mask').addEventListener('mousedown', e=>{ if(e.target.id==='mask') closeBox(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeBox(); });
drawListShell();
drawList();
</script>
