<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý lớp học / khóa học</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

/* ===== EDOT Portal Design System — token màu & kiểu chữ ===== */
:root{
  /* thương hiệu edot */
  --ems-brand-blue:#0091d4;
  --ems-brand-gradient:linear-gradient(100deg,#0076d7 0%,#00bbff 48%,#006bd1 100%);
  /* primary (navy sản phẩm) */
  --ems-primary:#00327d;
  --ems-primary-hover:#0047ab;
  --ems-primary-soft:#eff6ff;
  --ems-primary-soft-100:#dbeafe;
  /* neutral (slate) */
  --ems-white:#ffffff;
  --ems-slate-50:#f8fafc;
  --ems-slate-100:#f1f5f9;
  --ems-slate-200:#e2e8f0;
  --ems-slate-300:#cbd5e1;
  --ems-slate-400:#94a3b8;
  --ems-slate-500:#64748b;
  --ems-slate-600:#475569;
  --ems-slate-900:#0f172a;
  --ems-ink:#011129;
  /* semantic */
  --ems-success:#059669;  --ems-success-soft:#ecfdf5;  --ems-success-border:#a7f3d0;
  --ems-danger:#dc2626;   --ems-danger-strong:#b91c1c; --ems-danger-soft:#fef2f2; --ems-danger-border:#fecaca;
  --ems-warning:#d97706;  --ems-warning-soft:#fffbeb;  --ems-warning-border:#fcd34d; --ems-warning-text:#92400e;
  /* kiểu chữ */
  --ems-font:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --ems-font-mono:ui-monospace,Menlo,Consolas,monospace;
  --ems-tracking-wide:.05em;
  /* focus */
  --ems-focus-ring:rgba(59,130,246,.15);
  --ems-focus-border:#0047ab;
}

:root{--primary:var(--ems-primary);--text:var(--ems-slate-900);--text-2:var(--ems-slate-600);--text-3:var(--ems-slate-500);--border:var(--ems-slate-200);--border-2:var(--ems-slate-100);--success:var(--ems-success);--warn:var(--ems-warning);--danger:var(--ems-danger);--radius:6px}
*{box-sizing:border-box}
body{margin:0;padding:22px;background:#f8fafc;color:var(--text);font-family:var(--ems-font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px}
.panel-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.panel-head h2{margin:0;font-size:19px;font-weight:600}
.panel-head p{margin:5px 0 0;color:var(--text-3);font-size:13px}
.panel-head .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn{border:1px solid var(--primary);background:var(--primary);color:#fff;padding:7px 16px;border-radius:var(--radius);cursor:pointer}
.btn:hover{background:#0047ab;border-color:#0047ab}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--text);border-color:var(--border)}
.btn.ghost:hover{color:var(--primary);border-color:var(--primary)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:#b91c1c;border-color:#b91c1c}
.btn.sm{padding:5px 12px;font-size:13px}
.back{background:none;border:0;color:var(--primary);cursor:pointer;padding:0;margin-bottom:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.input{padding:7px 11px;border:1px solid var(--border);border-radius:var(--radius);outline:none;background:#fff}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
textarea.input{resize:vertical;min-height:76px;line-height:1.55}
#q{flex:1;min-width:200px;max-width:400px}

.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{text-align:left;font-size:13px;font-weight:600;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--border)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--border-2);vertical-align:middle;overflow:hidden}
.tbl tbody tr:hover{background:#f8fafc}
.tbl .num{text-align:center}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.tag{display:inline-block;padding:2px 9px;border-radius:3px;font-size:12px;border:1px solid;white-space:nowrap}
.tag.on{color:var(--success);background:#ecfdf5;border-color:#a7f3d0}
.tag.draft{color:var(--warn);background:#fffbeb;border-color:#fcd34d}
.tag.off{color:var(--text-2);background:#f1f5f9;border-color:var(--border)}
.tag.trial{color:var(--primary);background:#eff6ff;border-color:#bfdbfe;margin-left:5px}
.sum{padding-top:14px;color:var(--text-3);font-size:13px}
.empty{padding:34px 0;text-align:center;color:var(--text-3)}
.rowbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.rowbar .hint{color:var(--text-3);font-size:13px}
.rowbar .right{margin-left:auto}

.kebab{background:none;border:1px solid transparent;border-radius:4px;cursor:pointer;color:var(--text-2);padding:2px 8px;font-size:17px;line-height:1.2}
.kebab:hover,.kebab.on{background:#f1f5f9;color:var(--primary)}
.menu{position:fixed;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(15,23,42,.16);padding:4px 0;min-width:180px;z-index:50}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 15px;cursor:pointer}
.menu button:hover{background:#eff6ff;color:var(--primary)}
.menu button.del{color:var(--danger)}
.menu button.del:hover{background:#fef2f2}
.menu hr{border:0;border-top:1px solid var(--border-2);margin:4px 0}

.tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:10px 0;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px;max-width:900px}
.form .wide{grid-column:1 / -1}
.form label{display:block;margin-bottom:6px;font-size:13px;color:var(--text-2)}
.form label .req{color:var(--danger)}
.form .input{width:100%}
.form .note{color:var(--text-3);font-size:12.5px;margin-top:6px}
.ord{display:flex;gap:4px;justify-content:center}
.ord button{width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:4px;cursor:pointer;color:var(--text-2);line-height:1}
.ord button:hover:not(:disabled){color:var(--primary);border-color:var(--primary)}
.ord button:disabled{opacity:.4;cursor:not-allowed}
.rm{color:var(--danger);cursor:pointer}
.rm:hover{text-decoration:underline}

.stat{display:flex;gap:26px;flex-wrap:wrap;padding:14px 16px;background:#f8fafc;border:1px solid var(--border-2);border-radius:var(--radius);margin-bottom:16px}
.stat div span{display:block;color:var(--text-3);font-size:12.5px}
.stat div b{font-size:17px;font-weight:600}

.mask{position:fixed;inset:0;background:rgba(2,6,23,.5);display:none;align-items:flex-start;justify-content:center;padding:48px 16px;z-index:40}
.mask.show{display:flex}
.box{background:#fff;border-radius:8px;width:min(560px,100%);max-height:84vh;overflow:auto;padding:22px 24px}
.box h3{margin:0 0 4px;font-size:17px}
.box .head-sub{color:var(--text-3);font-size:13px;margin-bottom:18px}
.box .field{margin-bottom:14px}
.box .field label{display:block;margin-bottom:6px;font-size:13px;color:var(--text-2)}
.box .field .input{width:100%}
.msel{position:relative;min-height:36px;border:1px solid var(--border);border-radius:var(--radius);background:#fff;padding:5px 30px 5px 8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:pointer;font-size:14px}
.msel:hover{border-color:var(--primary)}
.msel.open{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.msel .ph{color:var(--text-3)}
.msel .caret{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:10px}
.msel .tg{display:inline-flex;align-items:center;gap:7px;background:#eff6ff;border:1px solid #bfdbfe;color:var(--primary);border-radius:4px;padding:2px 8px;font-size:12.5px;white-space:nowrap}
.msel .tg.main{background:var(--primary);border-color:var(--primary);color:#fff}
.msel .tg i{font-style:normal;cursor:pointer;opacity:.7}
.msel .tg i:hover{opacity:1}
.mopts{margin-top:6px;border:1px solid var(--border);border-radius:var(--radius);max-height:210px;overflow:auto;background:#fff}
.mopts button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 12px;cursor:pointer;text-align:left;font-size:13.5px;color:var(--text)}
.mopts button+button{border-top:1px solid var(--border-2)}
.mopts button:hover{background:#eff6ff}
.mopts button.on{color:var(--primary)}
.mopts .bx{width:16px;height:16px;flex:0 0 16px;border:1px solid var(--border);border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.mopts button.on .bx{background:var(--primary);border-color:var(--primary)}
.mopts .k{margin-left:auto;color:var(--text-3);font-size:12.5px}
.rcpt{border:1px solid var(--border);border-radius:var(--radius);padding:24px 26px;font-family:"Times New Roman",Georgia,serif;font-size:14px;color:#111;background:#fff;line-height:1.7}
.rcpt .rc-top{display:flex;justify-content:space-between;gap:20px;font-size:13px}
.rcpt .rc-form{border:1px solid #333;padding:6px 10px;text-align:center;font-size:11.5px;line-height:1.35;max-width:230px}
.rcpt .rc-title{text-align:center;font-size:19px;font-weight:700;letter-spacing:.5px;margin:16px 0 2px}
.rcpt .rc-sub{text-align:center;font-size:13px;font-style:italic;margin-bottom:16px}
.rcpt .rc-sub div{font-style:normal}
.rcpt .rc-line{margin-bottom:7px;border-bottom:1px dotted #bbb;padding-bottom:3px}
.rcpt .rc-sign{display:flex;gap:16px;margin-top:26px;text-align:center}
.rcpt .rc-sign > div{flex:1}
.rcpt .rc-note{font-size:12px;font-style:italic;color:#444}
.rcpt .rc-space{margin-top:52px;font-size:13px}
@media print{
  body > *{display:none !important}
  #mask{display:block !important;position:static;background:none;padding:0;overflow:visible}
  #mask .box{box-shadow:none;border-radius:0;width:auto;max-width:none;padding:0;max-height:none}
  #mask .box > h3,#mask .box > .head-sub,#mask .box > .foot{display:none !important}
  .rcpt{border:0;padding:0}
}
.nav{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.nav button{border:1px solid var(--border);background:#fff;border-radius:var(--radius);padding:8px 15px;font-size:14px;color:var(--text-2);cursor:pointer}
.nav button:hover{border-color:var(--primary);color:var(--primary)}
.nav button.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:500}
.warn{color:var(--danger);font-size:12.5px;margin-top:6px;display:none}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.alert{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);padding:13px 15px;color:var(--text-2);font-size:13px;margin-bottom:14px}
.alert b{color:var(--text)}
.check{display:flex;gap:9px;align-items:flex-start;margin:14px 0 4px;cursor:pointer}
.check input{margin-top:3px}

/* ---- trình soạn bài giảng ---- */
.edbar{position:sticky;top:0;z-index:30;background:var(--primary);color:#fff;border-radius:var(--radius) var(--radius) 0 0;display:flex;align-items:center;gap:14px;padding:11px 18px}
.edbar .arrow{background:none;border:0;color:#fff;font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;border-radius:4px}
.edbar .arrow:hover{background:rgba(255,255,255,.18)}
.edbar h2{margin:0;font-size:16px;font-weight:600}
.edbar .sub{font-size:12.5px;opacity:.85;margin-top:1px}
.edbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}
.btn.line{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.45);color:#fff}
.btn.line:hover{background:rgba(255,255,255,.26);border-color:#fff}
.btn.white{background:#fff;color:var(--primary);border-color:#fff}
.btn.white:hover{background:#eff6ff;border-color:#eff6ff;color:var(--primary)}
.edwrap{background:#fff;border:1px solid var(--border);border-top:0;border-radius:0 0 var(--radius) var(--radius);padding:20px 24px 28px}
.sec h3{margin:0 0 14px;font-size:15px;font-weight:600}

.fld .frow{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.fld .grow{flex:1 1 340px;min-width:0}
.fld .fix{flex:0 0 190px;min-width:150px}
.fld label{display:block;margin-bottom:6px;font-size:13px;color:var(--text-2)}
.fld label .req{color:var(--danger)}
.fld .input{width:100%}

.swbar{display:flex;align-items:center;gap:0 10px;flex-wrap:wrap;padding:13px 16px;margin:4px 0 18px;background:#f8fafc;border:1px solid var(--border-2);border-radius:var(--radius)}
.swbar .hint{color:var(--text-3);font-size:12.5px;margin-left:auto}
label.sw{display:inline-flex;align-items:center;gap:9px;cursor:pointer;margin:0 26px 0 0;font-size:13.5px}
label.sw input{position:absolute;opacity:0;width:0;height:0}
label.sw i{width:38px;height:21px;border-radius:11px;background:#cbd5e1;position:relative;transition:.15s;flex:0 0 38px;display:inline-block}
label.sw i:after{content:'';position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.15s}
label.sw input:checked + i{background:var(--primary)}
label.sw input:checked + i:after{left:19px}
label.sw input:focus-visible + i{box-shadow:0 0 0 3px rgba(59,130,246,.25)}

.tbar{position:sticky;top:64px;z-index:24;background:#fff;border-bottom:1px solid var(--border-2);padding:12px 24px 10px;margin:0 -24px 8px}
.tbar .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tbar .top h3{margin:0}
.tbar .top .hint{color:var(--text-3);font-size:12.5px}
.tbar .top .right{margin-left:auto;display:flex;gap:8px}
.chips{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chips .lbl{color:var(--text-2);font-size:13px;margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip i{font-style:normal;color:var(--text-3);font-size:12.5px;min-width:13px;text-align:center}
.chip:hover i{color:var(--primary)}
.insnote{display:flex;align-items:center;gap:10px;margin-top:10px;padding:7px 12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius);color:var(--text-2);font-size:13px}
.insnote button{background:none;border:0;color:var(--primary);cursor:pointer;padding:0}
.insnote button:hover{text-decoration:underline}

.blk{border:1px solid var(--border);border-radius:var(--radius);background:#fff}
.blk.flash{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.blk-h{display:flex;align-items:center;gap:9px;padding:8px 10px 8px 12px;background:#f8fafc;border-radius:var(--radius) var(--radius) 0 0;border-bottom:1px solid var(--border-2)}
.blk.fold .blk-h{border-bottom:0;border-radius:var(--radius)}
.blk.fold .blk-c{display:none}
.dot{width:7px;height:7px;border-radius:50%;background:var(--success);flex:0 0 7px}
.dot.gray{background:#cbd5e1}
.badge{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--text-2);background:#f1f5f9;padding:2px 7px;border-radius:3px;white-space:nowrap}
.blk-h input.tt{flex:1;min-width:60px;border:0;background:transparent;font-weight:600;outline:none;padding:4px 5px;border-radius:4px}
.blk-h input.tt:focus{background:#fff;box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.tools{display:flex;gap:2px}
.tools button{width:26px;height:26px;border:0;background:none;border-radius:4px;color:var(--text-3);cursor:pointer;line-height:1}
.tools button:hover{background:#f1f5f9;color:var(--primary)}
.tools button:disabled{opacity:.28;cursor:not-allowed}
.tools button:disabled:hover{background:none;color:var(--text-3)}
.tools button.x:hover{background:#fef2f2;color:var(--danger)}
.blk-c{padding:14px}
.blk-c label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px}
.blk-c .input{width:100%}
.brow{display:flex;gap:14px;flex-wrap:wrap}
.brow > div{flex:1 1 220px;min-width:0}
.brow > div.narrow{flex:0 0 180px}
.brow > div.mini{flex:0 0 140px}
.opt{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.opt input[type=text]{flex:1}
.opt .kill{color:var(--text-3);cursor:pointer;border:0;background:none;padding:2px 6px;border-radius:4px}
.opt .kill:hover{color:var(--danger);background:#fef2f2}
.filepick{display:flex;align-items:center;gap:10px;min-height:34px}
.filepick input[type=file]{font-size:12.5px;max-width:100%}
.swline{display:flex;align-items:center;gap:0 8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border)}
.pct{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2)}
.pct input{width:80px;text-align:center}
.pct.off{opacity:.42;pointer-events:none}

.rt{display:flex;gap:3px;flex-wrap:wrap;border:1px solid var(--border);border-bottom:0;border-radius:var(--radius) var(--radius) 0 0;padding:6px;background:#f8fafc}
.rt button{min-width:28px;height:28px;border:0;background:none;border-radius:4px;cursor:pointer;color:var(--text-2);padding:0 7px}
.rt button:hover{background:#eff6ff;color:var(--primary)}
.rt .sep{width:1px;background:var(--border);margin:4px 3px}
.rte{border:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);padding:12px 14px;min-height:130px;outline:none;line-height:1.65}
.rte:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,130,246,.15)}
.rte p{margin:0 0 10px}
.rte h3{font-size:16px;margin:0 0 8px}
.rte h4{font-size:14.5px;margin:0 0 8px}
.rte ul,.rte ol{margin:0 0 10px;padding-left:22px}
.rte blockquote{margin:0 0 10px;padding-left:12px;border-left:3px solid var(--border);color:var(--text-2)}

.ins{height:26px;display:flex;align-items:center;justify-content:center;position:relative}
.ins:before{content:'';position:absolute;left:0;right:0;top:50%;border-top:1px dashed #cbd5e1;opacity:0;transition:opacity .12s}
.ins button{position:relative;background:#fff;border:1px dashed #cbd5e1;color:var(--text-2);border-radius:20px;font-size:12.5px;padding:2px 12px;cursor:pointer;opacity:.34;transition:opacity .12s}
.ins:hover:before{opacity:1}
.ins:hover button,.ins button:focus{opacity:1;color:var(--primary);border-color:var(--primary)}
.ins.at:before{opacity:1;border-color:var(--primary)}
.ins.at button{opacity:1;color:#fff;background:var(--primary);border-style:solid;border-color:var(--primary)}

.toc{position:fixed;z-index:50;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(15,23,42,.16);width:400px;max-height:66vh;display:flex;flex-direction:column}
.toc .hd{padding:11px 14px;border-bottom:1px solid var(--border-2);color:var(--text-3);font-size:12.5px}
.toc .ls{overflow:auto;padding:5px 0}
.toc .ls button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:8px 14px;cursor:pointer;text-align:left}
.toc .ls button:hover{background:#eff6ff}
.toc .ls .n{color:var(--text-3);width:16px;flex:0 0 16px;font-size:12.5px}
.toc .ls .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.toc .ft{display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--border-2)}
.toc .none{padding:20px 14px;color:var(--text-3);text-align:center;font-size:13px}

/* ---- xem trước ---- */
.preview{width:80vw;max-width:none;height:84vh;max-height:none;padding:0;display:flex;flex-direction:column}
.pv-head{padding:18px 26px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:16px}
.pv-head h3{margin:0;font-size:20px}
.pv-head .meta{color:var(--text-3);font-size:13px;margin-top:6px}
.pv-body{flex:1;overflow:auto;padding:22px 26px;background:#f8fafc}
.pv-foot{padding:14px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;align-items:center;flex-wrap:wrap}

<body>

<div id="listView"></div>
<div id="detailView" style="display:none"></div>
<div id="sessionView" style="display:none"></div>
<div id="surveyView" style="display:none"></div>

<div class="mask" id="mask"><div class="box" id="box"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- cây chương trình đào tạo đã gắn học phần ---------- */
var PROGRAMS = [
  {code:'CT-ENG', name:'Tiếng Anh giao tiếp', parent:null},
  {code:'GD-01', name:'Giai đoạn nền tảng', parent:'CT-ENG'},
  {code:'GT-A1', name:'Giao tiếp A1', parent:'GD-01', credit:2, lessons:12},
  {code:'GT-A2', name:'Giao tiếp A2', parent:'GD-01', credit:2, lessons:12},
  {code:'GD-02', name:'Giai đoạn củng cố', parent:'CT-ENG'},
  {code:'GT-B1', name:'Giao tiếp B1', parent:'GD-02', credit:3, lessons:16},
  {code:'GT-B2', name:'Giao tiếp B2', parent:'GD-02', credit:3, lessons:16},
  {code:'CT-IELTS', name:'Luyện thi IELTS', parent:null},
  {code:'IE-01', name:'Nền tảng', parent:'CT-IELTS'},
  {code:'IELTS-F', name:'IELTS Foundation', parent:'IE-01', credit:3, lessons:8},
  {code:'IELTS-55', name:'IELTS 5.5', parent:'IE-01', credit:3, lessons:20},
  {code:'IE-02', name:'Chuyên sâu', parent:'CT-IELTS'},
  {code:'IELTS-65', name:'IELTS 6.5', parent:'IE-02', credit:4, lessons:20},
  {code:'IELTS-70', name:'IELTS 7.0+', parent:'IE-02', credit:4, lessons:24},
  {code:'CT-BIZ', name:'Tiếng Anh doanh nghiệp', parent:null},
  {code:'BZ-01', name:'Kỹ năng công sở', parent:'CT-BIZ'},
  {code:'BE-01', name:'Business English', parent:'BZ-01', credit:3, lessons:10},
  {code:'BE-02', name:'Email & Report Writing', parent:'BZ-01', credit:2, lessons:8},
  {code:'BZ-02', name:'Kỹ năng trình bày', parent:'CT-BIZ'},
  {code:'BE-03', name:'Presentation Skills', parent:'BZ-02', credit:2, lessons:8},
  {code:'CT-TOEIC', name:'Luyện thi TOEIC', parent:null},
  {code:'TO-01', name:'Cấp tốc', parent:'CT-TOEIC'},
  {code:'TOEIC-450', name:'TOEIC 450+', parent:'TO-01', credit:3, lessons:24},
  {code:'TOEIC-650', name:'TOEIC 650+', parent:'TO-01', credit:3, lessons:24}
];
const prog = c => PROGRAMS.find(p=>p.code===c);
const pKids = c => PROGRAMS.filter(p=>(p.parent||null)===(c||null));
const pLevel = c => { let d=0,x=prog(c); while(x&&x.parent){ d++; x=prog(x.parent); } return d+1; };
function pPath(c){ const out=[]; let x=prog(c); while(x){ out.unshift(x.name); x = x.parent? prog(x.parent):null; } return out; }
const LVNAME = ['','Chương trình','Khối kiến thức','Học phần'];
function gcd(a, b){ b = Math.round(b); while(b){ const t = a % b; a = b; b = t; } return Math.abs(a) || 1; }
function coefFormula(comps){
  const sum = comps.reduce((a,x)=>a+x.weight, 0);
  const body = comps.map(x=>{
    const n = x.name.length > 16 ? x.name.slice(0,16)+'…' : x.name;
    return x.weight === 1 ? n : n+' × '+x.weight;
  }).join(' + ');
  return 'Tổng kết = ( '+body+' ) ÷ '+sum;
}
function progLessons(code){
  if(!code) return null;
  const p = prog(code); if(!p) return null;
  const kids = pKids(code);
  if(!kids.length) return p.lessons || 0;
  return kids.reduce((a,x)=>a + (progLessons(x.code)||0), 0);
}
function progModules(code){
  if(!code) return 0;
  const kids = pKids(code);
  if(!kids.length) return 1;
  return kids.reduce((a,x)=>a + progModules(x.code), 0);
}
function progCell(c){
  if(!c) return '<span style="color:var(--text-3)">Chưa gắn chương trình</span>';
  const p = prog(c); if(!p) return esc(c);
  return esc(p.name)+' <span class="cd" style="color:var(--text-3)">· '+esc(c)+'</span>';
}

/* ---------- cây chương trình đào tạo dùng chung ---------- */
function noAcc(x){
  return String(x==null?'':x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0111/g,'d');
}
function pMatch(code, q){ const p = prog(code); return p ? noAcc(p.name+' '+p.code).indexOf(q) >= 0 : false; }
function pSubMatch(code, q){ return pMatch(code,q) || pKids(code).some(k=>pSubMatch(k.code,q)); }
function hiText(txt, q){
  if(!q) return esc(txt);
  const i = noAcc(txt).indexOf(q);
  if(i < 0) return esc(txt);
  return esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+q.length))+'</mark>'+esc(txt.slice(i+q.length));
}
function treeBar(st, ph){
  return '<div class="treebar">'+
    '<input class="input" data-tq placeholder="'+esc(ph||'Lọc theo tên hoặc mã chương trình đào tạo')+'" value="'+esc(st.q||'')+'">'+
    '<button type="button" class="lk" data-tall="1">Bung tất cả</button><span class="sep">|</span>'+
    '<button type="button" class="lk" data-tall="0">Thu gọn tất cả</button></div>';
}
function progTree(st, opts){
  opts = opts || {};
  const q = noAcc((st.q||'').trim());
  let rows = '', found = 0;
  if(!q && opts.blank !== false){
    rows += '<div class="nd'+(st.prog===''?' sel':'')+'" data-p=""><span class="fold"></span>'+
      '<input type="radio"'+(st.prog===''?' checked':'')+'><span>Chưa gắn chương trình, bổ sung sau</span></div>';
  }
  (function walk(parent, d, forced){
    pKids(parent).forEach(p=>{
      const self = !q || pMatch(p.code, q);
      if(q && !forced && !self && !pSubMatch(p.code, q)) return;
      const kids = pKids(p.code);
      const open = q ? true : st.fold[p.code] !== true;
      found++;
      rows += '<div class="nd d'+Math.min(d,3)+(st.prog===p.code?' sel':'')+'" data-p="'+esc(p.code)+'">'+
        '<span class="fold"'+(kids.length && !q ? ' data-fold="'+esc(p.code)+'"' : '')+'>'+
          (kids.length ? (open?'▾':'▸') : '')+'</span>'+
        '<input type="radio"'+(st.prog===p.code?' checked':'')+'>'+
        '<span class="cd">'+hiText(p.code, q)+'</span><span>'+hiText(p.name, q)+'</span>'+
        '<span class="meta">'+(kids.length ? kids.length+' mục con · '+progLessons(p.code)+' bài học'
          : p.credit+' tín chỉ · '+p.lessons+' bài học')+'</span></div>';
      if(open) walk(p.code, d+1, forced || self);
    });
  })(null, 1, false);
  if(!found && q) rows = '<div class="none">Không có chương trình nào khớp với “'+esc(st.q)+'”</div>';
  return '<div class="tree">'+rows+'</div>';
}
function bindProgTree(rootId, st, onPick){
  const root = F(rootId); if(!root) return;
  const box = root.querySelector('[data-treebox]'); if(!box) return;
  function bindRows(){
    box.querySelectorAll('.nd').forEach(nd=>{
      nd.onclick = e=>{
        const fd = e.target.closest('[data-fold]');
        if(fd){ st.fold[fd.dataset.fold] = st.fold[fd.dataset.fold] !== true; redraw(); return; }
        st.prog = nd.dataset.p; redraw(); if(onPick) onPick();
      };
    });
  }
  function redraw(){ box.innerHTML = progTree(st); bindRows(); }
  const qi = root.querySelector('[data-tq]');
  if(qi) qi.oninput = ()=>{ st.q = qi.value; redraw(); };
  root.querySelectorAll('[data-tall]').forEach(b=>{
    b.onclick = ()=>{
      st.fold = {};
      if(b.dataset.tall === '0') PROGRAMS.forEach(p=>{ if(pKids(p.code).length) st.fold[p.code] = true; });
      redraw();
    };
  });
  bindRows();
}
function progPickNote(code){
  if(!code) return 'Chọn được ở cấp chương trình, khối kiến thức hoặc từng học phần. Bỏ qua nếu lớp gắn nội dung sau.';
  const path = pPath(code);
  return 'Đã chọn <b>'+esc(path[path.length-1])+'</b> ở cấp '+LVNAME[pLevel(code)].toLowerCase()+
    ' · '+progModules(code)+' học phần · '+progLessons(code)+' bài học · đường dẫn: '+esc(path.join(' › '));
}

/* ---------- danh mục ---------- */
var CENTERS = [
  {id:'ego', name:'Cơ sở Nguyễn Thị Minh Khai'},
  {id:'ego-hn', name:'Cơ sở Hà Nội'},
  {id:'ego-hcm', name:'Cơ sở Thủ Đức'},

var menuEl = null;

function place(el, btn){
  const r = btn.getBoundingClientRect(), w = el.offsetWidth, hh = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  el.style.top  = (r.bottom + hh + 8 > innerHeight ? Math.max(8, r.top - hh - 6) : r.bottom + 6) + 'px';
}
function popMenu(btn, items){
  const was = btn.classList.contains('on');
  closeMenu(); if(was) return;
  btn.classList.add('on');
  menuEl = document.createElement('div');
  menuEl.className = 'menu';
  menuEl.innerHTML = items.map((it,i)=> it.sep ? '<hr>' :
    '<button data-i="'+i+'"'+(it.danger?' class="del"':'')+'>'+esc(it.label)+'</button>').join('');
  document.body.appendChild(menuEl);
  place(menuEl, btn);
  menuEl.onclick = e=>e.stopPropagation();
  menuEl.querySelectorAll('button').forEach(b=>{ b.onclick = ()=>{ const it = items[+b.dataset.i]; closeMenu(); it.fn(); }; });
}

var DOC1 = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function doc3(n, full){
  const tr = Math.floor(n/100), ch = Math.floor(n%100/10), dv = n%10;
  let r = '';
  if(tr || full) r += DOC1[tr]+' trăm';
  if(ch > 1){ r += ' '+DOC1[ch]+' mươi'; if(dv===1) r += ' mốt'; else if(dv===5) r += ' lăm'; else if(dv) r += ' '+DOC1[dv]; }
  else if(ch === 1){ r += ' mười'; if(dv===5) r += ' lăm'; else if(dv) r += ' '+DOC1[dv]; }
  else if(dv) r += (tr||full? ' lẻ ':' ')+DOC1[dv];
  return r.trim();
}
function docTien(n){
  if(!n) return 'Không đồng';
  const dv = ['',' nghìn',' triệu',' tỷ'];
  const parts = []; let i = 0, x = Math.round(n);
  while(x > 0){ parts.unshift({v:x%1000, i:i}); x = Math.floor(x/1000); i++; }
  const r = parts.map((p,k)=> p.v===0 ? '' : doc3(p.v, k>0)+dv[p.i]).filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
  return r.charAt(0).toUpperCase()+r.slice(1)+' đồng';
}
var LETTERS = [['A+',4],['A',3.7],['A-',3.5],['B+',3.3],['B',3],['B-',2.7],['C+',2.3],['C',2],['C-',1.7],['D+',1.3],['D',1],['F',0]];
var SCALES = {'10':{label:'Thang điểm 10', max:10, unit:'thang 10'},
              '5':{label:'Thang điểm 5', max:5, unit:'thang 5'},
              'letter':{label:'Hệ chữ A+ … F', max:4, unit:'hệ chữ'}};
var MODES = {weight:'Trọng số phần trăm', coef:'Hệ số'};
const gScale = c => SCALES[(c.gradeCfg.scale)||'10'];
const gMax = c => gScale(c).max;
const isLetter = c => (c.gradeCfg.scale||'10') === 'letter';
const letterOf = v => { for(let i=0;i<LETTERS.length;i++) if(v >= LETTERS[i][1]-0.0001) return LETTERS[i][0]; return 'F'; };
const valOf = l => { const x = LETTERS.find(y=>y[0]===l); return x? x[1] : null; };
function showScore(c, v){
  if(v == null) return null;
  return isLetter(c) ? letterOf(v)+' <span style="color:var(--text-3);font-weight:400">('+v.toFixed(2)+')</span>' : (Math.round(v*100)/100);
}
const plainScore = (c,v) => v==null? '' : (isLetter(c)? letterOf(v)+' ('+v.toFixed(2)+')' : Math.round(v*100)/100);
const showPass = c => isLetter(c)? letterOf(c.gradeCfg.passScore) : c.gradeCfg.passScore+' / '+gMax(c);
const actives = c => c.students.filter(s=>s.status==='Đang học');
const STU_ST = ['Đang học','Chuyển lớp','Thôi học'];
function attRate(c){
  if(!c.attendance) return null;
  let tot=0, ok=0;
  const ids = actives(c).map(x=>x.id);
  doneSes(c).forEach(s=>ids.forEach(id=>{ const v = s.att[id]; if(v){ tot++; if(v==='P'||v==='L') ok++; } }));
  return tot? Math.round(ok*100/tot) : null;
}
function stuAtt(c, id){
  const ls = doneSes(c).filter(s=>s.att[id]!=null);
  if(!ls.length) return null;
  return Math.round(ls.filter(s=>s.att[id]==='P'||s.att[id]==='L').length*100/ls.length);
}
function stuScore(c, id){
  if(!c.grading) return null;
  const g = c.grades[id]||{}; let sum=0, w=0;
  const mx = gMax(c);
  c.gradeCfg.comps.forEach(cp=>{
    let v = null;
    if(cp.src==='att'){ const a = stuAtt(c,id); v = a==null? null : a/100*mx; }
    else if(g[cp.id]!=null) v = g[cp.id];
    if(v!=null){ sum += v*cp.weight; w += cp.weight; }
  });
  return w? Math.round(sum/w*100)/100 : null;
}
function certOK(c, id){
  if(c.nature==='hoc') return null;
  const s = stuScore(c,id), a = stuAtt(c,id);
  if(s==null) return false;
  return s >= c.gradeCfg.passScore && (c.attendance ? (a!=null && a >= c.cert.minAtt) : true);
}

  if(d < 0) return '<span class="tag off">Đã kết thúc</span>';
  if(dLeft(c.start) > 0) return '<span class="tag trial" style="margin:0">Chưa khai giảng</span>';
  return '<span class="tag on">Còn '+d+' ngày</span>';
}

  if(c.status === 'learning') rs.push('lớp đang học');
  if(rs.length){ L.prog = true; L.why.push('Không đổi được chương trình đào tạo vì '+rs.join(', ')+'. Muốn đổi nội dung học thì mở lớp mới.'); }

  if(taught){ L.learn = true; L.why.push('Không đổi được loại học tập vì lớp đã dạy '+taught+' buổi và đã có dữ liệu điểm danh.'); }
  else if(stu && c.status === 'learning'){ L.learn = true; L.why.push('Không đổi được loại học tập khi lớp đang học và đã có học viên.'); }
  if(scored){ L.grade = true; L.why.push('Không tắt được tính điểm học phần vì đã nhập điểm cho '+scored+' học viên.'); }
  if(paid){ L.fee = true; L.why.push('Không tắt được thu phí khoá học vì đã ghi nhận '+paid+' học viên nộp phí.'); }
  if(stu) L.why.push('Sức chứa tối đa không được đặt nhỏ hơn '+actives(c).length+' học viên đang học.');
  return L;
}

/* ---------- form thông tin lớp dùng chung ---------- */
var FT = [], ftOpen = false;
function classFields(c, bare){
  FT = (c.teachers && c.teachers.length) ? c.teachers.slice() : [];
  ftOpen = false;
  const hint = (h, id) => bare ? '' : '<div class="note"'+(id?' id="'+id+'"':'')+'>'+h+'</div>';
  return '<div class="form">'+
    '<div><label>Mã lớp</label><input class="input" id="iCode" value="'+esc(c.code||'')+'" placeholder="Bỏ trống để hệ thống tự sinh"></div>'+
    '<div><label>Tên lớp <span class="req">*</span></label><input class="input" id="iName" value="'+esc(c.name||'')+'" placeholder="VD: IELTS 6.5 K15">'+
      '<div class="warn" id="wName">Nhập tên lớp</div></div>'+
    '<div><label>Cơ sở / Trung tâm</label><select class="input" id="iCenter">'+
      CENTERS.map(x=>'<option value="'+esc(x.id)+'"'+(c.center===x.id?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></div>'+
    '<div><label>Loại học tập</label><select class="input" id="iLearn">'+
      Object.keys(LEARN).map(k=>'<option value="'+k+'"'+(c.learn===k?' selected':'')+'>'+esc(LEARN[k].label)+'</option>').join('')+'</select>'+
      hint(esc(LEARN[c.learn||'gv'].note), 'nLearn')+'</div>'+
    '<div><label>Tính chất lớp học</label><select class="input" id="iNature">'+
      Object.keys(NATURE).map(k=>'<option value="'+k+'"'+(c.nature===k?' selected':'')+'>'+esc(NATURE[k])+'</option>').join('')+'</select></div>'+
    '<div><label>Ngày bắt đầu</label><input class="input" type="date" id="iStart" value="'+(c.start||'')+'"></div>'+
    '<div><label>Ngày kết thúc</label><input class="input" type="date" id="iEnd" value="'+(c.end||'')+'">'+
      '<div class="warn" id="wDate">Ngày kết thúc phải sau ngày bắt đầu</div></div>'+
    '<div><label>Sức chứa tối đa</label><input class="input" type="number" min="0" id="iCap" value="'+(c.capacity||0)+'">'+
      hint('Để 0 nếu không giới hạn số học viên')+'</div>'+
    '<div class="wide"><label>Giảng viên phụ trách <span class="req">*</span></label>'+
      '<div id="tWrap">'+teacherPick()+'</div>'+
      '<div class="warn" id="wTeach">Chọn ít nhất một giảng viên phụ trách</div>'+
      hint('Bấm vào ô để chọn thêm hoặc bỏ giảng viên. Bấm lên thẻ giảng viên để đặt làm giảng viên chính, người này được chọn mặc định khi tạo buổi học')+'</div>'+
    '<div class="wide"><div class="swbar">'+
      '<label class="sw"><input type="checkbox" id="iReg"'+(c.allowReg?' checked':'')+'><i></i>Cho phép học viên tự đăng ký</label>'+
      '<label class="sw"><input type="checkbox" id="iGrade"'+(c.grading?' checked':'')+'><i></i>Tính điểm học phần</label>'+
      '<label class="sw"><input type="checkbox" id="iFee"'+(c.fee?' checked':'')+'><i></i>Thu phí khoá học</label>'+
    '</div></div>'+
    '<div class="wide"><label>Ghi chú</label><textarea class="input" id="iNote" rows="2" placeholder="Thông tin nội bộ về lớp, phòng học, đối tác liên kết">'+esc(c.note||'')+'</textarea></div>'+
  '</div>';
}
function teacherPick(){
  return '<div class="msel'+(ftOpen?' open':'')+'" id="tField" tabindex="0">'+
      (FT.length ? FT.map((id,i)=>'<span class="tg'+(i===0?' main':'')+'" data-set="'+id+'" title="Bấm để đặt làm giảng viên chính">'+
          esc(tName(id))+(i===0?' · chính':'')+'<i data-rmt="'+id+'" title="Bỏ chọn">✕</i></span>').join('')
        : '<span class="ph">Chọn giảng viên phụ trách</span>')+
      '<b class="caret">▾</b></div>'+
    (ftOpen ? '<div class="mopts">'+TEACHERS.map(t=>{
        const on = FT.indexOf(t.id) >= 0;
        return '<button type="button" data-tg="'+t.id+'" class="'+(on?'on':'')+'">'+
          '<span class="bx">'+(on?'✓':'')+'</span><span>'+esc(t.name)+'</span>'+
          '<span class="k">'+esc(t.role)+(FT[0]===t.id?' · chính':'')+'</span></button>';
      }).join('')+'</div>' : '');
}
function bindTeacherPick(){
  const wrap = F('tWrap'); if(!wrap) return;
  const redraw = ()=>{ wrap.innerHTML = teacherPick(); bindTeacherPick(); };
  F('tField').onclick = e=>{
    if(e.target.closest('[data-rmt]') || e.target.closest('[data-set]')) return;
    ftOpen = !ftOpen; redraw();
  };
  wrap.querySelectorAll('[data-tg]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const id = b.dataset.tg;
      FT = FT.indexOf(id) >= 0 ? FT.filter(x=>x!==id) : FT.concat([id]);
      if(FT.length && F('wTeach')) F('wTeach').style.display = 'none';
      redraw();
    };
  });
  wrap.querySelectorAll('[data-rmt]').forEach(el=>{
    el.onclick = e=>{ e.stopPropagation(); FT = FT.filter(x=>x!==el.dataset.rmt); redraw(); };
  });
  wrap.querySelectorAll('[data-set]').forEach(el=>{
    el.onclick = e=>{
      e.stopPropagation();
      const id = el.dataset.set;
      FT = [id].concat(FT.filter(x=>x!==id));
      redraw();
    };
  });
}
function bindClassFields(){
  bindTeacherPick();
  F('iLearn').onchange = ()=>{
    if(F('nLearn')) F('nLearn').textContent = LEARN[F('iLearn').value].note;
  };
  F('iNature').onchange = ()=>{
    if(F('iNature').value !== 'hoc' && !F('iGrade').checked) F('iGrade').checked = true;
  };
}
function readClassFields(){
  const f = {code:val('iCode'), name:val('iName'), center:F('iCenter').value, learn:F('iLearn').value,
    nature:F('iNature').value, teachers:FT.slice(), start:F('iStart').value, end:F('iEnd').value,
    capacity:+F('iCap').value||0, allowReg:F('iReg').checked, grading:F('iGrade').checked,
    attendance:LEARN[F('iLearn').value].ses, fee:F('iFee').checked, note:val('iNote')};
  let ok = true;
  F('wName').style.display = f.name ? 'none' : 'block'; if(!f.name) ok = false;
  F('wTeach').style.display = f.teachers.length ? 'none' : 'block'; if(!f.teachers.length) ok = false;
  const bad = f.start && f.end && f.end < f.start;
  F('wDate').style.display = bad ? 'block' : 'none'; if(bad) ok = false;
  return ok ? f : null;
}

/* ---------- mở lớp ---------- */
var WZ = null;
function openWizard(){
  WZ = {step:1, prog:'', fold:{}, q:'', f:{center:'ego', learn:'gv', nature:'hoc', teachers:['gv01'], capacity:0,
    allowReg:false, grading:false, attendance:true, fee:false, start:'', end:'', name:'', code:''}};
  drawWizard();
}
function drawWizard(){
  const names = ['Chọn chương trình','Thông tin lớp','Xác nhận'];
  openBox('<h3>Mở lớp</h3>'+
    '<div class="head-sub">Lớp mở ra từ nội dung của chương trình đào tạo đã gắn học phần</div>'+
    '<div class="steps">'+names.map((n,i)=>{
      const s = i+1, cls = WZ.step===s?' on':(WZ.step>s?' done':'');
      return '<div class="s'+cls+'"><b>'+(WZ.step>s?'✓':s)+'</b>'+esc(n)+'</div>'+(i<2?'<div class="line"></div>':'');
    }).join('')+'</div>'+
    '<div id="wzBody">'+wizardBody()+'</div>'+
    '<div class="foot"><button class="btn ghost" id="wzCancel">Huỷ</button>'+
      (WZ.step>1?'<button class="btn ghost" id="wzBack">Quay lại</button>':'')+
      '<button class="btn" id="wzNext">'+(WZ.step<3?'Tiếp':'Mở lớp')+'</button></div>',
    WZ.step===2 ? 'wide' : '');
  F('wzCancel').onclick = closeBox;
  if(F('wzBack')) F('wzBack').onclick = ()=>{ WZ.step--; drawWizard(); };
  F('wzNext').onclick = wzNext;
  if(WZ.step===1) bindTree();
  if(WZ.step===2) bindClassFields();
}
function wizardBody(){
  if(WZ.step===1){
    return '<div id="wzPick">'+treeBar(WZ)+'<div data-treebox>'+progTree(WZ)+'</div>'+
      '<div class="note" id="wzInfo" style="margin-top:12px">'+progPickNote(WZ.prog)+'</div></div>';
  }
  if(WZ.step===2){
    if(WZ.prog && !WZ.f.name){
      const p = prog(WZ.prog);
      if(pLevel(WZ.prog)===3) WZ.f.name = p.name+' K01';
    }
    return classFields(WZ.f);
  }
  const f = WZ.f, lt = LEARN[f.learn];
  return '<dl class="dl">'+
    '<dt>Tên lớp</dt><dd><b>'+esc(f.name)+'</b>'+(f.code?' · <span class="mono">'+esc(f.code)+'</span>':'')+'</dd>'+
    '<dt>Nội dung học</dt><dd>'+(WZ.prog ? esc(pPath(WZ.prog).join(' › '))+
      ' <span style="color:var(--text-3)">· '+progModules(WZ.prog)+' học phần · '+progLessons(WZ.prog)+' bài học</span>'
      : '<span style="color:var(--text-3)">Chưa gắn chương trình</span>')+'</dd>'+
    '<dt>Cơ sở / Trung tâm</dt><dd>'+esc(cenName(f.center))+'</dd>'+
    '<dt>Loại học tập</dt><dd>'+esc(lt.label)+'</dd>'+
    '<dt>Tính chất</dt><dd>'+esc(NATURE[f.nature])+(f.nature!=='hoc'?' · điều kiện xét cấp đặt trong cấu hình cột điểm':'')+'</dd>'+
    '<dt>Thời gian</dt><dd>'+fmtD(f.start)+' → '+fmtD(f.end)+'</dd>'+
    '<dt>Giảng viên phụ trách</dt><dd>'+f.teachers.map((id,i)=>esc(tName(id))+(i===0&&f.teachers.length>1?' (chính)':'')).join(', ')+'</dd>'+
    '<dt>Sức chứa</dt><dd>'+(f.capacity? f.capacity+' học viên' : 'Không giới hạn')+'</dd>'+
    '<dt>Đăng ký</dt><dd>'+(f.allowReg?'Học viên tự đăng ký, quản trị viên duyệt':'Chỉ quản trị viên thêm học viên')+'</dd>'+
    '<dt>Tính điểm học phần</dt><dd>'+(f.grading?'Có, mở tab Điểm theo cấu hình cột điểm':'Không')+'</dd>'+
    '<dt>Thu phí khoá học</dt><dd>'+(f.fee?'Có, mở tab Kế hoạch thu và ghi nhận công nợ học viên':'Không thu phí')+'</dd>'+
    '<dt>Buổi học</dt><dd>'+(lt.ses ? 'Có lịch buổi học và điểm danh theo từng buổi' : 'Không mở buổi học, không điểm danh')+'</dd>'+
  '</dl><div class="note" style="margin-top:14px">Các thông tin này đều sửa lại được trong tab Thông tin lớp sau khi mở.</div>';
}
function bindTree(){
  bindProgTree('wzPick', WZ, ()=>{ if(F('wzInfo')) F('wzInfo').innerHTML = progPickNote(WZ.prog); });
}
function wzNext(){
  if(WZ.step===1){ WZ.step=2; drawWizard(); return; }
  if(WZ.step===2){
    const f = readClassFields(); if(!f){ toast('Kiểm tra lại các trường bắt buộc'); return; }
    WZ.f = Object.assign(WZ.f, f);
    WZ.step=3; drawWizard(); return;
  }
  const f = WZ.f;
  const c = {code: f.code || ('L'+(1000+CLASSES.length)), name:f.name, prog:WZ.prog, center:f.center,
    learn:f.learn, nature:f.nature, start:f.start||iso(TODAY), end:f.end||iso(addD(TODAY,90)),
    status:'plan', capacity:f.capacity, allowReg:f.allowReg, grading:f.grading,
    attendance:LEARN[f.learn].ses, cert:{minScore:5, minAtt:80}, note:f.note, teachers:f.teachers.slice(),
    fee:f.fee, feePlan:[],
    students:[], sessions:[], grades:{}, gradeCfg:defGrade(), surveys:[], notices:[], regs:[], moves:[], updated:fmtD(iso(TODAY))};
  CLASSES.unshift(c);
  closeBox(); toast('Đã mở lớp '+c.name);
  openClass(c.code, 'students');
}

/* ---------- chi tiết lớp ---------- */
function tabsOf(c){
  const t = [['info','Thông tin lớp'], ['students','Học viên ('+c.students.length+')']];
  if(LEARN[c.learn].ses) t.push(['sessions', 'Buổi học và điểm danh ('+c.sessions.length+')']);
  t.push(['grades','Điểm']);
  if(c.fee) t.push(['fees','Kế hoạch thu ('+c.feePlan.length+')']);
  t.push(['surveys','Khảo sát ('+c.surveys.length+')'],
    ['teachers','Giảng viên ('+c.teachers.length+')'], ['notices','Thông báo ('+c.notices.length+')']);
  if(canSelfReg(c) || c.regs.length) t.push(['regs','Đăng ký học ('+c.regs.filter(r=>r.status==='Chờ duyệt').length+')']);
  return t;
}
function drawDetail(){
  const c = get(current);
  if(!c){ backToList(); return; }
  const tabs = tabsOf(c);
  if(!tabs.some(t=>t[0]===tab)) tab = 'info';
  const body = {info:tabInfo, students:tabStudents, sessions:tabSessions, grades:tabGrades, fees:tabFees,
    surveys:tabSurveys, teachers:tabTeachers, notices:tabNotices, regs:tabRegs}[tab](c);

  F('detailView').innerHTML =
    '<button class="back" id="dBack">‹ Quay lại danh sách lớp</button>'+
    '<div class="panel">'+
      '<div class="panel-head">'+
        '<div><h2>'+esc(c.name)+'</h2>'+
        '<p><span class="mono">'+esc(c.code)+'</span> · '+esc(cenName(c.center))+' · '+esc(LEARN[c.learn].label)+
          ' · '+fmtD(c.start)+' → '+fmtD(c.end)+'</p></div>'+
        '<div class="right">'+tagStatus(c)+
          '<button class="btn ghost" id="dToggle">Chuyển trạng thái</button></div>'+
      '</div>'+
      '<div class="tabs">'+tabs.map(t=>'<button data-tab="'+t[0]+'"'+(tab===t[0]?' class="on"':'')+'>'+esc(t[1])+'</button>').join('')+'</div>'+
      '<div id="tabBody">'+body+'</div>'+
    '</div>';
  F('dBack').onclick = backToList;
  F('dToggle').onclick = ()=>classStatusBox(c);
  F('detailView').querySelectorAll('.tabs button').forEach(b=>{
    b.onclick = ()=>{ tab = b.dataset.tab; drawDetail(); };
  });
  const bind = {info:bindInfo, students:bindStudents, sessions:bindSessions, grades:bindGrades, fees:bindFees,
    surveys:bindSurveys, teachers:bindTeachers, notices:bindNotices, regs:bindRegs}[tab];
  if(bind) bind(c);
}

/* ---------- tab Thông tin lớp ---------- */
function tabInfo(c){
  const done = doneSes(c).length, ar = attRate(c);
  const scored = actives(c).filter(s=>stuScore(c,s.id)!=null);
  const passed = scored.filter(s=>stuScore(c,s.id) >= c.gradeCfg.passScore).length;
  return '<div class="stat">'+
      '<div><span>Học viên đang học</span><b>'+actives(c).length+'</b></div>'+
      '<div><span>Bài học chương trình</span><b>'+(progLessons(c.prog)==null? '—' : progLessons(c.prog))+'</b></div>'+
      '<div><span>Buổi đã dạy</span><b>'+(LEARN[c.learn].ses ? done+' / '+c.sessions.length : '—')+'</b></div>'+
      '<div><span>Chuyên cần</span><b>'+(ar==null?'—':ar+'%')+'</b></div>'+
      '<div><span>Đạt trên số đã có điểm</span><b>'+(c.grading ? passed+' / '+scored.length : '—')+'</b></div>'+
      '<div><span>Khảo sát đang mở</span><b>'+c.surveys.filter(s=>s.published && s.end >= iso(TODAY)).length+'</b></div>'+
      '<div><span>Cập nhật</span><b style="font-size:14px">'+esc(c.updated)+'</b></div>'+
    '</div>'+
    infoHelp(c)+
    '<div class="form" style="margin:16px 0">'+progField(c)+'</div>'+
    classFields(c, true)+
    '<div class="rowbar"><span class="right"><button class="btn" id="iSave">Lưu thông tin</button></span></div>';
}
var helpOpen = false;
function infoHelp(c){
  const L = classLocks(c);
  const notes = [
    'Loại học tập: '+esc(LEARN[c.learn].note)+'. Đổi loại học tập sẽ bật, tắt tab buổi học và điểm danh của lớp.',
    'Chương trình đào tạo: chọn được ở cấp chương trình, khối kiến thức hoặc từng học phần. Gõ vào ô lọc để tìm nhanh theo tên hoặc mã.',
    'Sức chứa tối đa: để 0 nếu không giới hạn số học viên.',
    'Giảng viên phụ trách: bấm vào ô để chọn thêm hoặc bỏ giảng viên. Bấm lên thẻ giảng viên để đặt làm giảng viên chính, người này được chọn mặc định khi tạo buổi học.',
    'Tính điểm học phần và thu phí khoá học bật, tắt tab Điểm và tab Kế hoạch thu tương ứng.'
  ];
  if(!LEARN[c.learn].ses) notes.unshift('Lớp không mở buổi học nên không có tab buổi học và điểm danh. Đổi loại học tập nếu lớp cần dạy theo lịch.');
  return '<div class="helprow">'+
      '<button class="qbtn'+(L.why.length?' alert':'')+(helpOpen?' on':'')+'" id="iHelp" '+
      'title="'+(L.why.length? L.why.length+' ràng buộc đang áp dụng, bấm để xem' : 'Xem ghi chú các trường')+'">?</button></div>'+
    '<div class="helpbox" id="iHelpBox" style="display:'+(helpOpen?'block':'none')+'">'+
      (L.why.length ? '<b class="hd rb">Ràng buộc đang áp dụng cho lớp này</b><ul>'+
        L.why.map(w=>'<li class="rb">'+w+'</li>').join('')+'</ul>' : '')+
      '<b class="hd">Ghi chú các trường</b><ul>'+notes.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>';
}
var PT = {prog:'', fold:{}, q:''};
function progField(c){
  const L = classLocks(c);
  if(L.prog){
    return '<div class="wide"><label>Chương trình đào tạo</label>'+
      '<div class="input ro">'+(c.prog ? esc(pPath(c.prog).join(' › '))+' · '+esc(c.prog) : 'Chưa gắn chương trình')+'</div></div>';
  }
  PT = {prog: c.prog || '', fold:{}, q:''};
  PROGRAMS.forEach(p=>{ if(pKids(p.code).length) PT.fold[p.code] = true; });
  if(c.prog){ let x = prog(c.prog); while(x){ PT.fold[x.code] = false; x = x.parent ? prog(x.parent) : null; } }
  return '<div class="wide" id="pgPick"><label>Chương trình đào tạo</label>'+
    treeBar(PT)+'<div data-treebox>'+progTree(PT)+'</div>'+
    '<div class="note" id="pgInfo" style="margin-top:10px">'+progPickNote(PT.prog)+'</div></div>';
}
function bindInfo(c){
  bindClassFields();
  F('iHelp').onclick = ()=>{
    helpOpen = !helpOpen;
    F('iHelpBox').style.display = helpOpen ? 'block' : 'none';
    F('iHelp').classList.toggle('on', helpOpen);
  };
  const L = classLocks(c);
  if(!L.prog) bindProgTree('pgPick', PT, ()=>{ if(F('pgInfo')) F('pgInfo').innerHTML = progPickNote(PT.prog); });
  if(L.learn) F('iLearn').disabled = true;
  if(L.grade){ F('iGrade').disabled = true; F('iGrade').parentNode.classList.add('dis'); }
  if(L.fee){ F('iFee').disabled = true; F('iFee').parentNode.classList.add('dis'); }
  if(L.all){
    F('tabBody').querySelectorAll('input,select,textarea').forEach(el=>{ el.disabled = true; });
    const tw = F('tWrap'); if(tw) tw.style.pointerEvents = 'none';
    F('iSave').disabled = true;
  }
  F('iSave').onclick = ()=>{
    if(L.all){ toast('Lớp đã kết thúc, không sửa thông tin lớp được'); return; }
    const f = readClassFields();
    if(!f){ toast('Kiểm tra lại các trường bắt buộc'); return; }
    const min = actives(c).length;
    if(f.capacity && f.capacity < min){ toast('Sức chứa không được nhỏ hơn '+min+' học viên đang học'); return; }
    if(L.learn) f.learn = c.learn;
    if(L.grade) f.grading = c.grading;
    if(L.fee) f.fee = c.fee;
    f.attendance = LEARN[f.learn].ses;
    const oldCode = c.code;
    Object.assign(c, f, {prog: L.prog ? c.prog : PT.prog, teachers:f.teachers.slice()});
    if(!c.code) c.code = oldCode;
    c.updated = fmtD(iso(TODAY));
    current = c.code;
    toast('Đã lưu thông tin lớp'); drawDetail();
  };
}

function applyPlanTo(c, arr){
  arr.forEach(st=>{
    const old = st.debt || newDebt(c);
    const nd = newDebt(c);
    nd.pays = old.pays; nd.removed = old.removed; nd.link = old.link;
    nd.items.forEach(it=>{
      const was = (old.items||[]).find(x=>x.code===it.code && x.paid);
      if(was){ it.paid = true; it.payId = was.payId; it.amount = was.amount; }
    });
    (old.items||[]).filter(x=>x.paid && !nd.items.some(y=>y.code===x.code)).forEach(x=>nd.items.push(x));
    st.debt = nd;
  });
}
function clearDebtBox(c, arr){
  const n = arr.reduce((a,x)=>a + debtItems(x).filter(i=>!i.paid).length, 0);
  const money = arr.reduce((a,x)=>a + debtDue(x), 0);
  if(!n){ toast('Các học viên đã chọn không còn khoản nào chưa thu'); return; }
  openBox('<h3>Xoá toàn bộ công nợ</h3>'+
    '<div class="head-sub">'+(arr.length===1 ? esc(arr[0].name)+' · '+esc(arr[0].code) : arr.length+' học viên đã chọn')+'</div>'+
    '<div class="alert">Bỏ '+n+' khoản chưa thu, tương ứng '+vnd(money)+' ra khỏi công nợ. '+
      'Các khoản đã thu và biên lai vẫn giữ nguyên để đối chiếu.</div>'+
    '<div class="field"><label>Lý do</label>'+
      '<input class="input" id="cdReason" placeholder="VD: suất học tài trợ, học lại theo cam kết đầu ra"></div>'+
    '<div class="foot"><button class="btn ghost" id="cdNo">Huỷ</button>'+
      '<button class="btn danger" id="cdOk">Xoá công nợ</button></div>');
  F('cdNo').onclick = closeBox;
  F('cdOk').onclick = ()=>{
    const reason = val('cdReason');
    arr.forEach(st=>{
      if(!st.debt) return;
      debtItems(st).filter(x=>!x.paid).forEach(x=>st.debt.removed.push({name:x.name, amount:x.amount, at:iso(TODAY), reason:reason}));
      st.debt.items = debtItems(st).filter(x=>x.paid);
      st.debt.link = null;
    });
    stuSel = [];
    closeBox(); toast('Đã xoá công nợ của '+arr.length+' học viên'); drawDetail();
  };
}
function bindStudents(c){
  const selNodes = F('tabBody').querySelectorAll('.selStu');
  selNodes.forEach(el=>{
    el.onchange = ()=>{
      stuSel = el.checked ? stuSel.concat([el.value]) : stuSel.filter(x=>x!==el.value);
      redrawTab();
    };
  });
  if(F('selAll')) F('selAll').onchange = ()=>{
    const ids = [].slice.call(selNodes).map(x=>x.value);
    stuSel = F('selAll').checked ? Array.from(new Set(stuSel.concat(ids))) : stuSel.filter(x=>ids.indexOf(x)<0);
    redrawTab();
  };
  if(F('selNone')) F('selNone').onclick = ()=>{ stuSel = []; redrawTab(); };
  if(F('selApply')) F('selApply').onclick = ()=>{
    const arr = c.students.filter(x=>stuSel.indexOf(x.id)>=0);
    askBox('Áp dụng lại công nợ',
      'Cập nhật công nợ của <b>'+arr.length+'</b> học viên đã chọn theo kế hoạch thu hiện tại ('+vnd(planTotal(c))+' một học viên). '+
      'Khoản đã thu giữ nguyên số tiền cũ, các khoản còn thiếu được bổ sung theo kế hoạch.',
      'Áp dụng lại', ()=>{ applyPlanTo(c, arr); stuSel = []; toast('Đã áp dụng kế hoạch thu cho '+arr.length+' học viên'); drawDetail(); });
  };
  if(F('selClear')) F('selClear').onclick = ()=>clearDebtBox(c, c.students.filter(x=>stuSel.indexOf(x.id)>=0));
  F('tabBody').querySelectorAll('[data-goto]').forEach(el=>{
    el.onclick = ()=>openClass(el.dataset.goto, 'students');
  });
  F('tabBody').querySelectorAll('[data-undo]').forEach(el=>{
    el.onclick = ()=>undoMove(c, el.dataset.undo);
  });
  F('sq').oninput = ()=>{ stuF.q = F('sq').value.trim().toLowerCase(); redrawTab(); F('sq').focus(); F('sq').setSelectionRange(999,999); };
  F('sSt').onchange = ()=>{ stuF.status = F('sSt').value; drawDetail(); };
  if(F('sAdd')) F('sAdd').onclick = ()=>studentBox(c, null);
  F('sImp').onclick = ()=>importBox(c);
  F('sTpl').onclick = downloadTemplate;
  F('sExp').onclick = ()=>exportStudents(c);
  F('detailView').querySelectorAll('.kebab[data-stu]').forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const s = c.students.find(x=>x.id===b.dataset.stu);
      const items = [
        {label:'Sửa thông tin', fn:()=>studentBox(c, s)},
        {label:'Đổi trạng thái theo học', fn:()=>statusBox(c, s)}
      ];
      if(c.fee) items.push({sep:true},
        {label:'Quản lý thanh toán', fn:()=>payBox(c, s)},
        {label:'Áp dụng lại công nợ theo kế hoạch', fn:()=>askBox('Áp dụng lại công nợ',
          'Cập nhật công nợ của <b>'+esc(s.name)+'</b> theo kế hoạch thu hiện tại ('+vnd(planTotal(c))+'). Khoản đã thu giữ nguyên.',
          'Áp dụng lại', ()=>{ applyPlanTo(c, [s]); toast('Đã áp dụng kế hoạch thu cho '+s.name); drawDetail(); })},
        {label:'Xoá toàn bộ công nợ', danger:true, fn:()=>clearDebtBox(c, [s])});
      items.push({sep:true}, {label:'Gỡ khỏi lớp', danger:true, fn:()=>removeStudent(c, s)});
      popMenu(b, items);
    };
  });
}
function redrawTab(){
  const c = get(current);
  F('tabBody').innerHTML = {info:tabInfo, students:tabStudents, sessions:tabSessions, grades:tabGrades, fees:tabFees,
    surveys:tabSurveys, teachers:tabTeachers, notices:tabNotices, regs:tabRegs}[tab](c);
  const bind = {info:bindInfo, students:bindStudents, sessions:bindSessions, grades:bindGrades, fees:bindFees,
    surveys:bindSurveys, teachers:bindTeachers, notices:bindNotices, regs:bindRegs}[tab];
  if(bind) bind(c);
}

        '<div style="flex:1"><label>Ngày ghi nhận</label><input class="input" type="date" id="stDate" value="'+iso(TODAY)+'" style="width:100%"></div>'+
        '<div style="flex:2"><label>Lý do</label><input class="input" id="stReason" placeholder="VD: chuyển ca học buổi tối" style="width:100%"></div>'+
      '</div></div>'+
    '<div class="foot"><button class="btn ghost" id="stNo">Huỷ</button><button class="btn" id="stOk">Cập nhật</button></div>');
  const sync = ()=>{
    const v = document.querySelector('input[name="stt"]:checked').value;
    F('stMove').style.display = v==='Chuyển lớp' ? '' : 'none';
    F('stMeta').style.display = v==='Đang học' ? 'none' : '';
  };
  document.querySelectorAll('input[name="stt"]').forEach(r=>{ r.onchange = sync; });
  sync();
  F('stNo').onclick = closeBox;
  F('stOk').onclick = ()=>{
    const v = document.querySelector('input[name="stt"]:checked').value;
    if(v === st.status && v === 'Đang học'){ closeBox(); return; }
    if(v === 'Đang học'){
      st.status = 'Đang học'; st.moveTo = ''; st.moveAt = ''; st.reason = '';
      c.moves = c.moves.filter(m=>m.stu !== st.id);
      closeBox(); toast('Đã đưa '+st.name+' về trạng thái đang học'); drawDetail(); return;
    }
    const at = F('stDate').value || iso(TODAY), reason = val('stReason');
    if(v === 'Chuyển lớp'){
      const to = F('stTo').value;
      if(!to){ F('wTo').style.display = 'block'; return; }
      const dest = get(to);
      if(dest.capacity && actives(dest).length >= dest.capacity){ toast('Lớp '+dest.name+' đã đủ sức chứa'); return; }
      const mst = {id:uid('st'), code:st.code, name:st.name, gender:st.gender, dob:st.dob,
        phone:st.phone, email:st.email, status:'Đang học', moveTo:'', moveAt:'', reason:'',
        join:at, note:'Chuyển từ lớp '+c.name};
      if(dest.fee) mst.debt = newDebt(dest);
      dest.students.push(mst);
      st.status = 'Chuyển lớp'; st.moveTo = to; st.moveAt = at; st.reason = reason;
      c.moves.push({id:uid('mv'), stu:st.id, code:st.code, name:st.name, type:'move', to, at, reason});
      closeBox(); toast('Đã chuyển '+st.name+' sang lớp '+dest.name); drawDetail(); return;
    }
    st.status = 'Thôi học'; st.moveTo = ''; st.moveAt = at; st.reason = reason;
    c.moves.push({id:uid('mv'), stu:st.id, code:st.code, name:st.name, type:'quit', to:'', at, reason});
    closeBox(); toast('Đã ghi nhận '+st.name+' thôi học'); drawDetail();
  };
}
function undoMove(c, id){
  const m = c.moves.find(x=>x.id===id); if(!m) return;
  askBox('Hoàn tác ghi nhận',
    (m.type==='move' ? 'Đưa <b>'+esc(m.name)+'</b> về trạng thái đang học tại lớp này và gỡ bản ghi vừa thêm ở lớp '+esc(clsName(m.to))+'.'
      : 'Đưa <b>'+esc(m.name)+'</b> về trạng thái đang học tại lớp này.'),
    'Hoàn tác', ()=>{
      const st = c.students.find(x=>x.id===m.stu);
      if(st){ st.status = 'Đang học'; st.moveTo = ''; st.moveAt = ''; st.reason = ''; }
      if(m.type==='move'){
        const dest = get(m.to);
        if(dest){
          const i = dest.students.map(x=>x.code).lastIndexOf(m.code);
          if(i >= 0 && dest.students[i].note && dest.students[i].note.indexOf('Chuyển từ lớp') === 0) dest.students.splice(i,1);
        }
      }
      c.moves = c.moves.filter(x=>x.id!==id);
      toast('Đã hoàn tác'); drawDetail();
    });
}
function removeStudent(c, s){
  askBox('Gỡ học viên khỏi lớp',
    'Gỡ <b>'+esc(s.name)+'</b> khỏi lớp. Dữ liệu điểm danh, điểm và phản hồi khảo sát của học viên trong lớp này bị xoá theo.',
    'Gỡ khỏi lớp', ()=>{
      c.students = c.students.filter(x=>x.id!==s.id);
      delete c.grades[s.id];
      c.sessions.forEach(x=>{ delete x.att[s.id]; });
      c.surveys.forEach(sv=>{ sv.responses = sv.responses.filter(r=>r.stu!==s.id); });
      c.moves = c.moves.filter(m=>m.stu!==s.id);
      toast('Đã gỡ học viên khỏi lớp'); drawDetail();
    }, true);
}

function readImport(c, file){
  if(!hasXLSX()) return;
  const rd = new FileReader();
  rd.onload = ev=>{
    let rows = [];
    try{
      const wb = XLSX.read(ev.target.result, {type:'binary', cellDates:true});
      rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, raw:false, defval:''});
    }catch(err){ toast('Không đọc được file, kiểm tra lại định dạng'); return; }
    rows = rows.filter(r=>r.some(x=>String(x).trim()!==''));
    if(rows.length < 2){ toast('File không có dòng dữ liệu nào'); return; }
    IMP = rows.slice(1).map((r,i)=>{
      const o = {code:String(r[0]||'').trim(), name:String(r[1]||'').trim(), gender:String(r[2]||'').trim(),
        dob:String(r[3]||'').trim(), phone:String(r[4]||'').trim(), email:String(r[5]||'').trim(),
        note:String(r[6]||'').trim(), line:i+2, errs:[]};
      if(!o.name) o.errs.push('Thiếu họ tên');
      if(o.code && c.students.some(s=>s.code===o.code)) o.errs.push('Mã đã có trong lớp');
      if(o.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(o.email)) o.errs.push('Email sai định dạng');
      return o;
    });
    drawImport(c);
  };
  rd.readAsBinaryString(file);
}

  F('impBody').innerHTML =

    '<div style="max-height:320px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius)">'+
    '<table class="tbl"><thead><tr><th style="width:56px">Dòng</th><th style="width:108px">Mã</th><th>Họ và tên</th>'+

      '<td>'+(r.errs.length?'<span class="tag draft">'+esc(r.errs.join('; '))+'</span>':'<span class="tag on">Hợp lệ</span>')+'</td></tr>').join('')+
    '</tbody></table></div>'+
    (IMP.length-ok.length ? '<div class="note" style="margin-top:10px">Dòng lỗi được bỏ qua khi nhập. Sửa trong file rồi tải lại nếu cần đủ danh sách.</div>' : '');
  F('impAgain').onclick = ()=>importBox(c);
  const b = F('impOk');

  b.onclick = ()=>{
    if(!canAddStu(c)){ toast('Lớp đang ở trạng thái '+stLabel(c.status)+', chưa nhập được học viên'); return; }
    let n = 0;
    IMP.filter(r=>!r.errs.length).forEach(r=>{
      if(c.capacity && actives(c).length >= c.capacity) return;
      stuSeq++;
      let dob = '';
      const m = r.dob.match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
      if(m) dob = m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
      else if(/^\d{4}-\d{2}-\d{2}/.test(r.dob)) dob = r.dob.slice(0,10);
      const im = {id:uid('st'), code:r.code||'HV'+stuSeq, name:r.name, gender:r.gender||'—', dob,
        phone:r.phone, email:r.email, note:r.note, status:'Đang học', moveTo:'', moveAt:'', reason:'', join:iso(TODAY)};
      if(c.fee) im.debt = newDebt(c);
      c.students.push(im);
      n++;
    });
    closeBox(); toast('Đã nhập '+n+' học viên vào lớp'); drawDetail();
  };
}

    if(s) Object.assign(s, d);
    else c.sessions.push(Object.assign({id:uid('ss'), no:0, att:{}, attNote:{}}, d));
    reorderSessions(c);
    closeBox(); toast(s?'Đã lưu buổi học':'Đã tạo buổi học'); drawDetail();
  };
}
function reorderSessions(c){
  c.sessions.sort((a,b)=> a.date===b.date ? a.from.localeCompare(b.from) : a.date.localeCompare(b.date));
  c.sessions.forEach((s,i)=>s.no = i+1);
}
function delSession(c, s){
  if(locked(c, 'xoá buổi học')) return;
  askBox('Xoá buổi học', 'Xoá <b>'+esc(s.name)+'</b> ngày '+fmtD(s.date)+'. Dữ liệu điểm danh của buổi này bị xoá theo.',
    'Xoá buổi học', ()=>{ c.sessions = c.sessions.filter(x=>x.id!==s.id); reorderSessions(c); toast('Đã xoá buổi học'); drawDetail(); }, true);
}
function genBox(c){

  openBox('<h3>Tạo nhanh nhiều buổi</h3><div class="head-sub">Sinh lịch theo chu kỳ cố định, sửa lại từng buổi sau khi tạo</div>'+

      '<div style="flex:1.4"><label>Phòng học hoặc link</label><input class="input" id="gRoom" value="" style="width:100%"></div>'+
    '</div>'+
    '<div class="field" style="max-width:330px"><label>Giảng viên phụ trách các buổi</label>'+
      '<select class="input" id="gTeacher" style="width:100%">'+

    '</div>'+

/* ---------- màn điểm danh ---------- */

  curSes = s.id; show('session'); drawAtt();
}
function drawAtt(){

      '</div>'+

          '<button class="btn ghost sm" id="aAll">Đánh dấu tất cả có mặt</button>'+

      '<table class="tbl"><colgroup><col style="width:52px"><col class="col-code" style="width:108px"><col>'+
        '<col style="width:308px"><col style="width:230px"></colgroup>'+

      list.map((x,i)=>'<tr>'+
        '<td class="num">'+(i+1)+'</td>'+
        '<td class="col-code mono" style="color:var(--text-2)">'+esc(x.code)+'</td>'+
        '<td><span class="ellip"><b>'+esc(x.name)+'</b></span></td>'+
        '<td><div class="att">'+Object.keys(ATT).map(k=>
          '<button data-v="'+k+'" data-stu="'+x.id+'"'+(s.att[x.id]===k?' class="on"':'')+'>'+ATT[k]+'</button>').join('')+'</div></td>'+
        '<td><input class="input" style="width:100%" data-note="'+x.id+'" value="'+esc(s.attNote[x.id]||'')+'" placeholder="—"></td>'+
        '</tr>').join('')+'</tbody></table>'+
      '<div class="sum">Buổi học chuyển sang trạng thái đã dạy ngay khi lưu điểm danh có dữ liệu.</div>'+
    '</div>';
  const back = ()=>{ show('detail'); tab='sessions'; drawDetail(); };
  F('aBack').onclick = back; F('aBack2').onclick = back;
  F('aSave').onclick = ()=>{

    toast('Đã lưu điểm danh buổi '+s.no); back();
  };
  F('aAll').onclick = ()=>{ list.forEach(x=>s.att[x.id]='P'); drawAtt(); };
  F('aClear').onclick = ()=>{ s.att = {}; drawAtt(); };

      if(s.att[id] === b.dataset.v) delete s.att[id]; else s.att[id] = b.dataset.v;
      drawAtt();

    el.oninput = ()=>{ s.attNote[el.dataset.note] = el.value; };
  });

/* ---------- tab Điểm ---------- */
function tabGrades(c){
  if(!c.grading)
    return '<div class="empty">Lớp chưa bật tính điểm học phần nên bảng điểm chưa có hiệu lực.'+
      '<div style="margin-top:14px"><button class="btn" id="gEnable">Bật tính điểm cho lớp này</button></div></div>';
  const cps = c.gradeCfg.comps, w = cps.reduce((s,x)=>s+x.weight,0);
  const list = actives(c);
  const isW = c.gradeCfg.mode !== 'coef';
  const head = '<div class="pills">'+cps.map(cp=>'<span class="pill">'+esc(cp.name)+' · '+
      (isW ? cp.weight+'%' : 'hệ số '+cp.weight)+(cp.src==='att'?' · tự động từ điểm danh':'')+'</span>').join('')+
      (isW ? '<span class="pill" style="'+(w===100?'border-color:#a7f3d0;color:var(--success)':'border-color:#fcd34d;color:var(--warn)')+'">Tổng trọng số '+w+'%</span>'
           : '<span class="pill" style="border-color:#bfdbfe;color:var(--primary)">Trung bình theo hệ số · tổng hệ số '+w+'</span>')+
      '<span class="pill">'+esc(gScale(c).label)+'</span></div>'+
    '<div class="rowbar"><span class="hint">'+(isW? 'Tổng kết tính theo trọng số từng cột, cột lấy tự động từ điểm danh không nhập tay'
      : esc(coefFormula(cps)))+'</span>'+
      '<span class="right" style="display:flex;gap:8px">'+
        (list.length? '<button class="btn ghost" id="gExp">Xuất Excel</button>':'')+
        (c.nature!=='hoc' && list.length? '<button class="btn ghost" id="gCert">Cấp '+
          esc(NATURE[c.nature].toLowerCase().replace('có cấp ',''))+'</button>':'')+
        '<button class="btn" id="gCfg">Cấu hình cột điểm</button></span></div>';
  if(!list.length)
    return head + '<div class="empty">Lớp chưa có học viên đang học. Cột điểm cấu hình được trước, bảng điểm hiện lên ngay khi lớp có học viên.</div>';
  const scored = list.filter(s=>stuScore(c,s.id)!=null);
  const passed = scored.filter(s=>stuScore(c,s.id) >= c.gradeCfg.passScore).length;
  return '<div class="stat">'+
      '<div><span>Có điểm</span><b>'+scored.length+' / '+list.length+'</b></div>'+
      '<div><span>Đạt</span><b>'+passed+'</b></div>'+
      '<div><span>Chưa đạt</span><b>'+(scored.length-passed)+'</b></div>'+
      '<div><span>Điểm đạt tối thiểu</span><b>'+showPass(c)+'</b></div>'+
      (c.nature!=='hoc' ? '<div><span>Đủ điều kiện cấp</span><b>'+list.filter(s=>certOK(c,s.id)).length+'</b></div>'+
        '<div><span>Đã cấp</span><b>'+list.filter(s=>s.cert).length+'</b></div>' : '')+
    '</div>'+
    head+
    '<table class="tbl" style="table-layout:auto"><thead><tr><th class="num" style="width:52px">STT</th>'+
      '<th class="col-code" style="width:104px">Mã</th><th>Họ và tên</th>'+
      cps.map(cp=>'<th class="num">'+esc(cp.name)+'<div class="note" style="margin:2px 0 0">'+
        (isW ? cp.weight+'%' : 'hệ số '+cp.weight)+'</div></th>').join('')+
      '<th class="num">Tổng kết<div class="note" style="margin:2px 0 0">'+esc(gScale(c).unit)+'</div></th><th>Kết quả</th>'+
      (c.nature!=='hoc'?'<th>Xét cấp</th>':'')+'</tr></thead><tbody>'+
    list.map((s,i)=>{
      const sc = stuScore(c,s.id), a = stuAtt(c,s.id), pass = sc!=null && sc >= c.gradeCfg.passScore;
      return '<tr><td class="num">'+(i+1)+'</td><td class="col-code mono" style="color:var(--text-2)">'+esc(s.code)+'</td>'+
        '<td><span class="ellip"><b>'+esc(s.name)+'</b></span></td>'+
        cps.map(cp=>{
          if(cp.src==='att'){
            const v = a==null? null : Math.round(a/100*gMax(c)*10)/10;
            return '<td class="num">'+(v==null?'<span style="color:var(--text-3)">—</span>':(isLetter(c)?letterOf(v):v))+
              '<div class="note" style="margin:2px 0 0">'+(a==null?'chưa có':a+'%')+'</div></td>';
          }

          if(isLetter(c))
            return '<td class="num"><select class="input sc" style="width:86px" data-stu="'+s.id+'" data-cp="'+cp.id+'">'+
              '<option value="">—</option>'+LETTERS.map(l=>'<option value="'+l[1]+'"'+
                (g!=null && Math.abs(g-l[1])<0.001?' selected':'')+'>'+l[0]+'</option>').join('')+'</select></td>';
          return '<td class="num"><input class="input sc" type="number" step="0.1" min="0" max="'+gMax(c)+'" '+
            'data-stu="'+s.id+'" data-cp="'+cp.id+'" value="'+(g==null?'':g)+'"></td>';
        }).join('')+
        '<td class="num"><b>'+(sc==null?'<span style="color:var(--text-3)">—</span>':showScore(c,sc))+'</b></td>'+
        '<td>'+(sc==null?'<span class="tag off">Chưa có điểm</span>':(pass?'<span class="tag on">Đạt</span>':'<span class="tag" style="color:var(--danger);background:#fef2f2;border-color:#fecaca">Chưa đạt</span>'))+'</td>'+
        (c.nature!=='hoc'?'<td>'+(s.cert? '<span class="tag on">Đã cấp</span>'+
            '<span class="ellip mono" style="color:var(--text-3);font-size:12px">'+esc(s.cert.no)+'</span>'
          : sc==null? '<span style="color:var(--text-3)">—</span>'
          : certOK(c,s.id)? '<span class="tag trial" style="margin:0">Đủ điều kiện</span>'
          : '<span class="tag draft">Chưa đủ</span>')+'</td>':'')+
        '</tr>';
    }).join('')+'</tbody></table>'+
    '<div class="sum">Bảng điểm chỉ liệt kê học viên đang học, học viên chuyển lớp hoặc thôi học được tách khỏi kết quả lớp. '+
      'Điểm tổng kết tính trên '+esc(gScale(c).unit)+' đang chọn, cột chưa có điểm được bỏ qua và hệ số của cột đó không tính vào mẫu số. Điều kiện xét cấp '+
      esc(NATURE[c.nature].toLowerCase())+' đặt trong hộp Cấu hình cột điểm.</div>';
}
function bindGrades(c){
  if(F('gEnable')){ F('gEnable').onclick = ()=>{ c.grading = true; toast('Đã bật tính điểm học phần'); drawDetail(); }; return; }
  if(F('gCfg')) F('gCfg').onclick = ()=>{ if(!locked(c,'sửa cấu hình cột điểm')) cfgBox(c); };
  if(F('gExp')) F('gExp').onclick = ()=>exportGrades(c);
  if(F('gCert')) F('gCert').onclick = ()=>{
    const arr = actives(c).filter(x=>certOK(c,x.id) && !x.cert);
    const done = actives(c).filter(x=>x.cert).length;
    if(!arr.length){ toast(done? 'Toàn bộ học viên đủ điều kiện đã được cấp' : 'Chưa có học viên nào đủ điều kiện xét cấp'); return; }
    askBox('Cấp '+NATURE[c.nature].toLowerCase().replace('có cấp ',''),
      'Cấp cho <b>'+arr.length+'</b> học viên đủ điều kiện của lớp <b>'+esc(c.name)+'</b>. '+
      'Hệ thống sinh số hiệu theo thứ tự và ghi ngày cấp là hôm nay. Sau khi cấp đủ cho toàn bộ học viên đủ điều kiện, lớp đã kết thúc sẽ không mở lại được.',
      'Cấp cho '+arr.length+' học viên', ()=>{
        arr.forEach(st=>{ certSeqRun++; st.cert = {no:'CC'+String(certSeqRun).padStart(5,'0'), at:iso(TODAY)}; });
        toast('Đã cấp cho '+arr.length+' học viên'); drawDetail();
      });
  };
  F('tabBody').querySelectorAll('.sc[data-cp]').forEach(el=>{
    if(c.status === 'done'){ el.disabled = true; return; }
    el.onchange = ()=>{
      const g = c.grades[el.dataset.stu] = c.grades[el.dataset.stu] || {};
      if(el.value === '') delete g[el.dataset.cp];
      else g[el.dataset.cp] = Math.round(parseFloat(el.value)*100)/100;
      redrawTab();
    };
  });
}
var certSeqRun = 900;
var GC = null;
function cfgBox(c){

  drawCfg(c);
}

          : 'Theo thang '+mx+' đang chọn, tổng kết từ '+GC.passScore+' trở lên là đạt')+'</div></div>'+
      (c.nature!=='hoc' ? '<div style="flex:0 0 230px"><label>Chuyên cần tối thiểu để xét cấp (%)</label>'+
        '<input class="input" type="number" id="cAtt" value="'+GC.minAtt+'" style="width:100%">'+
        '<div class="note">Học viên được xét cấp '+esc(NATURE[c.nature].toLowerCase().replace('có cấp ',''))+
        ' khi đạt cả điểm tổng kết và tỷ lệ chuyên cần</div></div>' : '')+
    '</div>'+
    '<div class="foot"><button class="btn ghost" id="cNo">Huỷ</button><button class="btn" id="cOk">Lưu cấu hình</button></div>', 'wide');
  F('cNo').onclick = closeBox;
  F('cAdd').onclick = ()=>{ readCfg(); GC.comps.push({id:uid('gc'), name:'Cột điểm mới', src:'manual', weight:0}); drawCfg(c); };
  F('cMode').onchange = ()=>{
    readCfg();
    const to = F('cMode').value;
    if(to !== GC.mode){
      if(to === 'coef'){                                   // trọng số phần trăm sang hệ số rút gọn
        const g = GC.comps.reduce((a,x)=>gcd(a, Math.round(x.weight)), 0) || 1;
        GC.comps.forEach(x=>{ x.weight = Math.max(1, Math.round(x.weight/g)); });
      } else {                                             // hệ số sang trọng số, chốt tổng 100
        const tot = GC.comps.reduce((a,x)=>a+x.weight, 0) || 1;
        let acc = 0;
        GC.comps.forEach((x,i)=>{
          x.weight = (i === GC.comps.length-1) ? 100-acc : Math.round(x.weight/tot*100);
          if(i < GC.comps.length-1) acc += x.weight;
        });
      }
    }
    GC.mode = to; drawCfg(c);
  };
  F('cScale').onchange = ()=>{
    readCfg();
    const old = SCALES[GC.scale].max;
    GC.scale = F('cScale').value;
    const nw = SCALES[GC.scale].max;
    GC.passScore = Math.round(GC.passScore/old*nw*10)/10;
    if(GC.scale === 'letter') GC.passScore = valOf(letterOf(GC.passScore));
    drawCfg(c);
  };
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>{ readCfg(); GC.comps.splice(+el.dataset.del,1); drawCfg(c); };
  });
  document.querySelectorAll('[data-mv]').forEach(el=>{
    el.onclick = ()=>{
      readCfg();
      const i = +el.dataset.i, j = i + (+el.dataset.mv);
      if(j < 0 || j >= GC.comps.length) return;
      const t = GC.comps[i]; GC.comps[i] = GC.comps[j]; GC.comps[j] = t;
      drawCfg(c);
    };
  });
  document.querySelectorAll('[data-f]').forEach(el=>{
    el.onchange = ()=>{ readCfg(); drawCfg(c); };
  });
  F('cOk').onclick = ()=>{
    readCfg();
    const sum2 = GC.comps.reduce((a,x)=>a+x.weight,0);
    if(!GC.comps.length){ toast('Cần ít nhất một cột điểm'); return; }
    if(GC.mode === 'weight' && sum2 !== 100){ toast('Tổng trọng số đang là '+sum2+'%, phải bằng 100%'); return; }
    if(GC.mode === 'coef' && sum2 <= 0){ toast('Tổng hệ số phải lớn hơn 0'); return; }
    if(F('cAtt')) c.cert = {minScore:GC.passScore, minAtt:+F('cAtt').value||0};
    const oldSc = c.gradeCfg.scale || '10', mx2 = SCALES[GC.scale].max;
    const f = mx2 / SCALES[oldSc].max;
    Object.keys(c.grades).forEach(k=>Object.keys(c.grades[k]).forEach(g=>{
      let v = c.grades[k][g] * f;                      // quy đổi điểm đã nhập sang thang mới
      if(GC.scale === 'letter') v = valOf(letterOf(v));
      c.grades[k][g] = Math.min(mx2, Math.round(v*100)/100);
    }));
    delete GC.minAtt;
    c.gradeCfg = GC;
    closeBox(); toast('Đã lưu cấu hình cột điểm'); drawDetail();
  };
}
function readCfg(){
  document.querySelectorAll('[data-f]').forEach(el=>{
    const cp = GC.comps[+el.dataset.i], f = el.dataset.f;
    if(!cp) return;
    cp[f] = (f==='weight') ? (+el.value||0) : el.value;
  });
  if(F('cPass')) GC.passScore = +F('cPass').value||0;
  if(F('cAtt')) GC.minAtt = +F('cAtt').value||0;
}
function exportGrades(c){
  if(!hasXLSX()) return;
  const cps = c.gradeCfg.comps;
  const aoa = [['STT','Mã','Họ và tên'].concat(cps.map(x=>x.name+(c.gradeCfg.mode==='coef'?' (hệ số '+x.weight+')':' ('+x.weight+'%)'))).concat(['Tổng kết '+gScale(c).unit,'Kết quả'])];
  actives(c).forEach((s,i)=>{
    const a = stuAtt(c,s.id), sc = stuScore(c,s.id);
    aoa.push([i+1, s.code, s.name].concat(cps.map(cp=> cp.src==='att'
      ? (a==null?'':(isLetter(c)?letterOf(a/100*gMax(c)):Math.round(a/100*gMax(c)*10)/10))
      : ((c.grades[s.id]||{})[cp.id] == null ? '' : (isLetter(c)? letterOf(c.grades[s.id][cp.id]) : c.grades[s.id][cp.id]))))
      .concat([plainScore(c,sc), sc==null?'Chưa có điểm':(sc>=c.gradeCfg.passScore?'Đạt':'Chưa đạt')]));
  });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'BangDiem');
  XLSX.writeFile(wb, 'Bang-diem-'+c.code+'.xlsx');
  toast('Đã xuất bảng điểm');
}

      popMenu(b, [
        {label:'Sửa khoản thu', fn:()=>feeBox(c, f)},

function feeBox(c, f){
  if(locked(c, 'sửa kế hoạch thu')) return;
  const used = c.feePlan.map(x=>x.code);
  const left = FEECAT.filter(x=>x.active && used.indexOf(x.code) < 0);
  if(!f && !left.length){ toast('Đã đưa hết khoản thu trong danh mục vào lớp'); return; }
  const cur = f ? feeCat(f.code) : left[0];
  openBox('<h3>'+(f?'Sửa khoản thu':'Thêm khoản thu vào lớp')+'</h3>'+
    '<div class="head-sub">'+esc(c.name)+' · số tiền sửa lại được, để nguyên nếu dùng đơn giá danh mục</div>'+
    '<div class="field"><label>Khoản thu trong danh mục</label>'+
      (f ? '<div class="input" style="display:flex;align-items:center;background:#f8fafc;color:var(--text-2)">'+esc(f.name)+' · '+esc(f.code)+'</div>'
         : '<select class="input" id="feCode">'+left.map(x=>'<option value="'+x.code+'">'+esc(typeName(x.type))+' · '+esc(x.name)+' · '+vnd(feePrice(x))+'</option>').join('')+'</select>')+
      '<div class="note" id="feHint">'+(f? 'Đơn giá danh mục: '+vnd(f.listPrice)+(f.vat? ' (đã gồm VAT '+f.vat+'%)':'')
        : 'Đơn giá danh mục: '+vnd(feePrice(cur))+(cur.vat? ' (đã gồm VAT '+cur.vat+'%, giá chưa thuế '+vnd(cur.price)+')':''))+'</div></div>'+
    '<div class="field" style="display:flex;gap:14px">'+
      '<div style="flex:1"><label>Số tiền áp dụng cho lớp</label>'+
        '<input class="input" type="number" min="0" step="1000" id="feAmt" value="'+(f? f.amount : cur.price)+'" style="width:100%"></div>'+
      '<div style="flex:1"><label>Tính chất</label><select class="input" id="feReq" style="width:100%">'+
        '<option value="1"'+((!f || f.required)?' selected':'')+'>Bắt buộc, tính vào công nợ</option>'+
        '<option value="0"'+((f && !f.required)?' selected':'')+'>Tuỳ chọn, học viên tự chọn</option></select></div>'+
    '</div>'+
    '<div class="field"><label>Ghi chú</label><input class="input" id="feNote" value="'+esc(f? f.note : '')+'" placeholder="VD: đã gồm ưu đãi ghi danh sớm"></div>'+
    '<div class="foot"><button class="btn ghost" id="feNo">Huỷ</button>'+
      '<button class="btn" id="feOk">'+(f?'Lưu':'Thêm vào kế hoạch')+'</button></div>');
  F('feNo').onclick = closeBox;
  if(F('feCode')) F('feCode').onchange = ()=>{
    const x = feeCat(F('feCode').value);
    F('feHint').textContent = 'Đơn giá danh mục: '+vnd(feePrice(x))+(x.vat? ' (đã gồm VAT '+x.vat+'%, giá chưa thuế '+vnd(x.price)+')':'');
    F('feAmt').value = feePrice(x);
  };
  F('feOk').onclick = ()=>{
    const amt = +F('feAmt').value||0, req = F('feReq').value === '1', note = val('feNote');
    if(f){ f.amount = amt; f.required = req; f.note = note; }
    else {
      const x = feeCat(F('feCode').value);
      c.feePlan.push({id:uid('fe'), code:x.code, name:x.name, group:typeName(x.type), vat:x.vat, listPrice:feePrice(x), amount:amt, required:req, note});
    }
    closeBox(); toast(f?'Đã lưu khoản thu':'Đã thêm khoản thu vào kế hoạch'); drawDetail();
  };

const QT = {single:'Một lựa chọn', multi:'Nhiều lựa chọn', rating:'Thang điểm 1–5', text:'Tự luận ngắn'};
function svState(sv){
  const t = iso(TODAY);
  if(!sv.published) return '<span class="tag draft">Nháp</span>';
  if(sv.end && sv.end < t) return '<span class="tag off">Đã đóng</span>';
  if(sv.start && sv.start > t) return '<span class="tag trial" style="margin:0">Chờ mở</span>';
  return '<span class="tag on">Đang mở</span>';
}
function svAvg(sv){
  const rq = sv.qs.filter(q=>q.t==='rating');
  if(!rq.length || !sv.responses.length) return null;
  let s=0, n=0;
  sv.responses.forEach(r=>rq.forEach(q=>{ const v = r.a[q.id]; if(v){ s+=+v; n++; } }));
  return n? Math.round(s/n*100)/100 : null;
}

        const sent = c.students.length, res = sv.responses.length, avg = svAvg(sv);
