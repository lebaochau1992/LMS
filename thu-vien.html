<!doctype html>
<html lang="vi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện tài nguyên · EGO LMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="edot.css">
<style>
.lib{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.lib{grid-template-columns:minmax(0,1fr)}}
.cdn{border:1px solid var(--ems-border);border-radius:8px;background:var(--ems-surface)}
.cdn summary{padding:9px 14px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ems-text-2)}
.cdn .in{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 4px;font-size:12px;color:var(--ems-muted);font-weight:600}
.side-h button{border:0;background:transparent;color:var(--ems-navy);font:600 12px var(--font);cursor:pointer;padding:0}
.side-h button:hover{text-decoration:underline}
.folders{padding:4px 6px 8px}
.fold{display:flex;align-items:center;gap:6px;width:100%;border:0;background:transparent;padding:6px 6px 6px 8px;border-radius:var(--r-ctl);font:500 13px var(--font);color:var(--ems-text);cursor:pointer;text-align:left}
.fold:hover{background:var(--ems-surface-2)}
.fold.on{background:var(--ems-navy-soft);color:var(--ems-navy);font-weight:600}
.fold .fn{flex:1;min-width:0}
.fold .fn b{display:block;font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .fn small{display:block;font-size:11px;font-weight:400;color:var(--ems-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .cnt{font-size:12px;color:var(--ems-muted);font-variant-numeric:tabular-nums}
.fold .tw{width:14px;flex:none;color:var(--ems-muted);font-size:10px;text-align:center}
.fold .ic{flex:none;color:var(--ems-warning)}
.fold .mo{border:0;background:transparent;color:var(--ems-muted);cursor:pointer;padding:0 4px;border-radius:4px;font-size:14px;line-height:1}
.fold .mo:hover{background:var(--ems-border);color:var(--ems-text)}
.fold-sep{border-top:1px solid var(--ems-border);margin:6px 4px}
.cur{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--ems-border);font-size:13px}
.cur h2{font-size:14px}
.bulk{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--ems-navy-soft);border-bottom:1px solid var(--ems-navy-line);font-size:13px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:14px 16px}
.fc{border:1px solid var(--ems-border);border-radius:10px;overflow:hidden;background:var(--ems-surface);display:flex;flex-direction:column;min-width:0}
.fc.sel{border-color:var(--ems-navy);box-shadow:0 0 0 3px var(--ems-focus)}
.fc .th{position:relative;height:84px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(135deg,#3f5fc9,#5a45d6)}
.fc .th.pdf{background:linear-gradient(135deg,#c2410c,#dc2626)}
.fc .th.anh{background:linear-gradient(135deg,#047857,#0d9488)}
.fc .th.audio{background:linear-gradient(135deg,#b45309,#d97706)}
.fc .th input{position:absolute;left:8px;top:8px;width:16px;height:16px}
.fc .th .ty{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;background:rgba(0,0,0,.28);border-radius:4px;padding:1px 6px}
.fc .bd{padding:9px 11px;display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.fc .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc .mt{font-size:11px;color:var(--ems-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc .ac{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:5px;font-size:12px}
.fc .ac button{border:0;background:transparent;padding:0;font:600 12px var(--font);color:var(--ems-navy);cursor:pointer}
.fc .ac button:hover{text-decoration:underline}
.fc .ac .icon-btn{margin-left:auto;color:var(--ems-muted);padding:0 6px;font-size:15px}
.use-link{border:0;background:transparent;padding:0;font:600 11px var(--font);color:var(--ems-navy);cursor:pointer}
.use-link:hover{text-decoration:underline}
.dup-row{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--ems-border);border-radius:var(--r-ctl)}
.more{display:flex;justify-content:center;padding:0 16px 16px}
</style>
</head><body>
<div class="page" id="app"></div>
<input type="file" id="upFile" multiple hidden accept="video/*,audio/*,image/*,application/pdf,.pdf,.mp4,.mp3,.png,.jpg,.jpeg">
<script src="lms-core.js"></script>
<script>
(function(){ 'use strict';
var U = LMS.ui, esc = U.esc;
var UNF = 'Chưa phân thư mục';
var LOAI_CLS = { 'Video': '', 'PDF': 'pdf', 'Ảnh': 'anh', 'Audio': 'audio' };
var ICON = { 'Video': '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10l6-3v10l-6-3z"/></svg>', 'PDF': '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/></svg>', 'Ảnh': '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>', 'Audio': '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>' };
var FOLDER_IC = '<svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
var st = { folder: '', ct: '', q: '', loai: '', sort: 'moi', unused: false, dup: false, open: {}, sel: [], limit: 24 };
var app = document.getElementById('app');
var usageCache = {};
var tbl = { clearSel: function(){ st.sel = []; }, render: function(){ renderList(); } };

function files(){ return LMS.db.thuVien; }
function tms(){ return LMS.db.thuMuc || (LMS.db.thuMuc = []); }
function me(){ return LMS.db.meta.user.ten; }
function folderOf(f){ return f.thuMuc && f.thuMuc !== UNF ? f.thuMuc : UNF; }
function fmtSize(kb){ if (kb == null) return '—'; if (kb >= 1048576) return (kb / 1048576).toFixed(2).replace('.', ',') + ' GB'; if (kb >= 1024) return (kb / 1024).toFixed(1).replace('.', ',') + ' MB'; return kb + ' KB'; }
function usage(id){ if (!usageCache[id]) usageCache[id] = LMS.fileUsage(id); return usageCache[id]; }
function hashGroups(){ var g = {}; files().forEach(function(f){ (g[f.hash] = g[f.hash] || []).push(f); }); return g; }
function isDup(f, groups){ return (groups[f.hash] || []).length > 1; }
function inFolder(f, path){ if (!path) return true; var p = folderOf(f); if (path === UNF) return p === UNF; return p === path || p.indexOf(path + '/') === 0; }
function ent(path){ return tms().filter(function(m){ return m.duongDan === path; })[0] || null; }
function chu(path){ return LMS.thuMucCua(path); }
function tenDV(m){ return m && m.donVi ? LMS.donViTen(m.donVi) : 'Dùng chung toàn Học viện'; }
function canPath(path){ if (LMS.phamVi.all) return true; if (!path || path === UNF) return true; var m = chu(path); return !!(m && m.donVi && LMS.phamVi.ids[m.donVi]); }
function canFile(f){ var p = folderOf(f); if (p === UNF) return LMS.phamVi.all || f.nguoiTai === me(); return canPath(p); }
function ctOfPath(path){ var m = chu(path); return m ? m.chuongTrinh : null; }
function okCT(path){ return !st.ct || ctOfPath(path) === st.ct; }
function slug(x){ return U.norm(x).replace(/[^a-z0-9/]+/g, '-').replace(/^-|-$/g, ''); }
function keyOf(f){ var p = folderOf(f); return (p === UNF ? 'chua-phan-thu-muc' : slug(p)) + '/' + f.ten; }
function folderList(){ var s = {}; tms().forEach(function(m){ s[m.duongDan] = 1; }); files().forEach(function(f){ var p = folderOf(f); if (p !== UNF) s[p] = 1; }); Object.keys(s).forEach(function(p){ var parts = p.split('/'); while (parts.length > 1) { parts.pop(); s[parts.join('/')] = 1; } }); return Object.keys(s).sort(function(a,b){ return a.localeCompare(b, 'vi'); }); }
function ctGoc(){ return LMS.db.chuongTrinh.filter(function(c){ return !c.cha; }); }
function loaiFromFile(file){
  var t = file.type || '', n = file.name.toLowerCase();
  if (/^video\//.test(t) || /\.(mp4|mov|webm|mkv)$/.test(n)) return 'Video';
  if (/^audio\//.test(t) || /\.(mp3|wav|m4a|ogg)$/.test(n)) return 'Audio';
  if (/^image\//.test(t) || /\.(png|jpe?g|gif|webp|svg)$/.test(n)) return 'Ảnh';
  if (t === 'application/pdf' || /\.pdf$/.test(n)) return 'PDF';
  return null;
}
function copyText(txt, ok){
  function fb(){ try { var ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } catch (e) {} U.toast(ok, 'ok'); }
  try { if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(function(){ U.toast(ok, 'ok'); }, fb); else fb(); } catch (e) { fb(); }
}

/* ---------- khung trang ---------- */
function shell(){
  app.innerHTML =
    '<div class="page-head"><div><h1>Thư viện tài nguyên</h1><div class="sub" id="sub"></div></div>' +
    '<div class="actions"><button class="btn primary" id="bUp"></button></div></div>' +
    '<div class="kpis" id="kpis"></div>' +
    '<details class="cdn" id="cdn"><summary>Cấu hình base-URL server media / CDN (theo loại)</summary><div class="in" id="cdnIn"></div></details>' +
    '<div class="lib"><div class="panel"><div style="padding:12px 12px 0"><div class="field"><label for="fCT">Chương trình đào tạo</label><select class="sel" id="fCT"></select></div></div>' +
      '<div class="side-h"><span>Thư mục</span><button id="bNewFolder">+ Thư mục</button></div><div class="folders" id="tree"></div></div>' +
    '<div class="panel"><div class="cur" id="cur"></div><div class="panel-head filters">' +
      '<select class="sel" id="fLoai" style="flex:0 1 150px"><option value="">Tất cả loại tệp</option><option>Video</option><option>PDF</option><option>Ảnh</option><option>Audio</option></select>' +
      '<input class="inp" id="fQ" placeholder="Tìm theo tên tệp hoặc khoá">' +
      '<select class="sel" id="fSort" style="flex:0 1 150px" aria-label="Sắp xếp"><option value="moi">Mới tải lên</option><option value="ten">Tên A–Z</option><option value="kb">Dung lượng lớn</option></select>' +
      '<button class="btn" id="bAll">Chọn tất cả</button>' +
    '</div><div id="bulk"></div><div id="list"></div></div></div>';
  document.getElementById('bUp').onclick = function(){ if (!canPath(st.folder || UNF)) { U.toast('Thư mục này do đơn vị khác quản lý, không tải tệp lên được', 'bad'); return; } document.getElementById('upFile').click(); };
  document.getElementById('bNewFolder').onclick = function(){ folderForm(null, st.folder && st.folder !== UNF && canPath(st.folder) ? st.folder : ''); };
  document.getElementById('fQ').oninput = function(e){ st.q = e.target.value; st.limit = 24; renderList(); };
  document.getElementById('fLoai').onchange = function(e){ st.loai = e.target.value; st.limit = 24; renderList(); };
  document.getElementById('fSort').onchange = function(e){ st.sort = e.target.value; renderList(); };
  document.getElementById('fCT').onchange = function(e){ st.ct = e.target.value; if (st.folder && st.folder !== UNF && !okCT(st.folder)) st.folder = ''; st.limit = 24; renderAll(); };
  document.getElementById('bAll').onclick = function(){ var r = filteredRows().filter(canFile), all = r.length && r.every(function(f){ return st.sel.indexOf(f.id) >= 0; }); st.sel = all ? [] : r.map(function(f){ return f.id; }); renderList(); };
  document.getElementById('upFile').onchange = onUpload;
  var list = document.getElementById('list');
  list.addEventListener('click', function(e){
    var b = e.target.closest('[data-a]'); if (!b) return; var f = LMS.byId('thuVien', b.dataset.id); if (!f) return; var a = b.dataset.a;
    if (a === 'mv') moveDialog([f.id]); else if (a === 'key') copyText(keyOf(f), 'Đã sao chép khoá tệp'); else if (a === 'use') usageDialog(f); else if (a === 'more') rowMenu(b, f);
  });
  list.addEventListener('change', function(e){ var c = e.target.closest('[data-sel]'); if (!c) return; var id = c.dataset.sel; st.sel = st.sel.filter(function(x){ return x !== id; }); if (c.checked) st.sel.push(id); c.closest('.fc').classList.toggle('sel', c.checked); renderBulk(); });
}

function filteredRows(){
  var nq = U.norm(st.q.trim());
  var r = files().filter(function(f){
    if (!inFolder(f, st.folder)) return false;
    if (st.ct && !(folderOf(f) !== UNF && okCT(folderOf(f)))) return false;
    if (st.loai && f.loai !== st.loai) return false;
    if (st.unused && usage(f.id).length) return false;
    if (st.dup && !isDup(f, st.groups)) return false;
    if (nq && U.norm(f.ten + ' ' + keyOf(f)).indexOf(nq) < 0) return false;
    return true;
  });
  r.sort(st.sort === 'ten' ? function(a,b){ return a.ten.localeCompare(b.ten, 'vi'); } : st.sort === 'kb' ? function(a,b){ return (b.kb || 0) - (a.kb || 0); } : function(a,b){ return a.ngay < b.ngay ? 1 : -1; });
  return r;
}

function renderAll(){
  usageCache = {};
  st.groups = hashGroups();
  var all = files(), tot = 0, unused = 0, dupFiles = 0, dupWaste = 0;
  all.forEach(function(f){ tot += f.kb || 0; if (!usage(f.id).length) unused++; });
  Object.keys(st.groups).forEach(function(h){ var g = st.groups[h]; if (g.length > 1) { dupFiles += g.length; dupWaste += (g.length - 1) * (g[0].kb || 0); } });
  var nDV = {}; tms().forEach(function(m){ if (m.donVi) nDV[m.donVi] = 1; });
  document.getElementById('sub').textContent = all.length + ' tệp · ' + fmtSize(tot) + ' · gom theo thư mục, mỗi thư mục do một đơn vị quản lý';
  var k = document.getElementById('kpis');
  k.innerHTML =
    '<div class="kpi"><div class="k-label">Tổng số tệp</div><div class="k-val">' + all.length + '</div><div class="k-sub">' + folderList().length + ' thư mục · ' + Object.keys(nDV).length + ' đơn vị quản lý</div></div>' +
    '<div class="kpi"><div class="k-label">Dung lượng</div><div class="k-val">' + fmtSize(tot) + '</div><div class="k-sub">Video chiếm ' + (tot ? Math.round(all.filter(function(f){ return f.loai === 'Video'; }).reduce(function(s,f){ return s + f.kb; }, 0) / tot * 100) : 0) + '%</div></div>' +
    '<div class="kpi clickable ' + (unused ? 'warn' : 'ok') + (st.unused ? ' active' : '') + '" data-k="unused"><div class="k-label">Chưa được sử dụng</div><div class="k-val">' + unused + '</div><div class="k-sub">Không gắn vào bài giảng nào</div></div>' +
    '<div class="kpi clickable ' + (dupFiles ? 'bad' : 'ok') + (st.dup ? ' active' : '') + '" data-k="dup"><div class="k-label">Trùng nội dung</div><div class="k-val">' + dupFiles + '</div><div class="k-sub">' + (dupWaste ? 'Có thể giải phóng ' + fmtSize(dupWaste) : 'Không có tệp trùng') + '</div></div>';
  k.querySelectorAll('[data-k]').forEach(function(el){ el.onclick = function(){ var key = el.dataset.k; st[key] = !st[key]; st.limit = 24; renderAll(); }; });
  document.getElementById('fCT').innerHTML = U.opts(ctGoc().map(function(c){ return { id: c.id, t: c.ten }; }), 'id', 't', st.ct, 'Tất cả chương trình');
  renderCdn(); renderTree(); renderList();
}

function renderCdn(){
  var c = LMS.db.cauHinhMedia || (LMS.db.cauHinhMedia = {}), ro = !LMS.phamVi.all;
  document.getElementById('cdnIn').innerHTML = '<div class="form-grid">' + ['Video', 'PDF', 'Ảnh', 'Audio'].map(function(l){ return '<div class="field"><label>' + l + '</label><input class="inp" data-cdn="' + l + '" value="' + esc(c[l] || '') + '" placeholder="https://…"' + (ro ? ' readonly' : '') + '></div>'; }).join('') + '</div>' +
    '<div class="row"><span class="muted small">Đường dẫn phát tệp = base-URL của loại tệp + khoá tệp. ' + (ro ? 'Chỉ quản trị hệ thống sửa được cấu hình này.' : '') + '</span>' + (ro ? '' : '<button class="btn sm primary right" id="cdnSave">Lưu cấu hình</button>') + '</div>';
  var b = document.getElementById('cdnSave'); if (b) b.onclick = function(){
    var bad = null, v = {}; document.querySelectorAll('[data-cdn]').forEach(function(i){ var x = i.value.trim().replace(/\/+$/, ''); if (x && !/^https?:\/\/[^\s]+$/.test(x)) bad = i.dataset.cdn; v[i.dataset.cdn] = x; });
    if (bad) { U.toast('Base-URL của ' + bad + ' phải bắt đầu bằng http:// hoặc https://', 'bad'); return; }
    var truoc = JSON.parse(JSON.stringify(c)); Object.keys(v).forEach(function(l){ c[l] = v[l]; });
    LMS.commit('Sửa', 'Cấu hình media', 'Base-URL server media / CDN', truoc, v); U.toast('Đã lưu cấu hình base-URL', 'ok');
  };
}

function renderTree(){
  var all = files(), paths = folderList().filter(function(p){ return okCT(p) || folderList().some(function(x){ return x.indexOf(p + '/') === 0 && okCT(x); }); });
  function total(p){ return all.filter(function(f){ return inFolder(f, p); }).length; }
  var nAll = st.ct ? all.filter(function(f){ return folderOf(f) !== UNF && okCT(folderOf(f)); }).length : all.length;
  var h = '<div class="fold' + (st.folder === '' ? ' on' : '') + '" data-f="" role="button" tabindex="0"><span class="tw"></span><span class="fn"><b>Tất cả</b></span><span class="cnt">' + nAll + '</span></div>';
  if (!st.ct) h += '<div class="fold' + (st.folder === UNF ? ' on' : '') + '" data-f="' + UNF + '" role="button" tabindex="0"><span class="tw"></span><span class="fn"><b>' + UNF + '</b></span><span class="cnt">' + all.filter(function(f){ return folderOf(f) === UNF; }).length + '</span></div>';
  h += '<div class="fold-sep"></div>';
  function kids(parent){ return paths.filter(function(p){ var i = p.lastIndexOf('/'); return (i < 0 ? '' : p.slice(0, i)) === parent; }); }
  function node(p, depth){
    var ch = kids(p), open = st.open[p] !== false, name = p.split('/').pop(), m = chu(p), mine = canPath(p);
    h += '<div class="fold' + (st.folder === p ? ' on' : '') + '" data-f="' + esc(p) + '" role="button" tabindex="0" style="padding-left:' + (8 + depth * 14) + 'px"><span class="tw"' + (ch.length ? ' data-tw="' + esc(p) + '"' : '') + '>' + (ch.length ? (open ? '▾' : '▸') : '') + '</span>' + FOLDER_IC + '<span class="fn" title="' + esc(p + ' · ' + tenDV(m)) + '"><b>' + esc(name) + '</b><small>' + esc(tenDV(m)) + '</small></span><span class="cnt">' + total(p) + '</span>' + (mine ? '<button class="mo" data-mo="' + esc(p) + '" aria-label="Thao tác thư mục ' + esc(name) + '">⋯</button>' : '') + '</div>';
    if (open) ch.forEach(function(c){ node(c, depth + 1); });
  }
  kids('').forEach(function(p){ node(p, 0); });
  if (!paths.length) h += '<div class="muted small" style="padding:8px">Chưa có thư mục</div>';
  var t = document.getElementById('tree'); t.innerHTML = h;
  t.querySelectorAll('[data-f]').forEach(function(b){
    b.onclick = function(e){
      var mo = e.target.closest('[data-mo]'); if (mo) { e.stopPropagation(); folderMenu(mo, mo.dataset.mo); return; }
      var tw = e.target.closest('[data-tw]'); if (tw) { st.open[tw.dataset.tw] = st.open[tw.dataset.tw] === false; renderTree(); return; }
      st.folder = b.dataset.f; st.sel = []; st.limit = 24; renderTree(); renderList();
    };
    b.onkeydown = function(e){ if (e.target === b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); b.click(); } };
  });
}

function renderCur(n){
  var el = document.getElementById('cur'), p = st.folder, up = document.getElementById('bUp');
  var name = !p ? 'Tất cả' : p === UNF ? UNF : p.split('/').pop();
  up.textContent = 'Tải tệp lên · ' + (!p ? UNF : name);
  var ok = canPath(p || UNF); up.disabled = !ok; up.title = ok ? '' : 'Thư mục do đơn vị khác quản lý';
  if (!p || p === UNF) { el.innerHTML = '<h2>' + esc(name) + '</h2><span class="muted small">' + n + ' tệp' + (p === UNF ? ' · tệp chưa xếp vào thư mục, chỉ người tải lên và quản trị hệ thống quản lý' : '') + '</span>'; return; }
  var m = chu(p), self = ent(p), ct = m && m.chuongTrinh ? LMS.byId('chuongTrinh', m.chuongTrinh) : null;

function onUpload(e){

  list.forEach(function(file){
    var loai = loaiFromFile(file); if (!loai) { bad.push(file.name); return; }
    var kb = Math.max(1, Math.round(file.size / 1024));
    var same = files().find(function(f){ return f.ten.toLowerCase() === file.name.toLowerCase() && f.kb === kb; });
    items.push({ file: file, loai: loai, kb: kb, dup: same || null });
  });
  if (bad.length) U.toast('Bỏ qua ' + bad.length + ' tệp không đúng định dạng (chỉ nhận video, PDF, ảnh, âm thanh)', 'bad');
  if (!items.length) return;
  var dest = st.folder || UNF;
  if (!canPath(dest)) { U.toast('Thư mục này do đơn vị khác quản lý, không tải tệp lên được', 'bad'); return; }
  var dups = items.filter(function(i){ return i.dup; });
  if (!dups.length) { doUpload(items, dest); return; }
  var body = '<div class="note warn">' + dups.length + ' tệp trùng tên và dung lượng với tệp đã có trong thư viện:</div><ul style="margin:0;padding-left:18px">' + dups.map(function(i){ return '<li><b>' + esc(i.file.name) + '</b> — đã có tại “' + esc(folderOf(i.dup)) + '”, tải ngày ' + LMS.fmtDate(i.dup.ngay) + '</li>'; }).join('') + '</ul>';
  U.modal({ title: 'Phát hiện tệp trùng', body: body, size: 'sm', foot: [
    { label: 'Hủy' },
    { label: 'Vẫn tải lên', onClick: function(){ doUpload(items, dest); } },
    { label: 'Bỏ qua tệp trùng', cls: 'primary', onClick: function(){ var rest = items.filter(function(i){ return !i.dup; }); if (rest.length) doUpload(rest, dest); else U.toast('Không có tệp mới để tải lên'); } }
  ] });
}
function doUpload(items, dest){
  var u = LMS.db.meta.user.ten;
  items.forEach(function(i){
    LMS.db.thuVien.push({ id: LMS.nextId('f'), ten: i.file.name, loai: i.loai, thuMuc: dest, kb: i.kb, hash: i.dup ? i.dup.hash : 'u' + i.kb + '-' + U.norm(i.file.name), ngay: LMS.iso(new Date()), nguoiTai: u });
  });
  LMS.commit('Tải lên', 'Tệp tài nguyên', items.length + ' tệp → ' + dest);
  U.toast('Đã tải lên ' + items.length + ' tệp vào “' + dest + '”', 'ok');
  renderAll();
}

shell();
renderAll();
LMS.onChange(renderAll);
})();
</script>
</body></html>
